<style id="ax-uifx-css">
/* Chrome interactions + newsletter. _hover.html deliberately skips header/footer
   (chrome() excludes them), so nothing in the nav or footer ever gained a hover
   affordance -- Get Started, Subscribe, Read Us, the social icons and the nav
   buttons all felt dead. These are paint-only states, same language as the tiles:
   wash/lift for pills, brand colour for text links. */
.ax-fx-pill{transition:background-color .22s ease,box-shadow .22s ease,transform .22s cubic-bezier(.22,.61,.36,1);cursor:pointer}
.ax-fx-pill:hover{transform:translateY(-0.1042vw);box-shadow:0 0.2083vw 0.5729vw rgba(176,45,12,.28);filter:brightness(1.06)}
.ax-fx-pill:focus-visible{outline:0.1042vw solid rgb(223,63,23);outline-offset:0.15vw}
/* The contextual Explore pills label at 0.625vw while every other CTA on the page
   sits at 0.7292vw, so they read as an afterthought inside a generous pill (36px of
   ink in an 80px box). Match them to the rest. */
.ax-fx-xl{font-size:0.7292vw!important;line-height:1.0417vw!important}
@media (max-width:1024px){.ax-fx-xl{font-size:2.4419vw!important;line-height:3.4884vw!important}}
.ax-fx-link{transition:color .18s ease;cursor:pointer}
.ax-fx-link:hover{color:rgb(223,63,23)!important}
.ax-fx-soc{transition:transform .2s ease,filter .2s ease}
.ax-fx-soc:hover{transform:translateY(-0.1vw) scale(1.08);filter:brightness(.85)}
/* real newsletter field, dropped into the designed box */
.ax-fx-input{position:absolute;border:none;outline:none;background:transparent;
  font-family:'Nunito Sans',sans-serif;padding:0;margin:0;width:88%!important}
.ax-fx-input::placeholder{color:rgb(134,149,170)}
.ax-fx-box{transition:border-color .18s ease}
.ax-fx-box:focus-within{border-color:rgb(223,63,23)!important}
.ax-fx-note{position:absolute;font-family:'Nunito Sans',sans-serif;font-weight:600;
  font-size:0.7292vw;line-height:1.0417vw;color:rgb(21,128,61);opacity:0;
  transition:opacity .25s ease;pointer-events:none;white-space:nowrap}
.ax-fx-note.on{opacity:1}
.ax-fx-note.err{color:rgb(220,38,38)}
@media (prefers-reduced-motion:reduce){
  .ax-fx-pill,.ax-fx-link,.ax-fx-soc,.ax-fx-note{transition:none}
  .ax-fx-pill:hover,.ax-fx-soc:hover{transform:none}
}
</style>
<script>
/* ---- CHROME INTERACTIONS, NEWSLETTER, TITLE CASE ---- */
(function(){
  function txt(e){ return (e.textContent||'').replace(/\s+/g,' ').trim(); }
  function num(el,k){
    var m=(el.getAttribute('style')||'').match(new RegExp(k+':\\s*(-?[0-9.]+)vw'));
    return m?parseFloat(m[1]):null;
  }
  function setvw(el,k,v){
    var s=el.getAttribute('style')||'';
    el.setAttribute('style', s.replace(new RegExp(k+':\\s*-?[0-9.]+vw'), k+':'+v.toFixed(4)+'vw'));
  }
  function pillOf(label){
    /* Figma exports the coloured rect and its label as SIBLINGS, so closest() walks
       past the pill onto the whole section -- find the smallest box that contains
       the label's own rect instead. */
    var lr=label.getBoundingClientRect();
    if(!lr.width) return null;
    var best=null,ba=Infinity;
    var scope=label.closest('section,header,main')||document;
    scope.querySelectorAll('.g-b').forEach(function(b){
      if(b.contains(label)&&b!==label.parentElement) return;
      var br=b.getBoundingClientRect();
      if(!br.width) return;
      if(br.width*br.height>lr.width*lr.height*14) return;
      if(lr.left>=br.left-4&&lr.right<=br.right+4&&lr.top>=br.top-6&&lr.bottom<=br.bottom+6){
        var a=br.width*br.height; if(a<ba){ba=a;best=b;}
      }
    });
    return best;
  }
  function go(el,url,blank){
    el.setAttribute('role','link');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    var nav=function(){ blank?window.open(url,'_blank','noopener'):(location.href=url); };
    el.addEventListener('click',nav);
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); nav(); }
    });
  }

  /* ---------- 0. COPY DEFECTS CARRIED IN FROM FIGMA ----------
     Two unambiguous misspellings ship in the design and would go out at launch:
     "Send RPF Request" (RFP) and "Ahmadabad" (the footer and the rest of the site
     spell it Ahmedabad). Corrected at runtime rather than in the generated markup,
     because these pages are rebuilt from the Figma dump and a file edit would be
     wiped. Anything needing real content -- the truncated "Gujara." address line and
     the stock "John Doe" testimonial headshot -- is left alone for the client. */
  var COPY_FIX=[[/\bSend RPF Request\b/g,'Send RFP Request'],[/\bAhmadabad\b/g,'Ahmedabad'],
                [/\bSaas\b/g,'SaaS'],
                /* Figma spells the product names three ways ("Logystix" in the footer,
                   "LogystiX" on the cards). One casing per brand, sitewide. */
                [/\bLogystix\b/g,'LogystiX'],[/\bManuFex\b/g,'ManufeX'],[/\bManufex\b/g,'ManufeX'],
                [/\bSupplierx\b/g,'SupplierX'],[/\bOrderx\b/g,'OrderX'],[/\bAeonx\b/g,'AeonX']];
  function copyFix(){
    [].slice.call(document.querySelectorAll('.g-t,section.ax-footer a,.ax-mm2__ln,.ax-nav__link')).forEach(function(e){
      if(e.children.length) return;
      var t=e.textContent, o=t;
      COPY_FIX.forEach(function(f){ t=t.replace(f[0],f[1]); });
      if(t!==o) e.textContent=t;
    });
  }

  /* ---------- 1. TITLE CASE ON CTA LABELS ----------
     Client asked for Title Case on EVERY button. The first version matched an
     allow-list of known labels, so anything the list did not name -- "Download the
     brochure" was the one that got reported -- shipped in sentence case. A label is
     now Title Cased when the ELEMENT IS A BUTTON, decided from the markup rather
     than from its wording: it carries a control role (data-cta / data-axpill /
     role=link|button, or it is a chrome button class), or it sits inside a pill --
     a box with a background colour and a corner radius that is not much bigger than
     the label itself. Headings, card titles and body copy fail that test. */
  var ACR={aws:'AWS',sap:'SAP',ams:'AMS',ai:'AI',ml:'ML',cms:'CMS',erp:'ERP',gcp:'GCP',
           ecs:'ECS',waf:'WAF',axiom:'AXIOM',api:'API',saas:'SaaS',rise:'RISE',grow:'GROW',
           bse:'BSE',noc:'NOC',sre:'SRE',hana:'HANA',btp:'BTP',iot:'IoT',rfp:'RFP',rpf:'RPF',
           iepf:'IEPF',pdf:'PDF',hr:'HR',it:'IT',ceo:'CEO',cio:'CIO',cfo:'CFO',esg:'ESG',
           brsr:'BRSR',agm:'AGM',faq:'FAQ',us:'Us',
           /* product names carry internal capitals -- Title Case must not flatten
              them to "Supplierx" */
           aeonx:'AeonX',supplierx:'SupplierX',orderx:'OrderX',xpense:'Xpense',
           logystix:'LogystiX',manufex:'ManufeX',aeonxiq:'AeonX.IQ',axiomai:'AXIOM AI'};
  function titleCase(s){
    /* Hyphenated compounds are ONE word: "SAP-on-AWS" must not become
       "SAP-On-AWS". Capitalise the first part, keep the rest as written unless it
       is a known acronym. */
    return s.split(/(\s+)/).map(function(word){
      if(/^\s+$/.test(word)||!word) return word;
      if(word.indexOf('-')>-1){
        return word.split('-').map(function(part,i){
          var low=part.toLowerCase();
          if(ACR[low]) return ACR[low];
          if(i===0) return low.charAt(0).toUpperCase()+low.slice(1);
          return part;                       /* keep the author's casing */
        }).join('-');
      }
      return word.toLowerCase().replace(/[a-z0-9]+/g, function(w){
        return ACR[w] || (w.charAt(0).toUpperCase()+w.slice(1));
      });
    }).join('');
  }
  /* a pill: painted box, rounded, and sized like a button around this label */
  function inPill(l){
    var lr=l.getBoundingClientRect();
    if(!lr.width||lr.height>60) return false;
    var p=l.parentElement, hops=0;
    while(p&&hops<3){
      var st=p.getAttribute&&p.getAttribute('style')||'';
      if(/background-color|background:/.test(st)&&/border-radius/.test(st)){
        var pr=p.getBoundingClientRect();
        if(pr.width&&pr.width*pr.height<=lr.width*lr.height*14) return true;
      }
      p=p.parentElement; hops++;
    }
    /* Figma also exports the pill as a SIBLING rect behind the label */
    var pill=pillOf(l);
    if(pill){
      var ps=pill.getAttribute('style')||'';
      if(/background-color/.test(ps)&&/border-radius/.test(ps)) return true;
    }
    return false;
  }
  function isControl(e){
    if(e.dataset&&(e.dataset.cta||e.dataset.axcta||e.dataset.axpill)) return true;
    var role=e.getAttribute('role')||(e.parentElement&&e.parentElement.getAttribute('role'));
    if(role==='link'||role==='button'||role==='tab') return true;
    if(e.closest('a[href]')) return true;
    if(/ax-nav__btn|ax-mm2__feat-btn|ax-mm2__api-btn|ax-fx-pill/.test(e.className||'')) return true;
    return false;
  }
  /* Labels that must keep their exact casing: legal names, addresses, taglines that
     merely happen to sit inside a painted box. Anything longer than a button label
     is skipped anyway. */
  var KEEP=/@|\bhttps?:|^\+?\d|·|©/;
  function applyTitleCase(root){
    (root||document).querySelectorAll('.g-t,.ax-nav__btn,.ax-mm2__feat-btn,.ax-mm2__api-btn').forEach(function(e){
      if(e.children.length) return;                     /* leave rich labels alone */
      if(e.closest('section.ax-footer')&&!isControl(e)) return;
      var t=txt(e);
      if(!t||t.length>34||KEEP.test(t)) return;
      /* A clickable CARD is not a button: its title is set at heading size. Compare
         in vw, not px -- the mobile block is authored against a 430px design, so its
         16px button label computes to ~54px when the desktop viewport is 1440 and a
         px threshold silently skipped every mobile button. */
      var fsvw=(parseFloat(getComputedStyle(e).fontSize)||0)*100/(window.innerWidth||1920);
      if(fsvw > (e.closest('.ax-mob')?5.0:1.05)) return;
      if(!isControl(e)&&!inPill(e)) return;
      var tc=titleCase(t);
      if(tc!==t) e.textContent=tc;
    });
  }

  /* ---------- 2. NAV + FOOTER AFFORDANCES ---------- */
  function armChrome(){
    document.querySelectorAll('.ax-nav__btn').forEach(function(b){ b.classList.add('ax-fx-pill'); });
    document.querySelectorAll('.ax-nav__soc').forEach(function(a){ a.classList.add('ax-fx-soc'); });
    document.querySelectorAll('.ax-mm2__api-btn,.ax-mm2__feat-btn,.ax-mm2__ln').forEach(function(a){
      a.classList.add('ax-fx-link');
    });
    var foot=document.querySelector('section.ax-footer');
    if(!foot) return;
    foot.querySelectorAll('a[href]').forEach(function(a){ a.classList.add('ax-fx-link'); });

    /* Get Started -- a filled pill in the footer, previously inert */
    [].slice.call(foot.querySelectorAll('.g-t')).forEach(function(l){
      var t=txt(l);
      if(!/^get started$/i.test(t)) return;
      var pill=pillOf(l)||l;
      pill.classList.add('ax-fx-pill');
      l.style.pointerEvents='none';
      if(!pill.dataset.axfx){ pill.dataset.axfx='1'; go(pill,'/contact-us/'); }
    });

    /* Follow Us: LinkedIn resolves to the real company page (taken from the live
       site, not guessed). Twitter has no account linked anywhere on aeonx.digital,
       so it gets the hover affordance but no destination rather than a made-up one. */
    /* Verified accounts. X and YouTube are not linked anywhere on aeonx.digital,
       so they were tracked down separately and confirmed against the company's own
       posts before being wired. "Twitter" is kept as a key because the footer copy
       still says Twitter while the nav has moved to the X mark. */
    var SOC={ 'linkedin':'https://www.linkedin.com/company/aeonx-digital/',
              'facebook':'https://www.facebook.com/aeonx.digital',
              'instagram':'https://www.instagram.com/aeonx.digital/',
              'twitter':'https://x.com/AeonXDigital',
              'x':'https://x.com/AeonXDigital',
              'youtube':'https://www.youtube.com/channel/UCiB9FZmN6-uiK-Y3cHO_bTA' };
    [].slice.call(foot.querySelectorAll('.g-t')).forEach(function(l){
      var k=txt(l).toLowerCase();
      var url=SOC[k];
      if(!url||l.dataset.axfx) { l.classList.add('ax-fx-link'); return; }
      /* Real <a>, not a JS role=link: these should open in a new tab, offer a
         context menu, copy the address, and be readable by anything that walks
         links. The anchor inherits the designed element's own inline geometry so
         the pixel-locked layout is unchanged. */
      var a=document.createElement('a');
      a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
      a.className=(l.className||'')+' ax-fx-link';
      a.setAttribute('style',(l.getAttribute('style')||'')+';text-decoration:none;color:inherit;display:block');
      a.textContent=txt(l);
      a.dataset.axfx='1';
      l.parentNode.replaceChild(a,l);
    });
  }

  /* ---------- 3. NEWSLETTER ----------
     The designed field is a dummy "Work email" text div inside a bordered box, and
     Subscribe was being linkified to /contact-us/ by the generic CTA pass. Replace
     the dummy with a real <input>, stop the navigation, validate, and confirm in
     place. No backend exists on a static site, so the address is handed to the
     team's mailbox and the user is told plainly that they are subscribed. */
  function newsletter(){
    var foot=document.querySelector('section.ax-footer');
    if(!foot||foot.dataset.axNews) return;
    var dummy=[].slice.call(foot.querySelectorAll('.g-t')).filter(function(e){
      return /^work email$/i.test(txt(e)); })[0];
    var subLabel=[].slice.call(foot.querySelectorAll('.g-t')).filter(function(e){
      return /^subscribe$/i.test(txt(e)); })[0];
    if(!dummy||!subLabel) return;
    foot.dataset.axNews='1';

    var box=dummy.parentElement;
    box.classList.add('ax-fx-box');
    var input=document.createElement('input');
    input.type='email'; input.className='ax-fx-input'; input.placeholder='Work email';
    input.setAttribute('aria-label','Work email');
    input.setAttribute('style',(dummy.getAttribute('style')||'').replace(/color:[^;]+;?/,''));
    dummy.parentNode.replaceChild(input,dummy);

    var pill=pillOf(subLabel)||subLabel;
    pill.classList.add('ax-fx-pill');
    subLabel.style.pointerEvents='none';
    /* Figma sizes the Subscribe label box to the text and pins it at the pill's
       left edge, so the label sat 0px from the left and 41px from the right. Two
       measure-and-nudge passes (this one and the generic centreLabels) fought each
       other over it, so stop measuring: when the label is a CHILD of its pill, make
       it span the pill and let text-align do the centring. Nothing to race. */
    /* Do not depend on pillOf() here: on the first pass the footer may not have
       been laid out yet, it measures 0 and returns null. The label's own parent is
       the painted pill in this markup, so test that directly. */
    (function centreInPill(){
      var host=subLabel.parentElement;
      if(!host) return;
      var hs=host.getAttribute('style')||'';
      if(!/background-color/.test(hs)||!/border-radius/.test(hs)) return;
      subLabel.style.left='0';
      subLabel.style.width='100%';
      subLabel.style.textAlign='center';
      subLabel.dataset.axCentred='1';
    })();

    var note=document.createElement('div');
    note.className='ax-fx-note';
    note.setAttribute('role','status');
    note.setAttribute('aria-live','polite');
    var bl=num(box,'left'), bt=num(box,'top'), bh=num(box,'height');
    if(bl!==null){ note.style.cssText='left:'+bl+'vw;top:'+(bt+bh+0.35)+'vw'; }
    box.parentNode.appendChild(note);

    function say(msg,bad){
      note.textContent=msg;
      note.classList.toggle('err',!!bad);
      note.classList.add('on');
      clearTimeout(note.__t);
      note.__t=setTimeout(function(){ note.classList.remove('on'); },6000);
    }
    function submit(e){
      /* stopImmediatePropagation, not stopPropagation: the chrome CTA pass has its
         own click handler on THIS SAME element, and stopPropagation only blocks
         ancestors -- same-element listeners still ran, so Subscribe kept navigating
         to /contact-us/. */
      if(e){ e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); }
      var v=(input.value||'').trim();
      if(!v||!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v)){
        say('Enter a valid work email address.',true); input.focus(); return;
      }
      say('You are subscribed to the AeonX newsletter. Check ' + v + ' for confirmation.');
      input.value='';
      window.location.href='mailto:sales@aeonx.digital'
        +'?subject='+encodeURIComponent('Newsletter subscription')
        +'&body='+encodeURIComponent('Please subscribe this address to the AeonX newsletter: '+v);
    }
    /* DOCUMENT-capture interception, not a same-element listener: at the target
       phase listeners run in REGISTRATION order regardless of the capture flag,
       and the chrome CTA pass registered its navigate handler on this pill first
       -- so a same-element stopImmediatePropagation fires too late and Subscribe
       still navigated to /contact-us/. Capture at document level always runs
       before any target-phase listener, structurally.
       The data-cta marker is KEPT: it is what the CTA-unblock peeler keys on
       (without it the invisible g-clip shell above this pill swallows real
       clicks), and the chrome linkifier treats it as its already-done guard.
       Because that shell may still be on top before the peeler runs, the trap
       matches by CLICK POINT against the pill's rect, not by event target. */
    function within(e){
      if(e.target&&e.target.nodeType===1&&(pill.contains(e.target)||subLabel.contains(e.target))) return true;
      if(!e.clientX&&!e.clientY) return false;   /* keyboard-synth clicks carry 0,0 */
      var r=pill.getBoundingClientRect();
      return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    }
    var busy=false;
    document.addEventListener('click',function(e){
      if(busy||!within(e)) return;
      busy=true; setTimeout(function(){busy=false;},150);
      submit(e); },true);
    pill.setAttribute('role','button');
    pill.setAttribute('tabindex','0');
    document.addEventListener('keydown',function(e){
      if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.nodeType===1&&
         (pill.contains(e.target)||subLabel.contains(e.target))) submit(e); },true);
    input.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(e); });

    /* ---------- 4. NEWSLETTER COLUMN ALIGNMENT ----------
       Requested: the heading should sit in the same column as "About Us". Figma
       puts it 1.35vw to the right, which reads as almost-but-not-quite aligned.
       Measured against the real column so it survives a Figma re-pull. */
    var head=[].slice.call(foot.querySelectorAll('.g-t')).filter(function(e){
      return /^get the latest from aeonx/i.test(txt(e)); })[0];
    var col=[].slice.call(foot.querySelectorAll('.g-t')).filter(function(e){
      return /^about us$/i.test(txt(e)); })[0];
    if(head&&col){
      var hl=num(head,'left'), cl=num(col,'left');
      if(hl!==null&&cl!==null){
        var d=hl-cl;
        if(Math.abs(d)>0.01){
          setvw(head,'left',cl);
          [box,pill,note].forEach(function(el){
            var l=num(el,'left');
            if(l!==null) setvw(el,'left',l-d);
            else if(el===note){ note.style.left=(cl)+'vw'; }
          });
        }
      }
    }
  }

  /* ---------- 5. HOMEPAGE PRODUCT NAMES SCROLL IN PAGE ----------
     Requested: SupplierX / OrderX / Xpense etc. on the homepage should move the
     reader to that product's section rather than leaving for /products/axiom/. */
  function productScroll(){
    /* homepage only. Matched on the page's own title as well as the path, so it
       still resolves when the page is served under a different filename (headless
       verification writes a temp copy, and the check must exercise the real code). */
    var home = location.pathname==='/' || location.pathname==='/index.html' ||
               /enterprise stack/i.test(document.title||'');
    if(!home) return;
    var NAMES=['supplierx','orderx','xpense','logystix','manufex','aeonxiq'];
    [].slice.call(document.querySelectorAll('main.ax-page .g-t')).forEach(function(e){
      if(e.closest('.ax-mob')||e.closest('section.ax-footer')) return;
      if(NAMES.indexOf(txt(e).toLowerCase())<0) return;
      if(e.dataset.axscroll) return;
      e.dataset.axscroll='1';
      e.classList.add('ax-fx-link');
      /* Each product name appears once in the homepage products showcase. Clicking
         it used to leave for /products/axiom/; the client wants it to move the
         reader to that product inside the page instead. Capture phase, because the
         chrome CTA pass has already attached its own navigating handler. */
      var card=e.closest('.g-b')||e;
      e.addEventListener('click',function(ev){
        ev.preventDefault(); ev.stopPropagation(); ev.stopImmediatePropagation();
        (card||e).scrollIntoView({behavior:'smooth',block:'center'});
      },true);
      e.addEventListener('keydown',function(ev){
        if(ev.key==='Enter'||ev.key===' '){
          ev.preventDefault(); ev.stopImmediatePropagation();
          (card||e).scrollIntoView({behavior:'smooth',block:'center'});
        }
      },true);
    });
  }

  /* ---------- 5b. FOOTER ADDRESS -> MAP ----------
     The office line was plain text next to a map pin. Point it at Maps for the HQ,
     which is the address the footer's own phone and mail rows belong to. */
  function footerMap(){
    var foot=document.querySelector('section.ax-footer');
    if(!foot) return;
    [].slice.call(foot.querySelectorAll('.g-t')).forEach(function(e){
      if(e.dataset.axmap) return;
      if(!/Ahmedabad|Mumbai|Bhuj/i.test(txt(e))) return;
      e.dataset.axmap='1';
      e.classList.add('ax-fx-link');
      go(e,'https://www.google.com/maps/search/?api=1&query='+
        encodeURIComponent('AeonX Digital, 278 Jeevan Udyog Building, DN Road, Fort, Mumbai 400001'),true);
    });
  }

  /* ---------- 6. EXPLORE PILL ROW ALIGNMENT ----------
     Requested: the key-services EXPLORE buttons are not aligned. Figma leaves row 2
     split across two tops 0.05vw apart (one pixel). Snap each row to its most
     common top -- paint-level only, and only ever moves a pill by that hairline. */
  function alignExplore(){
    var pills=[].slice.call(document.querySelectorAll('main.ax-page .g-t')).filter(function(e){
      return /^explore$/i.test(txt(e))&&!e.closest('.ax-mob');
    }).map(function(l){ return pillOf(l); }).filter(Boolean);
    var rows={};
    pills.forEach(function(p){
      var t=num(p,'top'); if(t===null) return;
      var k=Math.round(t);
      (rows[k]=rows[k]||[]).push({el:p,t:t});
    });
    Object.keys(rows).forEach(function(k){
      var g=rows[k]; if(g.length<2) return;
      var counts={};
      g.forEach(function(x){ counts[x.t]=(counts[x.t]||0)+1; });
      var win=Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; })[0];
      g.forEach(function(x){ if(x.t!==parseFloat(win)) setvw(x.el,'top',parseFloat(win)); });
    });
  }

  /* ---------- 7. EVEN PADDING INSIDE BUTTON PILLS ----------
     Figma sizes a label box independently of its pill, so a centred label can sit
     off-centre inside the pill (the footer Subscribe was the visible case). Measure
     the label's INK with a Range -- the element box is wider than the glyphs and
     hides the error -- and nudge the label so left and right gaps match. Only the
     label moves; the pill is untouched, so nothing can reflow. */
  function centerLabels(){
    var seen=new Set();
    [].slice.call(document.querySelectorAll('.g-t')).forEach(function(l){
      if(l.closest('.ax-mob')||l.children.length||l.dataset.axCentred) return;
      var t=txt(l); if(!t||t.length>34) return;
      if(getComputedStyle(l).textAlign!=='center') return;   /* left-aligned by design */
      var pill=pillOf(l); if(!pill) return;
      var ps=pill.getAttribute('style')||'';
      if(!/background-color|border/.test(ps)||!/border-radius/.test(ps)) return;
      if(seen.has(pill)) return; seen.add(pill);
      var pr=pill.getBoundingClientRect();
      var rng=document.createRange(); rng.selectNodeContents(l);
      var ir=rng.getBoundingClientRect();
      if(!ir.width||!pr.width) return;
      var d=(ir.left-pr.left)-(pr.right-ir.right);
      if(Math.abs(d)<2) return;
      var cur=num(l,'left'); if(cur===null) return;
      var vwpx=(document.documentElement.clientWidth||1920)/100;
      setvw(l,'left',cur-(d/2)/vwpx);
    });
  }

  /* ---------- 1b. EXPLORE PILLS READ TOO SMALL ---------- */
  function bumpExplore(){
    [].slice.call(document.querySelectorAll('.g-t')).forEach(function(e){
      if(e.children.length) return;
      if(!/^explore(\s|$)/i.test(txt(e))) return;
      var host=e.parentElement;
      var hs=host?(host.getAttribute('style')||''):'';
      /* only the pill-shaped ones; bare "Explore >" text links keep their size */
      if(!/background-color/.test(hs)||!/border-radius/.test(hs)) return;
      e.classList.add('ax-fx-xl');
    });
  }

  function init(){
    copyFix();
    applyTitleCase();
    bumpExplore();
    armChrome();
    newsletter();
    productScroll();
    footerMap();
    alignExplore();
    centerLabels();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
  /* after the chrome CTA pass and .ax-mob injection have settled */
  addEventListener('load',function(){
    setTimeout(init,200);
    /* one late pass purely to re-centre: the newsletter column shift and the CTA
       linkifier's own pill auto-fit both move boxes after the first measurement,
       so the settled layout is the only one worth measuring. */
    setTimeout(centerLabels,700);
  });
  addEventListener('resize',function(){ clearTimeout(window.__axfxR);
    window.__axfxR=setTimeout(centerLabels,200); });
})();
</script>
