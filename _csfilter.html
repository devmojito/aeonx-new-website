<style id="ax-csf-css">
/* ---- CUSTOMER STORIES: REAL SEARCH + SECTOR FILTER (/insights/) ----
   Figma ships the search bar and the sector rail as static text, and fills the
   grid with 34 copies of one placeholder story ("ASML accelerates advanced
   semiconductor lithography with Aeonx." -- a company AeonX has no relationship
   with). This fragment turns the designed controls into working ones and puts
   the real, linkable case studies in the designed slots. Layout is untouched:
   cards are moved between EXISTING slot positions, never re-styled. */
.ax-csf-input{position:absolute;left:0;top:-0.15vw;width:100%;height:1.6vw;border:0;background:transparent;outline:none;
  font-family:'Nunito Sans',sans-serif;font-weight:400;font-size:1.0417vw;line-height:1.25vw;color:rgb(35,39,46);padding:0}
.ax-csf-input::placeholder{color:rgb(134,149,170);opacity:1}
.ax-csf-chip{cursor:pointer;transition:color .2s ease,opacity .2s ease}
.ax-csf-chip:hover{color:rgb(223,63,23)}
.ax-csf-chip.is-on{color:rgb(223,63,23)!important;font-weight:700}
.ax-csf-chip.is-off{opacity:.38;cursor:default;pointer-events:none}
.ax-csf-card{transition:opacity .28s ease,transform .28s cubic-bezier(.22,.61,.36,1)}
.ax-csf-card.is-hid{opacity:0;pointer-events:none}
.ax-csf-link{cursor:pointer}
.ax-csf-empty{position:absolute;font-family:'Nunito Sans',sans-serif;font-weight:400;color:rgb(134,149,170);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.ax-csf-card,.ax-csf-chip{transition:none}}
@media (max-width:1024px){.ax-csf-input{font-size:4.6512vw;line-height:5.5814vw;height:6.5vw}}
/* ---- ALL STORIES REACHABLE ----
   Figma draws this grid as a fixed-height clipped box, and the fragment lays every
   real case study into it -- 15 cards running well past the designed height, so
   only the first two rows were ever visible and the remaining 11 were clipped away
   with no way to reach them. Let the box scroll vertically instead of shortening it
   or re-flowing the page: the cards are absolutely positioned, so the box already
   reports the full scrollHeight and nothing about the pixel-locked layout changes.
   Horizontal stays clipped -- only the vertical axis was ever overflowing. */
/* ---- ALL STORIES REACHABLE ----
   Figma draws this grid as a fixed-height clipped box and the fragment lays every
   real case study into it, running well past that height. Rather than scroll the
   SECTION -- which also holds the search box and the sector chips, so scrolling it
   dragged those along with the cards -- pan the CARDS inside it. The box keeps its
   overflow:hidden, so the page height never changes and the filter column stays
   exactly where the design put it.
   Panned with `translate`, not `transform`: the scroll-reveal already owns
   transform on these elements (.ax-rv/.ax-in) and the standalone property composes
   with it instead of overriding it. One custom property drives every card, so this
   is a single style write per frame regardless of card count. */
.ax-csf-card{translate:0 calc(-1 * var(--csf-off, 0px))}
.ax-csf-pan{cursor:grab}
.ax-csf-pan.is-drag{cursor:grabbing}
.ax-csf-nav{position:absolute;z-index:6;width:2.0833vw;height:2.0833vw;min-width:30px;min-height:30px;
  border-radius:99px;border:1px solid rgba(35,39,46,.16);background:#fff;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0.2vw 0.6vw rgba(15,23,42,.10);
  transition:opacity .2s ease,background-color .2s ease}
.ax-csf-nav:hover{background:#F6F7F9}
.ax-csf-nav[disabled]{opacity:.3;cursor:default}
.ax-csf-nav svg{width:42%;height:42%;display:block}
.ax-csf-nav:focus-visible{outline:2px solid rgb(223,63,23);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ax-csf-nav{transition:none}}
</style>
<script>
(function(){

  var POSTS=[
    {t:"AeonX modernizing the Gopal Namkeen processing system using SAP/AWS",

     s:"", g:"AWS · DISASTER RECOVERY",
     i:"https://dhixs8fi5fryo.cloudfront.net/blog/2022/8a1f33abb43d-02_Aeonx-blog-02-1.jpg"},
    {t:"Success Story of Technology Adoption",
     u:"/2022/09/06/success-story-of-technology-adoption/12/09/24/1003/sap/admin/",
     s:"TECHNOLOGY & SOFTWARE", g:"SAP · ADOPTION",
     i:"https://dhixs8fi5fryo.cloudfront.net/blog/2022/c848294e8c5a-02_Aeonx-blog-01.jpg"},
    {t:"Modernizing an Enterprise CRM Platform using Amazon ECS Fargate and AWS CI/CD",
     u:"/2026/01/22/modernizing-enterprise-crm-and-employee-platforms-with-aws-fargate-and-end-to-end-ci-cd/10/00/00/243171/aws/rajat-jindal/",
     s:"TECHNOLOGY & SOFTWARE", g:"AWS · FARGATE · CI/CD",
     i:"https://dhixs8fi5fryo.cloudfront.net/blog/2026/8908c847595f-blog1-architecture-diagram.png"},
    {t:"Architecting a Secure Multi-Application Platform with CI/CD and Cross-Region DR on AWS",
     u:"/2026/01/29/architecting-a-secure-multi-application-platform-with-ci-cd-and-cross-region-disaster-recovery-on-aws/10/00/00/243183/aws/rajat-jindal/",
     s:"TECHNOLOGY & SOFTWARE", g:"AWS · CI/CD · DR",
     i:"https://dhixs8fi5fryo.cloudfront.net/blog/2026/80dd265d9d9f-blog2-architecture-diagram.png"},
    {t:"Architecting a Secure Multi-VPC R&D Platform on AWS with Hybrid Connectivity",
     u:"/2026/01/26/architecting-a-secure-multi-vpc-rd-platform-on-aws-with-hybrid-connectivity-and-ci-cd-automation/01/23/06/243191/aws/rajat-jindal/",
     s:"TECHNOLOGY & SOFTWARE", g:"AWS · NETWORKING",
     i:""}
  ];

  function txt(e){ return (e.textContent||'').replace(/\s+/g,' ').trim(); }
  /* Read the inline value through el.style, not a regex over the raw attribute:
     other passes (hover/CTA) rewrite these properties, and the browser
     re-serialises the whole attribute with spaces ("left: 34.8438vw") and
     sometimes in px ("width: 108px"), which a naive attribute regex misses. */
  function num(el,prop){
    var v=el.style[prop]; if(!v) return null;
    var m=/^(-?[\d.]+)(vw|px)$/.exec(String(v).trim()); if(!m) return null;
    return m[2]==='vw'?parseFloat(m[1]):parseFloat(m[1])*100/window.innerWidth;
  }
  function setv(el,prop,v){ el.style[prop]=v.toFixed(4)+'vw'; }
  /* Geometry comes from the INLINE vw style, never from getBoundingClientRect:
     the desktop block is display:none below 1025px (and the mobile block above it),
     so a rect-based pass silently measures 0x0 and groups nothing on whichever
     breakpoint is not currently rendered. */
  function box(el){
    var l=num(el,'left'), t=num(el,'top'), w=num(el,'width'), h=num(el,'height');
    if(l===null||t===null||w===null||h===null) return null;
    return {l:l,t:t,w:w,h:h,r:l+w,b:t+h};
  }
  function inside(a,b,pad){ pad=pad||0.05; return a.l>=b.l-pad&&a.r<=b.r+pad&&a.t>=b.t-pad&&a.b<=b.b+pad; }
  function fsize(el){ return parseFloat(getComputedStyle(el).fontSize)||0; }

  /* Originals are cached the first time anyone asks: the second grid must not read
     a height the first grid has already shortened. */
  var ORIGS=[];
  function ORIG(el,prop){
    if(!el) return null;
    for(var i=0;i<ORIGS.length;i++) if(ORIGS[i].el===el&&ORIGS[i].p===prop) return ORIGS[i].v;
    var v=num(el,prop); ORIGS.push({el:el,p:prop,v:v}); return v;
  }

  /* The chrome CTA pass registers its navigate handler on these same elements
     BEFORE this fragment runs, and at the target phase listeners fire in
     registration order regardless of the capture flag -- so a same-element
     stopImmediatePropagation is too late (clicking the MANUFACTURING chip
     navigated to /industries/manufacturing/). Intercept at document capture,
     which structurally precedes every target-phase listener. */
  function capture(el,fn){
    document.addEventListener('click',function(e){
      var t=e.target;
      var hit=(t&&t.nodeType===1&&(el===t||el.contains(t)));
      if(!hit&&(e.clientX||e.clientY)){
        var r=el.getBoundingClientRect();
        hit=r.width>0&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
      }
      if(!hit) return;
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      fn(e);
    },true);
  }

  function build(sec){
    if(sec.dataset.axCsf) return; sec.dataset.axCsf='1';
    var kids=[].slice.call(sec.children);
    var boxes=kids.map(box);

    /* --- cards: one per "Read the story" pill, grouped by the pill's own card shell --- */
    var cards=[];
    kids.forEach(function(p,pi){
      if(!/g-b/.test(p.className||'')||!/^read the story$/i.test(txt(p))) return;
      var pb=boxes[pi]; if(!pb) return;
      var best=-1, bestA=Infinity;
      kids.forEach(function(k,i){
        var b=boxes[i]; if(!b||i===pi) return;
        if(b.w<pb.w*2||b.h<pb.h*4) return;
        if(!inside(pb,b)) return;
        var a=b.w*b.h; if(a<bestA){ bestA=a; best=i; }
      });
      if(best<0) return;
      var sb=boxes[best];
      var mem=[];
      kids.forEach(function(k,i){
        var b=boxes[i]; if(!b) return;
        if(b.l>=sb.l-0.1&&b.l<=sb.r+0.1&&b.t+b.h/2>=sb.t-0.1&&b.t+b.h/2<=sb.b+0.1) mem.push(k);
      });
      if(mem.indexOf(kids[best])<0) mem.push(kids[best]);
      cards.push({ shell:kids[best], slot:{l:sb.l,t:sb.t},
        mem:mem.map(function(k){ var b=box(k); return { el:k, dl:b.l-sb.l, dt:b.t-sb.t }; }) });
    });
    if(cards.length<2) return;
    cards.sort(function(a,b){ return (a.slot.t-b.slot.t)||(a.slot.l-b.slot.l); });
    var slots=cards.map(function(c){ return {l:c.slot.l,t:c.slot.t}; });

    /* --- per-card content handles + fill placeholders with real stories --- */
    var used=0;
    cards.forEach(function(c){
      var all=[];
      c.mem.forEach(function(m){
        if(/g-t/.test(m.el.className||'')&&txt(m.el)) all.push(m.el);
        [].slice.call(m.el.querySelectorAll('.g-t')).forEach(function(e){ if(txt(e)) all.push(e); });
      });
      var title=null,tag=null,tmax=-1;
      all.forEach(function(e){
        if(/^read the story$/i.test(txt(e))) return;
        var fs=fsize(e);
        if(fs>tmax){ tmax=fs; title=e; }
      });
      all.forEach(function(e){
        if(e===title||tag||/^read the story$/i.test(txt(e))) return;
        tag=e;
      });
      c.title=title; c.tag=tag;
      c.img=c.mem.map(function(m){ return m.el; }).filter(function(e){ return /g-img/.test(e.className||''); })[0];

      if(title&&ASML.test(txt(title))){
        var p=POSTS[used++];
        if(!p){ c.dead=true; }
        else{
          title.textContent=p.t;
          title.style.whiteSpace='normal';
          if(tag) tag.textContent=p.g;
          if(c.img&&p.i) c.img.style.backgroundImage='url('+p.i+')';
          c.post=p;
        }
      }
      if(!c.dead){
        c.text=((title?txt(title):'')+' '+(tag?txt(tag):'')+' '+((c.post&&c.post.s)||'')).toLowerCase();
        c.sector=((c.post&&c.post.s)||(tag?txt(tag):'')).toUpperCase();
        if(c.post){
          /* Only the "Read the story" pill opens the story. The whole card used to:
             a click on the image or the title took the reader away mid-browse. */
          var go=function(){ location.href=c.post.u; };
          c.mem.forEach(function(m){
            if(!/^read the story$/i.test(txt(m.el))) return;
            m.el.setAttribute('role','link'); m.el.setAttribute('tabindex','0');
            m.el.dataset.axTo=c.post.u;
            m.el.classList.add('ax-csf-link'); capture(m.el,go);
            m.el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(e); } });
          });
        }
        else {
          /* Six designed stories have no page to open (no per-story pages exist yet).
             The chrome CTA pass had already dressed their "Read the story" pill as a
             link -- strip that affordance rather than ship a pill that does nothing. */
          c.mem.forEach(function(m){
            if(!/^read the story$/i.test(txt(m.el))) return;
            m.el.style.cursor='default'; m.el.removeAttribute('role'); m.el.removeAttribute('tabindex');
            m.el.classList.remove('ax-hv-clk');
            [].slice.call(m.el.querySelectorAll('*')).forEach(function(x){ x.style.cursor='default'; });
          });
        }
        c.mem.forEach(function(m){ m.el.classList.add('ax-csf-card'); });
      }
    });

    var live=cards.filter(function(c){ return !c.dead; });
    cards.filter(function(c){ return c.dead; }).forEach(function(c){
      c.mem.forEach(function(m){ m.el.style.display='none'; });
    });

    /* --- controls: search field, sector chips, result count --- */
    var texts=kids.filter(function(k){ return /g-t/.test(k.className||''); });
    kids.forEach(function(k){ [].slice.call(k.querySelectorAll('.g-t')).forEach(function(e){ texts.push(e); }); });
    var searchLbl=texts.filter(function(e){ return /^search\.\.\.$/i.test(txt(e)); })[0];
    var countLbl=texts.filter(function(e){ return /^\d+\s+results?$/i.test(txt(e)); })[0];
    var SECTORS=['EDUCATION & SCIENCE','ENERGY','MANUFACTURING','RETAIL & CONSUMER GOODS',
                 'HEALTHCARE & LIFE SCIENCES','PUBLIC SECTOR','TRANSPORTATION & LOGISTICS',
                 'TECHNOLOGY & SOFTWARE','FINANCIAL SERVICES'];
    var chips=texts.filter(function(e){ return SECTORS.indexOf(txt(e).toUpperCase())>-1; });


    var input=null;
    if(searchLbl){
      input=document.createElement('input');
      input.type='search'; input.className='ax-csf-input';
      input.placeholder='Search customer stories…';
      input.setAttribute('aria-label','Search customer stories');
      searchLbl.textContent='';
      searchLbl.style.whiteSpace='normal';
      searchLbl.appendChild(input);
    }

    /* ponytail: the grid keeps its designed height when filtered, so a narrow
       result set leaves empty space below it. Collapsing it means re-laying the
       page and the absolutely-positioned footer in two different vw scales
       (desktop vs mobile block) -- not worth the breakage risk before launch. */
    var q='', sector='';
    function matches(c){
      if(sector&&c.sector.indexOf(sector)<0) return false;
      if(q&&c.text.indexOf(q)<0) return false;
      return true;
    }
    var empty=null;
    /* Only scroll when the visible set actually overflows -- a filter that leaves
       four cards must not leave a scrollbar on a box with room to spare. */
    /* Pan the cards, never the section. Drag, two arrow controls on the right,
       and a slow downward drift so the shelf reads as alive. */
    var REDUCED_CS = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var off = 0, dragging = null, dragMoved = false, hovering = false,
        onScreen = true, raf = null, navUp = null, navDown = null, driftGen = 0;
    var DRIFT = 0.012;                       /* px per ms -- ~12px a second */

    function maxOff(){
      var sr = sec.getBoundingClientRect(), deepest = 0;
      [].slice.call(sec.querySelectorAll('.ax-csf-card')).forEach(function(e){
        if(e.style.visibility === 'hidden') return;
        var r = e.getBoundingClientRect();
        if(!r.height) return;
        var bot = (r.bottom - sr.top) + off;      /* undo the current pan */
        if(bot > deepest) deepest = bot;
      });
      return Math.max(0, deepest - sec.clientHeight + 12);
    }
    function setOff(v){
      var m = maxOff();
      off = Math.max(0, Math.min(v, m));
      sec.style.setProperty('--csf-off', off + 'px');
      if(navUp) navUp.disabled = off <= 0.5;
      if(navDown) navDown.disabled = off >= m - 0.5;
    }
    function stepPx(){ return Math.max(120, sec.clientHeight * 0.45); }

    function mkNav(dir, label, d){
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'ax-csf-nav';
      btn.setAttribute('aria-label', label);
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
        '<path d="' + d + '" stroke="#23272E" stroke-width="2.4" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>';
      btn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        setOff(off + dir * stepPx());
      });
      sec.appendChild(btn);
      return btn;
    }
    function armNav(){
      if(navUp) return;
      navUp   = mkNav(-1, 'Previous stories', 'M6 15l6-6 6 6');
      navDown = mkNav( 1, 'Next stories',     'M6 9l6 6 6-6');
      /* stacked at the right edge, vertically centred; absolutely positioned
         inside the section so nothing reflows and the page cannot grow */
      navUp.style.right   = '1.2vw'; navUp.style.top   = 'calc(50% - 2.4vw)';
      navDown.style.right = '1.2vw'; navDown.style.top = 'calc(50% + 0.3vw)';
    }

    function armDrag(){
      if(sec.dataset.axCsfDrag) return;
      sec.dataset.axCsfDrag = '1';
      sec.classList.add('ax-csf-pan');
      sec.addEventListener('pointerdown', function(e){
        if(e.pointerType === 'mouse' && e.button !== 0) return;
        if(e.target && e.target.closest && e.target.closest('.ax-csf-nav')) return;
        dragging = { y:e.clientY, off:off }; dragMoved = false;
        sec.classList.add('is-drag');
        try { sec.setPointerCapture(e.pointerId); } catch(_){}
      });
      sec.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var d = e.clientY - dragging.y;
        if(Math.abs(d) > 3) dragMoved = true;
        setOff(dragging.off - d);              /* drag up -> later cards */
      });
      ['pointerup','pointercancel'].forEach(function(ev){
        sec.addEventListener(ev, function(){
          if(!dragging) return;
          dragging = null; sec.classList.remove('is-drag');
          setTimeout(function(){ dragMoved = false; }, 0);
        });
      });
      /* a drag that ends on a card must not open that card */
      sec.addEventListener('click', function(e){
        if(dragMoved){ e.preventDefault(); e.stopPropagation(); }
      }, true);
      sec.addEventListener('pointerenter', function(){ hovering = true; });
      sec.addEventListener('pointerleave', function(){ hovering = false; });
      sec.addEventListener('focusin',  function(){ hovering = true; });
      sec.addEventListener('focusout', function(){ hovering = false; });
      sec.addEventListener('keydown', function(e){
        if(e.key === 'ArrowDown'){ e.preventDefault(); setOff(off + stepPx()); }
        else if(e.key === 'ArrowUp'){ e.preventDefault(); setOff(off - stepPx()); }
      });
      if(window.IntersectionObserver){
        new IntersectionObserver(function(es){ onScreen = es[0].isIntersecting; })
          .observe(sec);
      }
    }
    function drift(){
      if(REDUCED_CS || raf) return;
      var last = 0, mine = ++driftGen;
      /* Generation token, not the rAF handle, decides whether a callback is still
         the live loop. Using the handle alone let an already-scheduled callback
         survive a stopDrift()/drift() pair -- it woke to a fresh non-null handle,
         kept going, and ran alongside the new loop, drifting at double speed. */
      raf = requestAnimationFrame(function tick(ts){
        if(mine !== driftGen || !raf) return;
        if(!last) last = ts;
        var dt = Math.min(64, ts - last); last = ts;
        if(onScreen && !hovering && !dragging){
          var m = maxOff();
          if(m > 0){
            /* off is a float of our own: a frame advances ~0.19px, and writing that
               through a property that snaps to whole pixels accumulates nothing */
            var next = off + dt * DRIFT;
            setOff(next >= m - 0.5 ? 0 : next);
          }
        }
        raf = requestAnimationFrame(tick);
      });
    }
    function stopDrift(){ driftGen++; if(raf){ cancelAnimationFrame(raf); raf = null; } }

    function panable(){
      /* mark every card member so the CSS pan reaches it -- and nothing else, so
         the search box and sector chips stay put */
      live.forEach(function(c){
        c.mem.forEach(function(m){ m.el.classList.add('ax-csf-card'); });
      });
      var need = maxOff() > 8;
      if(need){
        if(!sec.hasAttribute('tabindex')) sec.setAttribute('tabindex','0');
        sec.setAttribute('role','group');
        sec.setAttribute('aria-label','Customer stories, drag or use the arrows');
        armDrag(); armNav(); drift();
        navUp.style.display = navDown.style.display = '';
        setOff(off);
      } else {
        stopDrift(); setOff(0);
        if(navUp){ navUp.style.display = navDown.style.display = 'none'; }
        sec.removeAttribute('tabindex'); sec.removeAttribute('role');
        sec.removeAttribute('aria-label');
        sec.classList.remove('ax-csf-pan');
      }
    }
    function apply(){
      var shown=live.filter(matches);
      live.forEach(function(c){
        var on=shown.indexOf(c)>-1;
        c.mem.forEach(function(m){ m.el.classList.toggle('is-hid',!on); });
        if(!on){ c.mem.forEach(function(m){ m.el.style.visibility='hidden'; }); return; }
        c.mem.forEach(function(m){ m.el.style.visibility=''; });
        var s=slots[shown.indexOf(c)];
        c.mem.forEach(function(m){ setv(m.el,'left',s.l+m.dl); setv(m.el,'top',s.t+m.dt); });
      });
      if(countLbl) countLbl.textContent=shown.length+(shown.length===1?' result':' results');
      panable();
      if(!shown.length){
        if(!empty){
          empty=document.createElement('div');
          empty.className='ax-csf-empty';
          empty.style.left=slots[0].l+'vw'; empty.style.top=slots[0].t+'vw';
          empty.style.fontSize=((live[0].title?fsize(live[0].title):0.9375)||0.9375)+'vw';
          sec.appendChild(empty);
        }
        empty.textContent='No customer stories match that search.';
        empty.style.display='';
      } else if(empty){ empty.style.display='none'; }
    }

    chips.forEach(function(ch){
      var name=txt(ch).toUpperCase();
      var any=live.some(function(c){ return c.sector.indexOf(name)>-1; });
      ch.classList.add('ax-csf-chip');
      if(!any){ ch.classList.add('is-off'); ch.title='No customer stories in this sector yet'; ch.setAttribute('aria-disabled','true'); return; }
      ch.setAttribute('role','button'); ch.setAttribute('tabindex','0');
      function pick(){
        var on=sector===name;
        sector=on?'':name;
        chips.forEach(function(o){ o.classList.toggle('is-on',!on&&o===ch); });
        apply();
      }
      capture(ch,pick);
      ch.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } });
    });

    if(input){
      var t=null;
      input.addEventListener('input',function(){
        clearTimeout(t);
        t=setTimeout(function(){ q=input.value.toLowerCase().trim(); apply(); },120);
      });
      input.addEventListener('keydown',function(e){ e.stopPropagation(); });   /* Cmd-K search overlay must not eat typing */
    }

    apply();
    var rt=null;
    window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(apply,200); });
  }

  function init(){
    var labels=[].slice.call(document.querySelectorAll('.g-t')).filter(function(e){
      return /^filter by sector/i.test((e.textContent||'').trim()); });
    /* Desktop block only. The phone layout carries its own copy of this label, so
       every section was armed twice -- two independent panners, each with its own
       drift loop, advancing the shelf at double speed. The mobile layout stacks
       these cards and needs no panning. */
    labels.forEach(function(l){
      if(l.closest('.ax-mob')) return;
      try{ build(l.parentElement); }catch(err){}
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(init,60); });
  else setTimeout(init,60);
})();

/* ---- CUSTOMER STORIES: EVERY "LEARN MORE" GETS ITS ARROW ----
   Figma draws this button two ways: label plus arrow on the first cards, label
   alone and centred on the rest, so the arrows stopped partway along the shelf.
   Every button gets the arrow, and on desktop every button is laid out here:
   label and arrow centred in the pill as one group, from the label's rendered ink.

   Laid out here rather than by _uifx's spaceArrows() and balanceLabels(). Those
   find a button's pill from the arrow's on-screen box, and on a tile that has not
   scrolled into view the reveal animation still has the arrow offset, so they
   matched the whole card instead: the label was centred alone and the arrow pushed
   past the pill, where the clip hides it. That is why the later tiles lost their
   arrows. data-ax-laid tells those passes to leave the button alone. */
(function(){
  function lm(root){ return [].filter.call(root.querySelectorAll('.g-t'),function(t){
    return /^\s*learn more\s*$/i.test(t.textContent); }); }
  function arrowOf(t){ var a=t.nextElementSibling; return a&&a.matches('img.g-vec')?a:null; }
  function copy(){
    [document.querySelector('main.ax-page'),document.querySelector('.ax-mob')].forEach(function(root){
      if(!root) return;
      var btns=lm(root), ref=null;
      btns.forEach(function(t){ if(!ref&&arrowOf(t)) ref=t; });
      if(!ref) return;
      var refW=parseFloat(ref.parentElement.style.width);
      btns.forEach(function(t){
        if(arrowOf(t)) return;
        /* only a pill of the same size; anything else is a different button */
        if(Math.abs(parseFloat(t.parentElement.style.width)-refW)>0.05) return;
        t.style.left=ref.style.left;
        var c=arrowOf(ref).cloneNode(true);
        c.removeAttribute('loading');
        t.parentNode.insertBefore(c,t.nextSibling);
      });
    });
  }
  /* Ink width in vw, scaled from the type's own size rather than divided by the
     viewport, so a measurement taken while the window is changing size holds. */
  function inkVw(t){
    var rg=document.createRange(); rg.selectNodeContents(t);
    var px=rg.getBoundingClientRect().width, fs=parseFloat(getComputedStyle(t).fontSize),
        fv=parseFloat(t.style.fontSize);
    return (px&&fs&&fv)?px/fs*fv:0;
  }
  function layout(){
    var main=document.querySelector('main.ax-page'); if(!main) return;
    lm(main).forEach(function(t){
      var a=arrowOf(t), pill=t.parentElement; if(!a) return;
      var ink=inkVw(t), pw=parseFloat(pill.style.width), aw=parseFloat(a.style.width);
      if(!(ink>0&&pw>0&&aw>0)) return;
      var gap=aw*0.43;                             /* Figma: 0.54vw beside a 1.25vw arrow */
      var start=(pw-(ink+gap+aw))/2;
      t.style.left=start.toFixed(4)+'vw';
      t.style.width=ink.toFixed(4)+'vw';
      t.style.whiteSpace='nowrap';
      a.style.left=(start+ink+gap).toFixed(4)+'vw';
      pill.dataset.axLaid='1';
      t.dataset.axCentred='1';
    });
  }
  /* Now, while the page is still parsing, so the buttons are settled before the
     chrome's own passes run; again once the DOM and the web font are in. */
  /* LEARN MORE opens the case study its tile describes, where one is published.
     The button is the only way in; the tile itself is not a link. The other tiles
     (Ashapura, both Raymond stories) have no page yet, so their button stays inert. */
  var CASES=[[/ITD Cementation/i,'/2023/04/14/itd/05/25/44/240713/success-stories-sap/admin/'],
             [/CK Birla/i,'/2023/01/03/ckbh-case-study/07/01/09/240160/success-stories-aws/admin/'],
             [/Delux Bearings/i,'/2023/03/01/sap-on-aws-delux-bearings/04/21/19/240608/success-stories-aws/admin/']];
  function wire(){
    [document.querySelector('main.ax-page'),document.querySelector('.ax-mob')].forEach(function(root){
      if(!root) return;
      lm(root).forEach(function(t){
        var pill=t.parentElement, tile=pill.parentElement;
        if(pill.dataset.axCase||!tile||tile.children.length>30) return;   /* a tile, not a section */
        var words=[].filter.call(tile.querySelectorAll('.g-t'),function(e){ return e!==t; })
          .map(function(e){ return e.textContent; }).join(' ');
        var hit=CASES.filter(function(c){ return c[0].test(words); })[0];
        if(!hit) return;
        pill.dataset.axCase='1';
        pill.setAttribute('role','link'); pill.setAttribute('tabindex','0');
        pill.dataset.axTo=hit[1]; pill.style.cursor='pointer';
      });
    });
  }
  /* Taken at document capture, ahead of every other listener: the hover engine
     resolves a bare "Learn more" from the nearest heading and had its own handler
     on these pills, so a click queued the case study and then /services/aws/, and
     the second navigation won. */
  function own(e){
    var pill=e.target&&e.target.closest&&e.target.closest('[data-ax-case]');
    if(!pill) return;
    if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ') return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    location.href=pill.dataset.axTo;
  }
  document.addEventListener('click',own,true);
  document.addEventListener('keydown',own,true);
  copy(); layout(); wire();
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ copy(); layout(); wire(); });
  /* fonts.ready can settle before the web font has even been requested, which
     leaves a fallback-font measurement in place; loadingdone and load catch it */
  if(document.fonts){ document.fonts.ready.then(layout);
    if(document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',layout); }
  addEventListener('load',layout);
})();
/* ---- CUSTOMER STORIES: SECTOR CHIP PLATES ----
   Each chip's grey plate was cut for Figma's text box, which is narrower than the
   label actually renders: the words ran off the right edge with 4px on the left,
   on both layouts. The plate is refitted to the rendered label with even padding
   and the label centred in it. Desktop measures in bold so the selected state fits.

   A chip is a sector label whose plate starts on the "Filter by sector" heading's
   left edge, which keeps the sector tags on the story cards out of it. */
(function(){
  var SECTORS=['EDUCATION & SCIENCE','ENERGY','MANUFACTURING','RETAIL & CONSUMER GOODS',
               'HEALTHCARE & LIFE SCIENCES','PUBLIC SECTOR','TRANSPORTATION & LOGISTICS',
               'TECHNOLOGY & SOFTWARE','FINANCIAL SERVICES'];
  function fit(root,pad,bold){
    var vw=(document.documentElement.clientWidth||innerWidth)/100;
    var texts=[].filter.call(root.querySelectorAll('.g-t'),function(t){
      return root.classList.contains('ax-mob')||!t.closest('.ax-mob'); });
    var head=texts.filter(function(t){ return /^filter by sector/i.test((t.textContent||'').trim()); })[0];
    if(!head||!vw) return;
    var hl=parseFloat(head.style.left);
    texts.forEach(function(ch){
      if(SECTORS.indexOf((ch.textContent||'').trim().toUpperCase())<0) return;
      var ct=parseFloat(ch.style.top), chh=parseFloat(ch.style.height);
      var plate=[].filter.call(ch.parentElement.children,function(s){
        if(s===ch||!/\bg-b\b/.test(s.className)) return false;
        var t=parseFloat(s.style.top), h=parseFloat(s.style.height);
        return Math.abs(parseFloat(s.style.left)-hl)<0.3&&h<chh*2.2&&t<=ct+0.05&&t+h>=ct+chh-0.05;
      })[0];
      if(!plate) return;
      if(bold) ch.style.fontWeight='700';
      /* ink in vw scaled from the type size, not divided by the viewport, so a
         measurement taken mid-resize cannot skew it */
      var rg=document.createRange(); rg.selectNodeContents(ch);
      var px=rg.getBoundingClientRect().width, fs=parseFloat(getComputedStyle(ch).fontSize),
          fv=parseFloat(ch.style.fontSize);
      var ink=(px&&fs&&fv)?px/fs*fv:px/vw;
      if(bold) ch.style.fontWeight='';
      if(!ink) return;                    /* layout not showing; done when it is */
      var pl=parseFloat(plate.style.left);
      plate.style.width=(ink+2*pad).toFixed(4)+'vw';
      ch.style.left=(pl+pad).toFixed(4)+'vw';
      ch.style.width=ink.toFixed(4)+'vw';
      ch.style.textAlign='center';
      /* centred here, to the ink; _uifx's centerLabels() would otherwise take the
         now text-align:center label as its own and nudge it off again */
      ch.dataset.axCentred='1';
    });
  }
  function run(){
    var main=document.querySelector('main.ax-page'), mob=document.querySelector('.ax-mob');
    if(main) fit(main,0.4167,true);       /* 8px at 1920 */
    if(mob) fit(mob,1.8605,false);        /* 8px at 430 */
  }
  function start(){
    run();
    if(document.fonts){ document.fonts.ready.then(run);
      if(document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',run); }
    addEventListener('load',run);
    var t=null;
    addEventListener('resize',function(){ clearTimeout(t); t=setTimeout(run,250); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
