<style id="ax-frp-css">
/* ---- "In their words" featured review: prev / next ----
   Figma draws a "01 / 03" counter and a pair of arrows but authors no interaction,
   so the section shipped as a single fixed quote with dead controls. The quote and
   its counter cross-fade when the pager moves. */
.ax-frp-q,.ax-frp-n,.ax-frp-name,.ax-frp-org,.ax-frp-layer{
  transition:opacity .26s ease,transform .26s cubic-bezier(.22,.61,.36,1)}
.is-frp-swap .ax-frp-q,.is-frp-swap .ax-frp-n{opacity:0;transform:translateY(0.5vw)}
.is-frp-swap .ax-frp-name,.is-frp-swap .ax-frp-org,.is-frp-swap .ax-frp-layer{opacity:0}
.ax-frp-btn{position:absolute;margin:0;padding:0;border:0;background:none;
  cursor:pointer;-webkit-appearance:none;appearance:none;z-index:5}
.ax-frp-btn:focus-visible{outline:0.1042vw solid rgb(223,63,23);outline-offset:0.1042vw}
@media (prefers-reduced-motion:reduce){
  .ax-frp-q,.ax-frp-n,.ax-frp-name,.ax-frp-org,.ax-frp-layer{transition:none}
  .is-frp-swap .ax-frp-q,.is-frp-swap .ax-frp-n{opacity:1;transform:none}
  .is-frp-swap .ax-frp-name,.is-frp-swap .ax-frp-org,.is-frp-swap .ax-frp-layer{opacity:1}
}
</style>
<script>
/* ---- FEATURED REVIEW PAGER ----

   This shipped before as `ax-fr-css` baked into the old hand-managed index.html and
   was dropped by the V2 swap. That copy keyed off hand-added ids (#ax-fr-q, #ax-fr-prev
   and so on) which a generated page can never carry, so it is rebuilt here on shape,
   the same way the marquee and the partner ring were.

   The anchor is the counter: a text node reading exactly "NN / NN". From there the
   quote is the biggest-type text sharing its parent, and the caption is the nearest
   ancestor holding white text over the photo stack. That holds on desktop, where the
   photo panel sits beside the quote, and on mobile, where it sits under it.

   Figma bakes BOTH arrows into ONE svg -- there is nothing to click and no second
   element to bind -- so two transparent buttons are laid over its halves. Same
   treatment the mobile carousel pager needed.

   Only the first story is Figma's own. The other two are real customers already
   quoted in the cards below, shown with their company mark rather than a stock
   portrait: a face beside another person's name would be a fabricated portrait of
   someone who exists. */
(function () {
  var STORIES = [
    { q: null, name: null, org: null, src: null },   /* filled from the design */
    { q: 'We were able to properly deploy SAP from the ground up thanks to AeonX. ' +
         'They were there for us every step of the journey, providing assistance and ' +
         'knowledge. We strongly recommend working with AeonX Digital!',
      name: 'Ashish Desai', org: 'CFO, Ashapura',
      src: '/assets/gen/5778d345b890c25bb14d315e1a30f033b6a187d0.webp' },
    { q: 'We appreciate how simple SAP managed services and SAP S/4HANA cloud ' +
         'migration were to implement. Working with AeonX Digital has been a ' +
         'fantastic experience, and we would gladly recommend them as one of the ' +
         'industry’s top providers.',
      name: 'Mitali Biswas', org: 'CIO, CK Birla Hospitals',
      src: '/assets/gen/e4a692c1cd086c806650e3419d44bff8cc67db80.webp' }
  ];

  function num(el, prop) {
    var m = /(-?[\d.]+)vw/.exec(String((el.style && el.style[prop]) || ''));
    return m ? parseFloat(m[1]) : null;
  }
  function isWhite(el) {
    return /rgb\(255,\s*255,\s*255\)/.test(el.style.color || '');
  }

  function wire(root) {
    /* 1. the counter, and through it the pager row */
    var counter = null;
    [].forEach.call(root.querySelectorAll('.g-t'), function (t) {
      if (counter) return;
      if (/^\s*\d{1,2}\s*\/\s*\d{1,2}\s*$/.test(t.textContent || '')) counter = t;
    });
    if (!counter || counter.dataset.axFrp) return false;
    var row = counter.parentElement;
    var arrows = row && row.querySelector('img.g-vec');
    if (!arrows) return false;

    /* 2. the quote: biggest type sharing the pager row's parent */
    var card = row.parentElement, quote = null, qs = 0;
    if (!card) return false;
    [].forEach.call(card.children, function (e) {
      if (!e.classList || !e.classList.contains('g-t')) return;
      var s = num(e, 'fontSize') || 0;
      if (s > qs) { qs = s; quote = e; }
    });
    if (!quote) return false;

    /* 3. the caption over the photo: nearest ancestor of the counter that holds
          white text, then the box that white text sits in */
    var scope = card, nameEl = null;
    while (scope && !nameEl) {
      [].forEach.call(scope.querySelectorAll('.g-t'), function (t) {
        if (!nameEl && isWhite(t) && (t.textContent || '').trim()) nameEl = t;
      });
      if (!nameEl) scope = scope.parentElement;
    }
    var capBox = nameEl && nameEl.parentElement;
    var orgEl = null;
    if (capBox) {
      [].forEach.call(capBox.querySelectorAll('.g-t'), function (t) {
        if (t !== nameEl && !orgEl) orgEl = t;
      });
    }

    /* Slide 1 is whatever the design authored, kept verbatim. */
    STORIES[0].q = quote.textContent;
    STORIES[0].name = nameEl ? nameEl.textContent : '';
    STORIES[0].org = orgEl ? orgEl.textContent : '';

    counter.dataset.axFrp = '1';
    quote.classList.add('ax-frp-q');
    counter.classList.add('ax-frp-n');
    if (nameEl) nameEl.classList.add('ax-frp-name');
    if (orgEl) orgEl.classList.add('ax-frp-org');
    quote.setAttribute('aria-live', 'polite');

    /* A single layer over the baked photo stack rather than editing it: the panel is
       four stacked images deep. Slotted in front of the frosted caption bar so it
       covers the photo but never the name. */
    var layer = null, mediaHost = capBox && capBox.parentElement;
    if (mediaHost) {
      layer = document.createElement('div');
      layer.className = 'ax-frp-layer';
      layer.setAttribute('aria-hidden', 'true');
      layer.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;' +
        'background-repeat:no-repeat;background-position:center;opacity:0;';
      var anchor = capBox;
      var prevSib = capBox.previousElementSibling;
      if (prevSib && /backdrop-filter/.test(prevSib.getAttribute('style') || '')) {
        anchor = prevSib;
      }
      mediaHost.insertBefore(layer, anchor);
    }

    /* 4. two transparent buttons over the one baked arrows svg */
    var al = num(arrows, 'left'), at = num(arrows, 'top'),
        aw = num(arrows, 'width'), ah = num(arrows, 'height');
    if (al === null || at === null || !aw || !ah) return false;
    function button(label, x) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ax-frp-btn';
      b.setAttribute('aria-label', label);
      b.style.left = x.toFixed(4) + 'vw';
      b.style.top = at.toFixed(4) + 'vw';
      b.style.width = (aw / 2).toFixed(4) + 'vw';
      b.style.height = ah.toFixed(4) + 'vw';
      row.appendChild(b);
      return b;
    }
    var prev = button('Previous review', al),
        next = button('Next review', al + aw / 2);

    /* The design's box holds the first quote at full size. The other two are longer,
       and there is room to grow down as far as the pager but not enough for them at
       full size, so step the type down rather than clip a customer mid-sentence. */
    var qTop = num(quote, 'top') || 0, rowTop = num(row, 'top') || 0;
    var MAXH = Math.max(rowTop - qTop - 1, 2);          /* vw, one 1vw breather */
    var DESIGN = qs, FLOOR = qs * 0.58;
    var lhRatio = (num(quote, 'lineHeight') || qs * 1.25) / qs;
    function fit() {
      var px = innerWidth / 100, size = DESIGN;
      quote.style.height = 'auto';
      while (size > FLOOR) {
        quote.style.fontSize = size.toFixed(4) + 'vw';
        quote.style.lineHeight = (size * lhRatio).toFixed(4) + 'vw';
        if (quote.scrollHeight <= MAXH * px) break;
        size -= DESIGN * 0.03;
      }
    }

    /* Figma sizes each caption box to the exact string it was authored with: the org
       box is 3.5938vw, which fits "Raymond" and nothing longer. Swap in "CIO, CK Birla
       Hospitals" and the line no longer fits, and a nowrap line wider than its box is
       NOT centred -- CSS pins it to the start edge and lets it overflow the end. So the
       org sat hard against its box's left edge and ran off to the right while the name
       above it stayed centred, which is the misalignment.

       Grow the box to the string instead, about whichever edge the design aligns to, so
       the axis Figma set is the axis every name keeps. The original geometry is stashed
       on first use and restored before each measurement: without that, a box widened for
       a long string stays wide, and the next shorter string centres inside the wrong
       box. */
    function refit(e) {
      if (!e) return;
      if (e.dataset.axL === undefined) {
        e.dataset.axL = e.style.left;
        e.dataset.axW = e.style.width;
      }
      e.style.left = e.dataset.axL;
      e.style.width = e.dataset.axW;
      var l = parseFloat(e.dataset.axL), w = parseFloat(e.dataset.axW);
      if (isNaN(l) || isNaN(w)) return;
      var px = innerWidth / 100;
      if (!px) return;
      var r = document.createRange();
      r.selectNodeContents(e);
      var need = r.getBoundingClientRect().width / px;
      if (need <= w + 0.01) return;                 /* it already fits: leave Figma's box */
      var ta = getComputedStyle(e).textAlign;
      if (ta === 'center') e.style.left = (l - (need - w) / 2).toFixed(4) + 'vw';
      else if (ta === 'right') e.style.left = (l - (need - w)).toFixed(4) + 'vw';
      e.style.width = need.toFixed(4) + 'vw';
    }

    var i = 0;
    function paint() {
      var s = STORIES[i];
      quote.textContent = s.q;
      if (nameEl) nameEl.textContent = s.name;
      if (orgEl) orgEl.textContent = s.org;
      refit(nameEl);
      refit(orgEl);
      if (layer) {
        if (s.src) {
          layer.style.backgroundImage =
            'linear-gradient(to bottom,rgba(20,24,31,0) 55%,rgba(20,24,31,.62) 100%),' +
            'url(' + s.src + ')';
          layer.style.backgroundSize = '100% 100%, 62% auto';
          layer.style.backgroundColor = 'rgb(236,238,242)';
          layer.style.opacity = '1';
        } else {
          layer.style.opacity = '0';       /* Figma's own photograph shows through */
        }
      }
      counter.textContent = (i + 1 < 10 ? '0' : '') + (i + 1) +
                            ' / ' + (STORIES.length < 10 ? '0' : '') + STORIES.length;
      fit();
    }

    /* Swap under a fade. The quote also resizes between slides, so it has to be
       invisible while that happens or the type visibly steps down mid-read. */
    var swapping = false;
    var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var fade = card;
    while (fade && capBox && !fade.contains(capBox)) fade = fade.parentElement;
    if (!fade) fade = card;
    function go(d) {
      if (swapping) return;
      i = (i + d + STORIES.length) % STORIES.length;
      if (REDUCED) { paint(); return; }
      swapping = true;
      fade.classList.add('is-frp-swap');
      setTimeout(function () {
        paint();
        fade.classList.remove('is-frp-swap');
        setTimeout(function () { swapping = false; }, 260);
      }, 260);
    }

    /* Auto-advance, held while the pointer is over the card, while a control has
       focus, and while the tab is hidden. A click restarts the clock instead of
       letting the timer fire a moment later. */
    var timer = null, held = false;
    function restart() {
      if (REDUCED) return;
      clearInterval(timer);
      timer = setInterval(function () { if (!held && !document.hidden) go(1); }, 7000);
    }
    prev.addEventListener('click', function (e) { e.preventDefault(); go(-1); restart(); });
    next.addEventListener('click', function (e) { e.preventDefault(); go(1); restart(); });
    fade.addEventListener('mouseenter', function () { held = true; });
    fade.addEventListener('mouseleave', function () { held = false; });
    [prev, next].forEach(function (b) {
      b.addEventListener('focus', function () { held = true; });
      b.addEventListener('blur', function () { held = false; });
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) restart();
    });
    addEventListener('resize', function () {
      clearTimeout(window.__frpT);
      window.__frpT = setTimeout(function () {
        fit(); refit(nameEl); refit(orgEl);
      }, 150);
    });
    paint();
    restart();
    return true;
  }

  function run() {
    ['main.ax-page', '.ax-mob'].forEach(function (sel) {
      var root = document.querySelector(sel);
      if (root) wire(root);
    });
  }
  /* After the reveal and carousel passes, so nothing is re-parented under us. */
  if (document.readyState === 'complete') setTimeout(run, 0);
  else addEventListener('load', function () { setTimeout(run, 0); });
})();
</script>
