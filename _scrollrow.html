<style id="ax-scrollrow-css">
/* Figma exports an over-wide row inside a clipped box and ships NO scroller, so every
   card past the clip edge is simply unreachable (the leadership page hides 5 of its 8
   people this way). Turning the existing clip into a real scroller costs no layout
   change: the children are absolutely positioned, so the box already reports the full
   scrollWidth -- it just was not allowed to scroll. */
.ax-srow{overflow-x:auto!important;overflow-y:hidden!important;
  scrollbar-width:thin;scrollbar-color:rgba(35,39,46,.12) transparent;scroll-behavior:smooth;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;cursor:grab}
.ax-srow.is-drag{cursor:grabbing;scroll-behavior:auto}
/* The bar used to sit hard against the cards and read too dark. Reserve space for
   it below the row and lighten the thumb. padding-bottom is safe here: this box is
   the scroll container itself, and its children are absolutely positioned, so the
   extra space cannot push anything around. */
.ax-srow{padding-bottom:0.9vw}
.ax-srow::-webkit-scrollbar{height:5px}
.ax-srow::-webkit-scrollbar-thumb{background:rgba(35,39,46,.12);border-radius:99px}
.ax-srow::-webkit-scrollbar-thumb:hover{background:rgba(35,39,46,.22)}
.ax-srow::-webkit-scrollbar-track{background:transparent}
/* edge fades hint that there is more to the right */
.ax-srow-wrap{position:relative}
.ax-srow-fade{position:absolute;top:0;bottom:0;width:3vw;pointer-events:none;z-index:3;
  opacity:0;transition:opacity .2s ease}
.ax-srow-fade--l{left:0;background:linear-gradient(90deg,#fff,rgba(255,255,255,0))}
.ax-srow-fade--r{right:0;background:linear-gradient(270deg,#fff,rgba(255,255,255,0))}
.ax-srow-fade.on{opacity:1}
@media (prefers-reduced-motion:reduce){.ax-srow{scroll-behavior:auto}}
/* ---- PAGER OVERLAY ----
   Figma exports the carousel's pager -- the dot strip and the prev/next buttons --
   as ONE flat SVG, so nothing under the cursor was ever clickable and the dots
   could not track position. Real controls are laid over that picture using its own
   viewBox geometry (1728x40: dots at x17/73/89/105/121, prev at 1660, next 1708),
   so the design is untouched and the hit areas land exactly on what is drawn. */
.ax-srp{position:absolute;pointer-events:none;z-index:3}
.ax-srp__dots{position:absolute;display:flex;align-items:center;pointer-events:auto;
  background:#ECEEF2;border-radius:99px}
.ax-srp__dot{border:0;padding:0;cursor:pointer;background:#8695AA;border-radius:99px;
  transition:width .28s cubic-bezier(.22,.61,.36,1),background-color .28s ease}
.ax-srp__dot.is-on{background:#23272E}
.ax-srp__btn{position:absolute;pointer-events:auto;cursor:pointer;background:transparent;
  border:0;padding:0;border-radius:99px}
.ax-srp__btn[disabled]{cursor:default;opacity:.45}
.ax-srp__btn:focus-visible,.ax-srp__dot:focus-visible{outline:2px solid #23272E;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ax-srp__dot{transition:none}}
</style>
<script>
/* ---- OVER-WIDE FIGMA ROWS -> REAL SCROLLERS ---- */
(function(){
  var MIN_OVERFLOW = 1.15;
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;      /* content must exceed the box by 15% to be worth it */

  function arm(box){
    if (box.dataset.axSrow) return;
    box.dataset.axSrow = '1';
    box.classList.add('ax-srow');

    /* keyboard: the box itself becomes focusable and arrow-scrollable, because the cards
       inside are plain divs with nothing tabbable of their own */
    if (!box.hasAttribute('tabindex')) box.setAttribute('tabindex', '0');
    box.setAttribute('role', 'group');
    if (!box.getAttribute('aria-label')) box.setAttribute('aria-label', 'Scrollable row, use the arrow keys');
    box.addEventListener('keydown', function(e){
      var step = box.clientWidth * 0.8;
      if (e.key === 'ArrowRight'){ e.preventDefault(); box.scrollLeft += step; }
      else if (e.key === 'ArrowLeft'){ e.preventDefault(); box.scrollLeft -= step; }
      else if (e.key === 'Home'){ e.preventDefault(); box.scrollLeft = 0; }
      else if (e.key === 'End'){ e.preventDefault(); box.scrollLeft = box.scrollWidth; }
    });

    /* pointer drag, so it feels like the carousel it looks like */
    var down = null;
    box.addEventListener('pointerdown', function(e){
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      down = { x:e.clientX, l:box.scrollLeft, moved:false };
      box.classList.add('is-drag');
    });
    box.addEventListener('pointermove', function(e){
      if (!down) return;
      var d = e.clientX - down.x;
      if (Math.abs(d) > 3) down.moved = true;
      box.scrollLeft = down.l - d;
    });
    function up(){ if (down) { down = null; box.classList.remove('is-drag'); } }
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      box.addEventListener(ev, up);
    });
    /* a drag must not fire the click of whatever card it ended on */
    box.addEventListener('click', function(e){
      if (down && down.moved) { e.preventDefault(); e.stopPropagation(); }
    }, true);

    /* edge fades. The wrapper is the clip's own parent when we can use it, otherwise the
       fades are skipped -- never restructure the DOM, the layout is pixel-locked. */
    var host = box.parentElement;
    if (host && !host.dataset.axSrowWrap) {
      host.dataset.axSrowWrap = '1';
      var cs = getComputedStyle(host);
      if (cs.position !== 'static') {
        host.classList.add('ax-srow-wrap');
        var l = document.createElement('div'), r = document.createElement('div');
        l.className = 'ax-srow-fade ax-srow-fade--l';
        r.className = 'ax-srow-fade ax-srow-fade--r';
        /* sit the fades exactly over the scroller, not the whole host */
        [l, r].forEach(function(f){
          f.style.top = box.offsetTop + 'px';
          f.style.height = box.offsetHeight + 'px';
          f.style.bottom = 'auto';
          host.appendChild(f);
        });
        var paint = function(){
          var max = box.scrollWidth - box.clientWidth;
          l.classList.toggle('on', box.scrollLeft > 4);
          r.classList.toggle('on', box.scrollLeft < max - 4);
        };
        box.addEventListener('scroll', paint);
        addEventListener('resize', paint);
        paint();
      }
    }
  }

  /* The pager graphic: a wide, short vector sitting at the bottom of the row. */
  function pagerOf(box){
    var br = box.getBoundingClientRect();
    var best = null;
    [].slice.call(box.querySelectorAll('img.g-vec')).forEach(function(img){
      var r = img.getBoundingClientRect();
      if (!r.width || r.width < br.width * 0.5) return;
      if (r.height > 60 || r.width / r.height < 20) return;      /* long and thin */
      if (r.top - br.top < br.height * 0.6) return;              /* near the bottom */
      if (!best || r.top > best.getBoundingClientRect().top) best = img;
    });
    return best;
  }

  function buildPager(box, img){
    if (img.dataset.axSrp) return;
    img.dataset.axSrp = '1';
    var host = img.parentElement;
    if (!host) return;
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';

    var VB = 1728, VH = 40;                    /* the export's own viewBox */
    var wrap = document.createElement('div');
    wrap.className = 'ax-srp';
    function place(){
      wrap.style.left = img.style.left; wrap.style.top = img.style.top;
      wrap.style.width = img.style.width; wrap.style.height = img.style.height;
    }
    place();
    host.insertBefore(wrap, img.nextSibling);

    var pct = function(v){ return (v / VB * 100) + '%'; };
    var vpct = function(v){ return (v / VH * 100) + '%'; };

    /* dots, painted over the baked ones (same fill as the pill interior) */
    var dots = document.createElement('div');
    dots.className = 'ax-srp__dots';
    dots.style.left = pct(8); dots.style.top = vpct(6);
    dots.style.width = pct(122); dots.style.height = vpct(28);
    dots.style.justifyContent = 'center';
    dots.style.gap = pct(8);
    wrap.appendChild(dots);

    function mkBtn(x0, x1, label){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'ax-srp__btn'; b.setAttribute('aria-label', label);
      b.style.left = pct(x0); b.style.width = pct(x1 - x0);
      b.style.top = '0'; b.style.height = '100%';
      wrap.appendChild(b);
      return b;
    }
    var prev = mkBtn(1640, 1682, 'Previous');
    var next = mkBtn(1686, 1728, 'Next');

    var pages = 1, cells = [];
    function step(){ return box.clientWidth * 0.9; }
    function maxScroll(){ return box.scrollWidth - box.clientWidth; }

    function render(){
      var max = maxScroll();
      var want = Math.max(1, Math.min(6, Math.ceil(box.scrollWidth / Math.max(1, box.clientWidth))));
      if (want !== pages){
        pages = want; dots.innerHTML = ''; cells = [];
        for (var i = 0; i < pages; i++){
          (function(i){
            var d = document.createElement('button');
            d.type = 'button'; d.className = 'ax-srp__dot';
            d.setAttribute('aria-label', 'Go to page ' + (i + 1));
            d.style.height = vpct(8);
            d.addEventListener('click', function(){
              box.scrollTo({ left: pages > 1 ? max * i / (pages - 1) : 0,
                behavior: REDUCED ? 'auto' : 'smooth' });
            });
            dots.appendChild(d); cells.push(d);
          })(i);
        }
      }
      var at = max > 0 ? box.scrollLeft / max : 0;
      var active = Math.round(at * (pages - 1));
      cells.forEach(function(d, i){
        var on = i === active;
        d.classList.toggle('is-on', on);
        d.style.width = pct(on ? 41 : 8);
        d.setAttribute('aria-current', on ? 'true' : 'false');
      });
      prev.disabled = box.scrollLeft <= 4;
      next.disabled = box.scrollLeft >= max - 4;
    }

    prev.addEventListener('click', function(){
      box.scrollBy({ left: -step(), behavior: REDUCED ? 'auto' : 'smooth' }); });
    next.addEventListener('click', function(){
      box.scrollBy({ left: step(), behavior: REDUCED ? 'auto' : 'smooth' }); });
    box.addEventListener('scroll', render, { passive: true });
    addEventListener('resize', function(){ place(); render(); });
    render();
  }

  function scan(){
    var boxes = [].slice.call(document.querySelectorAll('.g-clip'));
    boxes.forEach(function(b){
      if (b.closest('header') || b.closest('footer') || b.closest('.ax-footer')) return;
      var cw = b.clientWidth;
      if (!cw || b.scrollWidth <= cw * MIN_OVERFLOW) return;
      /* only rows: a tall clipped block is a masked graphic, not a carousel */
      if (b.clientHeight > cw) return;
      /* it must actually hold several sibling blocks, not one wide image */
      var kids = [].slice.call(b.children).filter(function(k){ return k.offsetWidth; });
      if (kids.length < 3) return;
      /* leave anything another enhancer already drives */
      if (b.querySelector('.ax-mq,.ax-recog__win,.ax-carm') || b.classList.contains('ax-carm')) return;
      arm(b);
      var pg = pagerOf(b);
      if (pg) buildPager(b, pg);
    });
  }

  function init(){ scan(); addEventListener('resize', function(){ setTimeout(scan, 200); }); }
  /* lazily: the .ax-mob block is not guaranteed to precede this script */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
