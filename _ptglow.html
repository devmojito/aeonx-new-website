<!-- Carried out of index.html when the V2 design became the homepage. It was baked
     into that one file, which meant the first regeneration would have dropped it.
     Its target survives the redesign: the partner-tiers disc is still in the mobile
     block, matched on inline geometry rather than a class because _mobile.py rewrites
     that whole block on every build. -->
<style id="ax-ptglow-css">
/* Partner tiers, mobile: Figma renders a thick blurred blue-grey donut inside this
   disc with a bright white core. It is an inner shadow, and the REST API reports
   effects:[] for that node (the same quirk that hid it the first time) -- an export
   of the node alone comes back flat, while an export of the whole section shows the
   glow. So it is painted here instead of fetched. Matched on the disc's own inline
   geometry rather than a class, because _mobile.py rewrites the whole .ax-mob block
   on every build and would drop any class added to it. */
.ax-mob .g-b[style*="width:135.2663vw"][style*="border-radius:4651"]{
  background-image:radial-gradient(circle at 50% 50%,
    #ffffff 0%, #ffffff 25%,
    rgba(255,255,255,0.97) 31%,
    rgba(188,201,222,0.88) 47%,
    rgba(206,216,232,0.55) 60%,
    rgba(233,237,243,0.18) 70%,
    rgba(246,247,249,0) 78%)}
</style>
