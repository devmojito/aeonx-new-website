<style id="ax-reasons-css">
/* ---- NUMBERED REASON GRID ----
   The "Six reasons" grid (01..06 in outlined circles, each with a heading and a
   line of copy) was completely static. This gives the cell the same hover language
   the service cards use: the circle fills brand, its number goes white, the heading
   goes brand, the body copy stays as it is.

   Colour only, no transform. Every element here is absolutely positioned and also
   carries the scroll-reveal's own transform, so moving anything would either fight
   that or need the --ax-bt dance _hover.html does; a fill reads as clearly and
   cannot shift the layout by a pixel. */
.ax-rsn-c{transition:background-color .22s ease,box-shadow .22s ease}
.ax-rsn-n,.ax-rsn-h{transition:color .22s ease}
.ax-rsn-c.is-on{background-color:rgb(223,63,23)!important;
  box-shadow:0 0.2083vw 0.625vw rgba(223,63,23,.28)}
.ax-rsn-n.is-on{color:rgb(255,255,255)!important}
.ax-rsn-h.is-on{color:rgb(223,63,23)!important}
.ax-rsn-hit{cursor:default}
@media (max-width:1024px){.ax-rsn-c,.ax-rsn-n,.ax-rsn-h{transition:none}}
@media (prefers-reduced-motion:reduce){.ax-rsn-c,.ax-rsn-n,.ax-rsn-h{transition:none}}
</style>
<script>
(function(){
  function txt(e){ return (e.textContent||'').replace(/\s+/g,' ').trim(); }

  function build(main){
    var all = [].slice.call(main.querySelectorAll('.g-t,.g-b'));
    var rect = function(e){ var r = e.getBoundingClientRect();
      return r.width ? {el:e, l:r.left, t:r.top + scrollY, w:r.width, h:r.height,
                        r:r.left + r.width, b:r.top + scrollY + r.height} : null; };
    var boxes = all.map(rect).filter(Boolean);

    /* a step circle: a round box with a two-digit number sitting in it */
    var cells = [];
    boxes.forEach(function(n){
      if (!/g-t/.test(n.el.className || '') || !/^\d{2}$/.test(txt(n.el))) return;
      var circle = null;
      boxes.forEach(function(c){
        if (!/g-b/.test(c.el.className || '') || c.w > 200) return;
        if (Math.abs(c.w - c.h) > 4) return;                    /* square-ish */
        if (parseFloat(getComputedStyle(c.el).borderRadius) < c.w * 0.4) return;
        if (c.l > n.l + 4 || c.r < n.r - 4 || c.t > n.t + 4 || c.b < n.b - 4) return;
        if (!circle || c.w < circle.w) circle = c;
      });
      if (circle) cells.push({num:n, circle:circle, cx:circle.l + circle.w / 2});
    });
    if (cells.length < 3) return false;

    cells.sort(function(a, b){ return a.circle.t - b.circle.t || a.circle.l - b.circle.l; });
    /* column and row pitch, from the grid itself */
    var xs = cells.map(function(c){ return c.cx; }).sort(function(a, b){ return a - b; });
    var px = 0, py = 0;
    for (var i = 1; i < xs.length; i++){ var d = xs[i] - xs[i-1]; if (d > 20 && (!px || d < px)) px = d; }
    for (var j = 1; j < cells.length; j++){
      var dy = cells[j].circle.t - cells[0].circle.t;
      if (dy > 40 && (!py || dy < py)) py = dy;
    }
    if (!px) px = cells[0].circle.w * 4;
    if (!py) py = cells[0].circle.h * 4;

    cells.forEach(function(c){
      /* the cell: this column, from the circle down to just short of the next row */
      c.box = {l:c.cx - px / 2, r:c.cx + px / 2, t:c.circle.t - 16, b:c.circle.t + py - 40};
      c.parts = boxes.filter(function(o){
        if (o.el === c.circle.el || o.el === c.num.el) return false;
        if (!/g-t/.test(o.el.className || '')) return false;
        var mid = o.l + o.w / 2;
        return mid > c.box.l && mid < c.box.r && o.t > c.box.t && o.t < c.box.b;
      });
      /* the heading is the heaviest, largest line under the circle */
      c.head = c.parts.slice().sort(function(a, b){
        return (parseFloat(getComputedStyle(b.el).fontSize) || 0) -
               (parseFloat(getComputedStyle(a.el).fontSize) || 0);
      })[0] || null;
      c.circle.el.classList.add('ax-rsn-c');
      c.num.el.classList.add('ax-rsn-n');
      if (c.head) c.head.el.classList.add('ax-rsn-h');
      /* the whole cell is the target, so the copy reacts too */
      c.parts.concat([c.circle, c.num]).forEach(function(o){ o.el.classList.add('ax-rsn-hit'); });
    });

    var cur = null;
    function paint(c){
      if (c === cur) return;
      if (cur){
        cur.circle.el.classList.remove('is-on');
        cur.num.el.classList.remove('is-on');
        if (cur.head) cur.head.el.classList.remove('is-on');
      }
      cur = c;
      if (cur){
        cur.circle.el.classList.add('is-on');
        cur.num.el.classList.add('is-on');
        if (cur.head) cur.head.el.classList.add('is-on');
      }
    }
    /* One pointer listener over the grid rather than listeners per element: the
       cells are a flat sheet of absolutely positioned boxes with no wrapper to
       attach to, and a point test is what "hovering this cell" actually means. */
    var last = 0;
    addEventListener('mousemove', function(e){
      /* Throttled on a timestamp rather than rAF: rAF does not fire while the tab
         is not compositing, which makes this untestable in a headless pane for no
         benefit -- the test is a couple of comparisons per move. */
      var now = e.timeStamp || 0;
      if (now && now - last < 16) return;
      last = now;
      if (innerWidth <= 1024) { paint(null); return; }
      var x = e.clientX, y = e.clientY + scrollY, hit = null;
      for (var k = 0; k < cells.length; k++){
        var b = cells[k].box;
        if (x >= b.l && x <= b.r && y >= b.t && y <= b.b) { hit = cells[k]; break; }
      }
      paint(hit);
    }, {passive:true});
    addEventListener('scroll', function(){ if (cur) paint(null); }, {passive:true});
    return true;
  }

  function init(){
    var main = document.querySelector('main.ax-page');
    if (!main || main.dataset.axReasons) return;
    if (innerWidth && innerWidth <= 1024) return;
    if (build(main)) main.dataset.axReasons = '1';
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(init, 260); });
  else setTimeout(init, 260);
  addEventListener('load', function(){ setTimeout(init, 700); });
})();
</script>
