<style id="ax-mobfx-css">
/* sticky mobile header: the bar is one exported SVG, so it is translated rather
   than re-parented -- nothing else in the flat sheet moves */
.ax-mstick{will-change:transform;z-index:900}
/* Mobile-only enhancements. The .ax-mob layout is a flat stack of absolutely
   positioned Figma nodes, so carousels are just cards sitting side by side off the
   screen edge with no scroller and no working controls -- the dots and arrows are
   baked into ONE svg image. These add the missing behaviour on top. */
.ax-carm{transition:transform .45s cubic-bezier(.22,.68,.28,1)}
.ax-carm--drag{transition:none}
/* real hit targets over the baked control art */
.ax-carh{position:absolute;z-index:40;background:transparent;border:0;padding:0;
  -webkit-tap-highlight-color:transparent;cursor:pointer}
.ax-carh:disabled{opacity:.35;cursor:default}
/* live dots, drawn over the baked pill so the active step actually moves */
.ax-cardots{position:absolute;z-index:41;display:flex;align-items:center;
  justify-content:center;gap:6px;background:#FEF5EE;border-radius:999px;pointer-events:none}
.ax-cardots i{display:block;width:6px;height:6px;border-radius:999px;background:#ECEEF2;
  transition:width .3s ease,background-color .3s ease}
.ax-cardots i.on{width:22px;background:#DF3F17}
@media (min-width:769px){.ax-carh,.ax-cardots{display:none}}
</style>
<script>
/* ---- MOBILE CAROUSELS + LIVE HERO MOSAIC ---- */
(function(){
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var page = null;

  function start(){
    /* resolve lazily: the .ax-mob block may sit AFTER this script in the document */
    var mob = document.querySelector('.ax-mob');
    if (!mob) return;
    page = mob.querySelector('main.ax-page');
    if (!page) return;
    var W = page.clientWidth || innerWidth;
    if (W > 768) return;                 /* .ax-mob is only shown on phones */
    setTimeout(function(){ stickyHeader(mob); }, 350);
    addEventListener('load', function(){ setTimeout(function(){ stickyHeader(mob); }, 400); });
    /* Deep, not just direct children: the section strips live inside wrappers. */
    var kids = [].slice.call(page.querySelectorAll('.g-b,.g-t,.g-img,.g-vec'));
    var box = kids.map(function(e){
      var r = e.getBoundingClientRect();
      return { el:e, L:r.left, T:r.top + scrollY, W:r.width, H:r.height };
    });
    var pageTop = page.getBoundingClientRect().top + scrollY;
    box.forEach(function(b){ b.T -= pageTop; });

    /* A carousel = 2+ big cards in one row, the row wider than the screen. Detected
       from geometry rather than hardcoded ids so a Figma re-pull (which renumbers
       everything) does not silently break it. */
    var frames = box.filter(function(b){
      return b.W >= W * 0.55 && b.W <= W * 1.2 && b.H >= 120;
    });
    /* Partition by parent, then chain-cluster on top with a tolerance: sibling cards
       differ by ~20px when one has taller copy, and fixed buckets split real rows
       while page-wide grouping merged unrelated sections. */
    var byParent = [];
    frames.forEach(function(b){
      var g = byParent.filter(function(x){ return x.host === b.el.parentElement; })[0];
      if (!g) { g = { host: b.el.parentElement, items: [] }; byParent.push(g); }
      g.items.push(b);
    });
    byParent.forEach(function(part){
      part.items.sort(function(a, b){ return a.T - b.T; });
      var groups = [], cur = null, prevT = -1e9;
      part.items.forEach(function(b){
        if (b.T - prevT > 40) { cur = []; groups.push(cur); }
        cur.push(b); prevT = b.T;
      });
      groups.forEach(function(items){
        var g = items.slice().sort(function(a, b){ return a.L - b.L; });
        /* de-dupe the stacked frame+fill pairs that share a left */
        var cols = [];
        g.forEach(function(b){ if (!cols.length || Math.abs(b.L - cols[cols.length-1]) > 8) cols.push(b.L); });
        if (cols.length < 2) return;
        /* Wider than the screen = a carousel. Figma bakes some rows with the ACTIVE
           card at x~0 and the rest off to the LEFT (negative), so testing only for
           right-edge overflow missed the product panels entirely. */
        var span = (cols[cols.length-1] + g[g.length-1].W) - cols[0];
        if (span <= W * 1.05) return;
        var stride = cols[1] - cols[0];
        if (!(stride > W * 0.4)) return;
        /* whichever column sits at the left edge now is the baked-visible slide */
        var startIdx = 0, best = Infinity;
        cols.forEach(function(c, n){ if (Math.abs(c) < best) { best = Math.abs(c); startIdx = n; } });
        build(g[0], cols, stride, startIdx, box, W);
      });
    });

    mosaic(box, W);
    marquee(box, W);
  }

  function build(first, cols, stride, startIdx, box, W){
    var count = cols.length;
    var home = cols[startIdx];           /* the x of the visible slot */
    var top = first.T, bottom = first.T + first.H;
    var host = first.el.parentElement;

    /* the control strip: one baked art element (IMG or image-fill DIV), roughly
       band-wide, sitting just under the cards */
    var ctrl = box.filter(function(b){
      return (b.el.tagName === 'IMG' || /g-img/.test(b.el.className)) &&
             b.T > bottom - 40 && b.T < bottom + 140 && b.W > W * 0.8 && b.L < W;
    }).sort(function(a, b){ return Math.abs(a.T - bottom) - Math.abs(b.T - bottom); })[0];

    /* Tab row: a line of labels above the band with the SAME number of entries as
       there are columns, plus a solid brand-orange pill marking the active one. */
    var tabs = null, pill = null, pillL0 = 0;
    (function(){
      var cands = box.filter(function(b){
        return /g-t/.test(b.el.className) && b.T < top && b.T > top - 170 &&
               b.H < 40 && b.W < W * 0.45 && b.L >= 0 && b.L < W;
      }).sort(function(a, b){ return a.T - b.T || a.L - b.L; });
      var rows = [], cur = null, prevT = -1e9;
      cands.forEach(function(b){
        if (b.T - prevT > 10) { cur = []; rows.push(cur); }
        cur.push(b); prevT = b.T;
      });
      rows.forEach(function(row){
        if (tabs || row.length < count) return;
        /* Leave rows another fragment already drives. The homepage product filmstrip
           is one clip holding six full-width panels, which this band engine cannot
           page (its members test finds none), but it still recognised the chip row
           and kept repainting the labels from its own index -- so the active label
           snapped back to the first chip after every switch. */
        if (row.some(function(b){ return /ax-pstrip-tab/.test(b.el.className || ''); })) return;
        tabs = row.slice().sort(function(a, b){ return a.L - b.L; }).slice(0, count);
        /* Remember each label's own colour. Resetting an inactive tab with
           style.color = '' REMOVES the inline colour Figma exported, so the label
           fell back to the inherited default and every unselected tab went black. */
        tabs.forEach(function(t){ t.c0 = t.el.style.color || ''; });
      });
      if (!tabs) return;
      var tTop = tabs[0].T;
      pill = box.filter(function(b){
        return /g-b/.test(b.el.className) && Math.abs(b.T - tTop) < 20 &&
               getComputedStyle(b.el).backgroundColor === 'rgb(223, 63, 23)' && b.W < W * 0.5;
      })[0] || null;
      if (pill) { pillL0 = pill.L; pill.el.style.transition = 'transform .3s ease, width .3s ease'; }
    })();

    /* Members: everything that pages with the cards. With a tab row the per-column
       content spans from just under the tabs down to the per-column CTA pills --
       headings ABOVE the card top and buttons BELOW its bottom, which a band tied to
       the card edges missed (the button read "Explore AeonxIQ" forever). Without
       tabs the card edges are the honest band. */
    /* A row a page-scoped fragment already drives is not ours. _prodstrip.html marks
       the mobile SaaS-suite clip and everything under it; without this the carousel
       adopted part of that row and left the rest, which is why five of the six product
       screenshots never moved with their tab. */
    if (host && host.closest && host.closest('[data-ax-owned]')) return;
    var mTop = top - 6, mBot = bottom + 6;
    if (tabs) {
      mTop = tabs[0].T + tabs[0].H + 4;
      mBot = ctrl ? ctrl.T - 4 : bottom + 140;
    }
    var members = box.filter(function(b){
      return b.el.parentElement === host && b !== first &&
             (!ctrl || b.el !== ctrl.el) &&
             b.T >= mTop && b.T < mBot && b.H <= Math.max(first.H * 1.2, mBot - mTop) &&
             b.W <= W * 1.25;
    }).map(function(b){ return b.el; });
    members.unshift(first.el);

    /* A slide drawn as a wrapper with its own children -- the timeline's last card
       is a clip box holding an image, a tag and its copy -- is not a sibling of the
       others, so the parent test above skips it and it stayed put while the row
       slid, bleeding into the window over the slide that should be there. Pull in
       anything standing in a column band, then keep only the outermost elements so
       a wrapper and its children never both get translated (that moved such a card
       twice as far as the rest). */
    var band = box.filter(function(b){
      if (b.T < mTop || b.T > mBot) return false;
      /* floor, not round: a member belongs to the column it STARTS in. The homepage
         trinity band's third CTA ("See the suite") sits 200px into its 354px column
         -- narrower label, so Figma centres it further right -- which rounds to
         column 3, past the last card, and the pill was dropped from the track
         entirely. That card shipped with no button at all. */
      var k = Math.floor((b.L - cols[0]) / stride);
      return k >= 0 && k < count && Math.abs((b.L - cols[0]) - k * stride) < stride * 0.9;
    }).map(function(b){ return b.el; });
    members = members.concat(band).filter(function(e, i, a){ return a.indexOf(e) === i; });
    members = members.filter(function(e){
      return !members.some(function(p){ return p !== e && p.contains(e); });
    });

    if (members.length < 2) return;
    members.forEach(function(e){ e.classList.add('ax-carm'); });

    var i = tabs ? 0 : startIdx;         /* tabbed bands open on the FIRST tab */
    var userTook = false;
    function takeover(){ userTook = true; stopDrift(); }

    function paintTabs(){
      if (!tabs) return;
      tabs.forEach(function(t, n){
        t.el.style.color = n === i ? '#fff' : (t.c0 || '');
        t.el.setAttribute('aria-selected', n === i ? 'true' : 'false');
      });
      if (pill) {
        pill.el.style.transform = 'translateX(' + (tabs[i].L - pillL0 - 7) + 'px)';
        pill.el.style.width = (tabs[i].W + 14) + 'px';
      }
    }
    function apply(anim){
      members.forEach(function(e){
        e.classList.toggle('ax-carm--drag', !anim);
        e.style.transform = 'translateX(' + (home - cols[i]) + 'px)';
      });
      if (dots) [].forEach.call(dots.children, function(d, n){ d.classList.toggle('on', n === i); });
      paintTabs();
      if (prev) prev.disabled = i === 0;
      if (next) next.disabled = i === count - 1;
    }
    function go(n){ i = Math.max(0, Math.min(count - 1, n)); apply(true); }

    if (tabs) tabs.forEach(function(t, n){
      t.el.style.cursor = 'pointer';
      t.el.setAttribute('role', 'tab');
      t.el.addEventListener('click', function(){ takeover(); go(n); });
    });

    var prev, next, dots;
    if (ctrl) {
      /* fractions measured from the control artwork's own ~431x40 viewBox */
      var vb = 431;
      var mk = function(x0, x1, lbl){
        var b = document.createElement('button');
        b.className = 'ax-carh'; b.type = 'button';
        b.setAttribute('aria-label', lbl);
        b.style.left = (ctrl.L + ctrl.W * x0 / vb) + 'px';
        b.style.top = ctrl.T + 'px';
        b.style.width = (ctrl.W * (x1 - x0) / vb) + 'px';
        b.style.height = ctrl.H + 'px';
        page.appendChild(b); return b;
      };
      prev = mk(326.4, 366.4, 'Previous');
      next = mk(374.4, 414.4, 'Next');
      prev.addEventListener('click', function(){ takeover(); go(i - 1); });
      next.addEventListener('click', function(){ takeover(); go(i + 1); });

      /* the live dots cannot paint over the baked art, so cut the art's own dots out */
      if (ctrl.el) ctrl.el.classList.add('ax-carart');
      dots = document.createElement('div');
      dots.className = 'ax-cardots';
      dots.style.left = (ctrl.L + ctrl.W * 16 / vb) + 'px';
      dots.style.top = ctrl.T + 'px';
      dots.style.width = (ctrl.W * (153.6 - 16) / vb) + 'px';
      dots.style.height = ctrl.H + 'px';
      for (var d = 0; d < count; d++) dots.appendChild(document.createElement('i'));
      page.appendChild(dots);
    }

    /* touch drag, so the strip behaves like a carousel even without controls */
    var x0 = 0, dx = 0, dragging = false;
    page.addEventListener('touchstart', function(e){
      var t = e.touches[0];
      var y = t.clientY + scrollY - (page.getBoundingClientRect().top + scrollY);
      if (y < mTop || y > mBot) return;
      takeover();
      dragging = true; x0 = t.clientX; dx = 0;
    }, {passive:true});
    page.addEventListener('touchmove', function(e){
      if (!dragging) return;
      dx = e.touches[0].clientX - x0;
      members.forEach(function(el){
        el.classList.add('ax-carm--drag');
        el.style.transform = 'translateX(' + (home - cols[i] + dx) + 'px)';
      });
    }, {passive:true});
    page.addEventListener('touchend', function(){
      if (!dragging) return;
      dragging = false;
      if (Math.abs(dx) > stride * 0.2) go(i + (dx < 0 ? 1 : -1)); else apply(true);
    }, {passive:true});

    apply(false);
    setTimeout(function(){ members.forEach(function(e){ e.classList.remove('ax-carm--drag'); }); }, 0);

    /* A band with no arrows, dots or tabs just sits there with its last card cut
       off. Drift it continuously right-to-left instead (seamless loop via one set
       of clones), pausing offscreen and handing over for good on first touch. */
    var driftStop = null;
    function stopDrift(){ if (driftStop) { driftStop(); driftStop = null; } }
    /* AUTO-ADVANCE REMOVED 2026-08-27 at the client's instruction: a carousel moves
       only when the reader moves it. Rows with no arrows, dots or tabs keep touch
       drag; they no longer scroll by themselves. The block is left in place, never
       entered, so the seamless-clone technique is not lost. */
    var DRIFT = false;
    if (DRIFT && !ctrl && !tabs && !REDUCED) (function(){
      var cycle = stride * count;
      var clones = members.map(function(e){
        var c = e.cloneNode(true);
        c.setAttribute('aria-hidden', 'true');
        c.removeAttribute('id');
        c.classList.add('ax-carm--drag');
        c.setAttribute('data-ax-drift', '1');
        host.appendChild(c);
        return c;
      });
      members.forEach(function(e){ e.classList.add('ax-carm--drag'); });
      var x = 0, last = 0, run = false, raf = 0, dead = false;
      function frame(t){
        if (!run || dead) { raf = 0; return; }
        raf = requestAnimationFrame(frame);
        if (!last) last = t;
        x -= (t - last) * 0.025;               /* ~25px per second */
        last = t;
        if (-x >= cycle) x += cycle;
        members.forEach(function(e){ e.style.transform = 'translateX(' + x + 'px)'; });
        clones.forEach(function(e){ e.style.transform = 'translateX(' + (x + cycle) + 'px)'; });
      }
      /* observe the untransformed HOST -- observing a member the drift itself moves
         off-screen froze the old version seconds in */
      new IntersectionObserver(function(es){
        var vis = es[es.length-1].isIntersecting;
        if (vis && !run) { run = true; last = 0; if (!raf) raf = requestAnimationFrame(frame); }
        else if (!vis) run = false;
      }, { threshold: 0 }).observe(host);
      driftStop = function(){
        dead = true; run = false;
        clones.forEach(function(c){ c.parentNode && c.parentNode.removeChild(c); });
        /* snap back to the nearest whole column so the stepped drag takes over cleanly */
        var n = Math.round(-x / stride) % count; if (n < 0) n += count;
        members.forEach(function(e){ e.classList.remove('ax-carm--drag'); });
        i = Math.max(0, Math.min(count - 1, n));
        apply(false);
      };
    })();
  }

  /* Logo strips ("And many more...") are a row of brand marks running off the
     screen edge. Clone the row once and translate continuously so it reads as an
     endless marquee. */
  function marquee(box, W){
    if (REDUCED) return;
    var rows = {};
    box.forEach(function(b){
      if (b.el.tagName !== 'IMG' && !/g-img/.test(b.el.className)) return;
      if (b.H < W * 0.04 || b.H > W * 0.22) return;
      if (b.el.classList.contains('ax-carm')) return;   /* already owned by a carousel */
      var k = Math.round(b.T / 10) * 10;
      (rows[k] = rows[k] || []).push(b);
    });
    Object.keys(rows).forEach(function(k){
      var g = rows[k].slice().sort(function(a, b){ return a.L - b.L; });
      if (g.length < 3) return;
      var span = (g[g.length-1].L + g[g.length-1].W) - g[0].L;
      if (span <= W * 1.05) return;                 /* fits on screen: nothing to scroll */
      var host = g[0].el.parentElement;
      g = g.filter(function(b){ return b.el.parentElement === host; });
      if (g.length < 3) return;
      /* A chip/tab row has text labels interleaved with its icons; scrolling only
         the images while the labels stay put is exactly the "animating for no
         reason" bug. Logo strips have no text in-band: skip rows that do. */
      var rTop = Math.min.apply(null, g.map(function(b){ return b.T; }));
      var rBot = Math.max.apply(null, g.map(function(b){ return b.T + b.H; }));
      var hasText = box.some(function(b){
        return /g-t/.test(b.el.className) && b.el.parentElement === host &&
               b.T < rBot && b.T + b.H > rTop && (b.el.textContent || '').trim();
      });
      if (hasText) return;
      var stripW = span + W * 0.08;
      var els = g.map(function(b){ return b.el; });
      var clones = els.map(function(e){
        var c = e.cloneNode(true);
        c.setAttribute('aria-hidden', 'true');
        c.removeAttribute('id');
        c.style.transform = 'translateX(' + stripW + 'px)';
        host.appendChild(c);
        return c;
      });
      var x = 0, last = 0, run = false, raf = 0;
      function frame(t){
        if (!run) { raf = 0; return; }
        raf = requestAnimationFrame(frame);
        if (!last) last = t;
        x -= (t - last) * 0.03;                     /* ~30px per second */
        last = t;
        if (-x >= stripW) x += stripW;
        els.forEach(function(e){ e.style.transform = 'translateX(' + x + 'px)'; });
        clones.forEach(function(e){ e.style.transform = 'translateX(' + (x + stripW) + 'px)'; });
      }
      /* observe the static host, not a member the marquee pushes off-screen */
      new IntersectionObserver(function(es){
        var vis = es[es.length-1].isIntersecting;
        if (vis && !run) { run = true; last = 0; if (!raf) raf = requestAnimationFrame(frame); }
        else if (!vis) run = false;
      }, { threshold: 0 }).observe(host);
    });
  }

  /* The desktop hero has a live sliding-tile mosaic; mobile shipped the flat PNG
     export of it. Put the same animation on top of that image. */
  function mosaic(box, W){
    if (typeof window.axMosaic !== 'function') return;
    var img = box.filter(function(b){
      var s = b.el.getAttribute && (b.el.getAttribute('style') || '');
      return /75993b49bcdb6cc75e010ca20cabd9594d18ec91/.test(s) ||
             (/g-img/.test(b.el.className) && b.T < W * 1.6 && b.W > W * 0.85 && b.H > W * 0.4 && b.H < W * 0.75);
    })[0];
    if (!img) return;
    var c = document.createElement('canvas');
    c.id = 'ax-mosaic-m';
    c.setAttribute('aria-hidden','true');
    var st = img.el.getAttribute('style') || '';
    c.setAttribute('style', st.replace(/background-[^;]+;?/g,'') + 'display:block;');
    img.el.parentNode.insertBefore(c, img.el.nextSibling);
    img.el.style.visibility = 'hidden';
    if (REDUCED) {
      var g = c.getContext('2d'); c.width = c.clientWidth || 1; c.height = c.clientHeight || 1;
      g.fillStyle = '#FA500F'; g.fillRect(0, 0, c.width, c.height);
      return;
    }
    window.axMosaic(c, 6, 4, [['#C4001D',5],['#E51300',4],['#FF8204',2]], 31);
  }

  /* No vertical re-centring pass here. One was tried and reverted: Figma already
     centres these labels (the industries card's Explore sits at top:8 in a 36px
     pill, 8 above and 8 below) and the generator emits that number. The pass
     measured the label with a Range, which reports the inline box rather than the
     glyphs, read a ~2.9px error that was not there, and pushed every label down.
     Trust the design's own geometry. */

  /* ---- STICKY HEADER ----
     The mobile bar is a single exported SVG sitting in the flat sheet, so it
     scrolls away with everything else. Translating it on scroll keeps it at the
     top without re-parenting anything (a move would need every sibling's absolute
     top rewritten) and keeps its own hit area, since a transform moves that too. */
  function stickyHeader(mob){
    var bar = null, best = 1e9;
    [].slice.call(mob.querySelectorAll('.g-vec,.g-img,.g-b')).forEach(function(e){
      var b = e.getBoundingClientRect();
      if (!b.width) return;
      var top = b.top + scrollY, S = 430 / (innerWidth || 430);
      /* y0 is the promo strip, which is meant to scroll away; the nav sits under it */
      if (top * S < 20 || top * S > 130) return;
      if (b.width * S < 380 || b.height * S > 70 || b.height * S < 30) return;
      if (top * S < best) { best = top * S; bar = e; }
    });
    if (!bar || bar.dataset.axStick) return;
    bar.dataset.axStick = '1';
    bar.classList.add('ax-mstick');
    var top0 = bar.getBoundingClientRect().top + scrollY;
    var base = bar.style.transform || '';
    function pin(){
      var d = Math.max(0, scrollY - top0);
      bar.style.transform = d ? (base + ' translateY(' + d + 'px)') : base;
    }
    addEventListener('scroll', pin, {passive:true});
    addEventListener('resize', function(){ top0 = bar.getBoundingClientRect().top + scrollY - Math.max(0, scrollY - top0); pin(); });
    pin();
  }


  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
