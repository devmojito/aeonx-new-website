<style id="ax-amsgrid-css">
/* The hero's background grid (Figma node 4656:5293) exports mask-cropped at
   1920x961, but Figma reports render bounds of 2126.5 -- and _gen.render_box falls
   back to those bounds when the file matches neither box, so the <img> is given a
   110.7552vw height for a 961-tall file. preserveAspectRatio then letterboxes the
   art and its first stroked grid line surfaces mid-hero as a 1px #DF3F17 rule,
   right across the CTA buttons. Restoring the file's own aspect (961/1920 =
   50.0521vw) makes the grid fill the hero exactly, with its top edge tucked behind
   the fixed header where the design puts it.
   Scoped, NOT fixed in render_box: 483 other placements site-wide have the same
   box/file mismatch and correcting them globally would shift pixel-locked layouts. */
/* !important is required: _gen.py writes height into the element's INLINE style,
   which a stylesheet rule can never outrank. */
main.ax-page img.g-vec[data-vec="4656:5293"]{height:50.0521vw!important}
</style>
