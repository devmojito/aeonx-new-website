      texts.push({el:e,r:r,t:txt(e),fs:parseFloat(getComputedStyle(e).fontSize)||0});
    });
    /* one image box per visual position (Figma stacks a fill box under the image) */
    var seen={},uniq=[];
    imgs.sort(function(a,b){return a.r.top-b.r.top||a.r.left-b.r.left;});
    imgs.forEach(function(i){
      var k=Math.round(i.r.left)+'x'+Math.round(i.r.top);
      if(!seen[k]){ seen[k]=1; uniq.push(i); }
    });
    return {page:page,imgs:uniq,texts:texts};
  }

  /* the card's title: the biggest text starting below the image, in its column */
  function titleFor(img,texts){
    var c=texts.filter(function(t){
      return t.fs>=15 && t.t.length>12 &&
             t.r.top>=img.r.top-8 && t.r.top<img.r.bottom+150 &&
             t.r.left>=img.r.left-8 && t.r.left<img.r.right+420 &&
             !/^(Field notes|Long-form|Browse by|Want the long|Subscribe|Sign up)/.test(t.t);
    });
    c.sort(function(a,b){ return (b.fs-a.fs) || (a.r.top-b.r.top); });
    return c[0];
  }
  function chipFor(title,texts){
    if(!title) return null;
    var c=texts.filter(function(t){
      return t!==title && /^[A-Za-z][A-Za-z &]{2,}$/.test(t.t) && t.t.length<26 &&
             t.fs<15 && t.r.bottom<=title.r.top+4 && title.r.top-t.r.bottom<70 &&
             Math.abs(t.r.left-title.r.left)<60;
    });
    c.sort(function(a,b){ return b.r.bottom-a.r.bottom; });
    return c[0];
  }
  /* The category chip is TWO elements: a painted .g-b plate and the .g-t label on
     top of it. Hiding only the label left the brand-orange plate floating over an
     otherwise empty cell whenever a filter or search shrank the pool -- the row of
     stray orange rectangles in the sparse-results view. */
  function plateFor(chip,page){
    if(!chip) return null;
    var best=null;
    page.querySelectorAll('.g-b').forEach(function(b){
      if(b.closest('.ax-mob')) return;
      var st=b.getAttribute('style')||'';
      if(!/background-color|border/.test(st)) return;
      var q=b.getBoundingClientRect();
      if(!q.width||q.width>360||q.height>60) return;
      if(chip.r.left<q.left-6||chip.r.right>q.right+6) return;
      if(chip.r.top<q.top-8||chip.r.bottom>q.bottom+8) return;
      if(!best||q.width*q.height<best.a) best={el:b,a:q.width*q.height};
    });
    return best&&best.el;
  }

  function wire(el,url){
    if(!el) return;
    el.classList.add('ax-bl-hit');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    el.setAttribute('role','link');
    if(el.__axgo){ el.__axgo.url=url; return; }
    var box={url:url};
    el.__axgo=box;
    var go=function(){ location.href=box.url; };
    el.addEventListener('click',go);
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }
    });
  }

  /* Fall back to the company mark for any thumbnail that will not actually paint.
     A dead URL is the easy case; the one that shipped is subtler -- the oldest AWS
     post points at revslider's dummy.png, which returns 200 and decodes fine but is
     a 1x1 TRANSPARENT spacer, so onerror never fires and the card rendered as a
     blank white box. Anything that small is a spacer, not a thumbnail. Results are
     cached per URL so re-renders (filter, search, paging) do not re-probe. */
  var LOGO='/assets/aeonx-logo.svg', IMGOK={};
  function paintImg(el,url,isPh){
    var st=(el.getAttribute('style')||'').replace(/background-image:[^;]*;?/,'');
    el.setAttribute('style', st+';background-image:url("'+url+'")');
    el.classList.add('ax-bl-img');
    el.classList.toggle('ax-bl-img--ph', !!isPh);
  }
  function setImg(el,p){
    if(p.ph||!p.i){ paintImg(el,LOGO,true); return; }
    if(IMGOK[p.i]===false){ paintImg(el,LOGO,true); return; }
    paintImg(el,p.i,false);
    if(IMGOK[p.i]===true) return;
    var im=new Image();
    im.onload=function(){
      var bad=(im.naturalWidth<=32||im.naturalHeight<=32);
      IMGOK[p.i]=!bad;
      if(bad&&(el.style.backgroundImage||'').indexOf(p.i)>-1) paintImg(el,LOGO,true);
    };
    im.onerror=function(){
      IMGOK[p.i]=false;
      if((el.style.backgroundImage||'').indexOf(p.i)>-1) paintImg(el,LOGO,true);
    };
    im.src=p.i;
  }


  /* One rule for every category tag: the label's own width plus a constant inset
     either side. Figma drew each plate by hand -- 64px, 74, 103, 115 -- so two
     cards tagged AWS differed by 40px, and a long category ran its white label off
     the orange onto white ("Success Sto..."). PAD is the inset the canonical plate
     uses at the 1920 design width. The plate's LEFT moves too: growing a box around
     a fixed label just pushes the padding to one side.
     The plate must be matched on its BRAND FILL, not merely on being the smallest
     box under the label -- without that test this latched onto a card's own border
     box and resized that instead, which made the row less consistent than the
     hand-drawn widths it replaced. */
  var CHIP_PAD=22/1920, CHIP_BG='rgb(223, 63, 23)';
  function fitChip(el){
    var r=el.getBoundingClientRect();
    if(!r.width) return;
    var plate=null,best=1e9;
    [].slice.call(document.querySelectorAll('main.ax-page .g-b')).forEach(function(e){
      if(getComputedStyle(e).backgroundColor!==CHIP_BG) return;
      var q=e.getBoundingClientRect();
      if(!q.width||q.width>400||q.height>60) return;
      if(q.left>r.left+3||q.right<r.left+3) return;
      if(q.top>r.top+3||q.bottom<r.bottom-3) return;
      var a=q.width*q.height;
      if(a<best){ best=a; plate=e; }
    });
    if(!plate) return;
    var W=innerWidth||1920, pad=CHIP_PAD*W;
    var rg=document.createRange(); rg.selectNodeContents(el);
    var ink=rg.getBoundingClientRect();
    var pr=plate.getBoundingClientRect();
    var l0=parseFloat(plate.style.left)||0;             /* current css left, vw */
    plate.style.left=(l0+((ink.left-pad)-pr.left)/W*100).toFixed(4)+'vw';
    plate.style.width=((ink.width+pad*2)/W*100).toFixed(4)+'vw';
  }

  function fill(slot,p){
    if(!p){ return; }
    setImg(slot.img.el,p);
    if(slot.title){
      slot.title.el.textContent=p.t;
      slot.title.el.style.whiteSpace='normal';
      slot.title.el.style.overflow='hidden';
      slot.title.el.classList.add('ax-bl-t');
      wire(slot.title.el,p.u);
    }
    if(slot.chip){ slot.chip.el.textContent=p.c; fitChip(slot.chip.el); }
    if(slot.author) slot.author.el.textContent=p.a||'AeonX Digital';
    if(slot.date) slot.date.el.textContent=p.d;
    /* The byline/date detector keys on geometry and misses a card whose byline sits
       on the SAME baseline as its date instead of below the title, which left
       Figma's placeholder "John Smith" / stock date on screen. Anything inside this
       card that still carries the placeholder is this post's byline by definition. */
    if(slot.title){
      var host=slot.title.el.parentElement||document;
      var tr=slot.title.el.getBoundingClientRect();
      [].slice.call(host.querySelectorAll('.g-t')).concat([].slice.call(host.children)).forEach(function(e){
        if(!e||!e.classList||!/g-t/.test(e.className||'')) return;
        var t=(e.textContent||'').trim();
        var q=e.getBoundingClientRect();
        if(q.top<tr.top-20||q.top>tr.bottom+90) return;
        /* and inside this card's own column -- host is main.ax-page on this flat
           sheet, so without a horizontal bound this swept the whole ROW and could
           stamp one post's date onto its neighbours */
        if(q.left<tr.left-8||q.left>tr.right+8) return;
        if(/^John Smith$/i.test(t)) e.textContent=p.a||'AeonX Digital';
        else if(p.d&&/^[A-Z][a-z]+ \d{1,2}, \d{4}$/.test(t)&&e!==(slot.date&&slot.date.el)) e.textContent=p.d;
      });
    }
    wire(slot.img.el,p.u);
  }

  function init(){
    var s=slots();
    if(!s||s.imgs.length<3) return;
    if(s.page.dataset.axBl) return;
    s.page.dataset.axBl='1';

    /* Stay inside the card's OWN column. The byline sits at the title's left edge
       but the date is right-aligned within the card (~+283px), and the old +/-520
       window is wider than the 459px column pitch -- so every card also matched its
       NEIGHBOUR's date. Cards claimed each other's slots left-to-right and the last
       column's own date element was never claimed at all, leaving Figma's
       placeholder "June 29, 2026" on screen. The title spans the full card width,
       so its own horizontal span is exactly the column. */
    function nearBelow(title,test){
      if(!title) return null;
      var c=s.texts.filter(function(t){
        return t!==title && test(t.t) && t.r.top>=title.r.bottom-4 &&
               t.r.top-title.r.bottom<90 &&
               t.r.left>=title.r.left-8 && t.r.left<title.r.left+title.r.width+8;
      });
      c.sort(function(a,b){ return (a.r.top-b.r.top)||(a.r.left-b.r.left); });
      return c[0];
    }
    var cards=s.imgs.map(function(img){
      var t=titleFor(img,s.texts);
      var ch=chipFor(t,s.texts);
      return {img:img, title:t, chip:ch, chipPlate:plateFor(ch,s.page),
              author:nearBelow(t,function(x){ return /^[A-Z][a-z]+ [A-Z][a-z]+$/.test(x); }),
              date:nearBelow(t,function(x){ return /^[A-Z][a-z]+ \d{1,2}, \d{4}$/.test(x); })};
    }).filter(function(c){ return c.title; });
    if(!cards.length) return;

    /* hero = everything above the "Browse by category" heading; the rest is the
       paged category grid the design puts underneath it */
    var browse=s.texts.filter(function(t){ return /^Browse by category/i.test(t.t); })[0];
    var cut=browse?browse.r.top:Infinity;
    var hero=cards.filter(function(c){ return c.img.r.top<cut; });
    var grid=cards.filter(function(c){ return c.img.r.top>=cut; });

    var active='All', pageNo=0, query='';
    function pool(){
      return POSTS.filter(function(p){
        if(active!=='All'&&p.c!==active) return false;
        if(!query) return true;
        return (p.t+' '+p.c+' '+(p.a||'')).toLowerCase().indexOf(query)>-1;
      });
    }

    /* The designed search bar ("Search" with a magnifier and a Cmd-K badge) was
       inert markup. Make it filter the 53 real posts by title, category or author --
       the whole set, not just the page on screen -- and honour the shortcut its own
       badge advertises. */
    function wireSearch(){
      var lab=s.texts.filter(function(t){ return /^search$/i.test(t.t); })[0];
      if(!lab) return;
      var el=lab.el;
      if(el.dataset.axBsearch) return;
      el.dataset.axBsearch='1';
      /* The designed bar is a SIBLING .g-b on this flat sheet, not an ancestor --
         el.parentElement here is main.ax-page itself, and hanging the click-to-focus
         handler on it made EVERY click anywhere on the page yank focus into the
         search field (nothing else on the page could be clicked first; card clicks
         still navigated only because navigation happens before focus is observable).
         Find the bar geometrically instead, and size the input to the bar's usable
         span rather than the old label's 64px, so clicking and typing anywhere in
         the drawn field works. */
      var lr=rect(el), bar=null, barR=null;
      s.page.querySelectorAll('.g-b').forEach(function(b){
        if(bar||b.closest('.ax-mob')) return;
        var r=b.getBoundingClientRect();
        if(r.width>200&&r.width<700&&r.height>28&&r.height<90&&
           r.left<lr.left&&r.right>lr.right&&Math.abs((r.top+r.height/2)-(lr.top+lr.height/2))<28){
          bar=b; barR=r;
        }
      });
      var input=document.createElement('input');
      input.type='search';
      input.className='ax-bl-search';
      input.placeholder='Search posts…';
      input.setAttribute('aria-label','Search blog posts');
      var cs=getComputedStyle(el);
      /* stretch from the label's designed x to just short of the bar's right edge
         (the ⌘K badge sits in the last ~80px) */
      var w=barR ? Math.max(120,(barR.right-lr.left)-84) : lr.width;
      input.style.cssText='position:absolute;left:0;top:0;width:'+Math.round(w)+'px;height:100%;border:0;'+
        'outline:none;background:transparent;padding:0;font-family:'+cs.fontFamily+
        ';font-size:'+cs.fontSize+';font-weight:'+cs.fontWeight+';color:'+cs.color;
      el.textContent='';
      el.style.whiteSpace='normal';
      el.appendChild(input);
      var t=null;
      input.addEventListener('input',function(){
        clearTimeout(t);
        t=setTimeout(function(){
          query=input.value.toLowerCase().trim(); pageNo=0; render();
        },140);
      });
      /* The badge on the bar says Cmd/Ctrl-K -- but the site chrome binds the same
         shortcut to its own search overlay, registered before this fragment, and at
         the same (document, bubble) level the earlier listener wins: the overlay
         opened ON TOP of the freshly-focused field. Capture runs before any bubble
         listener on the same node, so intercept there and stop it -- on this page
         the shortcut belongs to the search bar the design draws. */
      document.addEventListener('keydown',function(e){
        if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){
          e.preventDefault(); e.stopImmediatePropagation();
          input.focus(); input.select();
        }
      },true);
      /* clicking the drawn field (and only the field) focuses the input */
      if(bar){
        bar.style.cursor='text';
        bar.addEventListener('click',function(){ input.focus(); });
      }
    }

    /* Hide every part of a card, not just its image: fill() bails on a missing post
       and would otherwise leave the previous one on screen. That showed up as soon
       as search could shrink the pool -- a query matching one post still displayed
       five, and a query matching none displayed five. */
    function show(c,on){
      ['img','title','chip','author','date'].forEach(function(k){
        if(c[k]&&c[k].el) c[k].el.style.visibility = on?'':'hidden';
      });
      /* the painted plate under the category label is a separate element */
      if(c.chipPlate) c.chipPlate.style.visibility = on?'':'hidden';
    }

    /* every element of a card fades as one unit */
    function cardEls(c){
      var a=['img','title','chip','author','date'].map(function(k){ return c[k]&&c[k].el; });
      if(c.chipPlate) a.push(c.chipPlate);
      return a.filter(Boolean);
    }
    var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    var firstPaint=true, swapT=null;
    function paint(){
      var list=pool();
      hero.forEach(function(c,i){ show(c,!!list[i]); fill(c,list[i]); });
      var off=hero.length+pageNo*grid.length;
      grid.forEach(function(c,i){
        var p=list[off+i];
        show(c,!!p);
        fill(c,p);
      });
      var total=Math.max(1,Math.ceil(Math.max(0,list.length-hero.length)/Math.max(1,grid.length)));
      if(pageNo>total-1){ pageNo=total-1; }
      paintPager(total);
    }
    function render(){
      if(firstPaint||reduce){ firstPaint=false; paint(); return; }
      var all=hero.concat(grid);
      all.forEach(function(c){
        cardEls(c).forEach(function(e){ e.classList.add('ax-bl-card','is-out'); });
      });
      clearTimeout(swapT);
      swapT=setTimeout(function(){
        paint();
        /* stagger the return across the row so it re-flows rather than blinks */
        all.forEach(function(c,i){
          var d=Math.min(i,8)*22;
          cardEls(c).forEach(function(e){
            e.classList.add('ax-bl-card');
            setTimeout(function(){ e.classList.remove('is-out'); }, d);
          });
        });
      },230);
    }

    /* Wire the DESIGNED pagination row (\u2039 1 2 3 4 5 \u2026 40 \u203a) rather than adding
       another one. The numbers are plain .g-t nodes on a single baseline; the arrows
       are the small bordered boxes flanking them. Labels are rewritten to the real
       page count, and any surplus number slot is hidden. */
    var pager=null,prev,next,label;
    var numRow=s.texts.filter(function(t){ return /^(\d{1,3}|\u2026|\.\.\.)$/.test(t.t) && t.r.width; });
    var pagBar=null;
    if(numRow.length>=3){
      /* Cluster by proximity, not Math.round(top/6): integer bucketing puts two
         digits of the same drawn row in different buckets when they straddle a
         multiple of 6 (sub-pixel layout jitter is enough), which silently dropped
         one designed slot -- the pager rendered "1 2 3 4 \u2026 8" with a hole where
         "5" belonged. */
      numRow.sort(function(a,b){ return a.r.top-b.r.top||a.r.left-b.r.left; });
      var rows=[];
      numRow.forEach(function(t){
        var row=rows.length?rows[rows.length-1]:null;
        if(row && Math.abs(t.r.top-row[0].r.top)<=8) row.push(t);
        else rows.push([t]);
      });
      var best=rows.sort(function(a,b){ return b.length-a.length; })[0];
      if(best&&best.length>=3){
        best.sort(function(a,b){ return a.r.left-b.r.left; });
        pagBar=best;
      }
    }
    var arrows=[];
    if(pagBar){
      var ry=pagBar[0].r.top;
      /* the rebuilt export draws the ‹ › chevrons as VECTOR IMAGES, not bordered
         .g-b boxes -- accept both; first/last by x are prev/next either way */
      s.page.querySelectorAll('.g-b,img.g-vec').forEach(function(e){
        if(e.closest('.ax-mob')) return;
        var r=e.getBoundingClientRect();
        if(Math.abs(r.top-ry)<80 && r.width>24 && r.width<110 && r.height>24 && r.height<110)
          arrows.push({el:e,r:r});
      });
      arrows.sort(function(a,b){ return a.r.left-b.r.left; });
    }

    /* The design draws its own ellipsis ICON (a small vector) between the last
       window slot and the final-page slot -- find it so it can be hidden when
       every page number fits and no gap exists. The old code ALSO wrote a text
       "\u2026" into a NUMBER slot, so the bar read "1 2 3 4 \u2026 \u2026 8" with page 5
       unreachable by number. */
    var gapIcon=null;
    if(pagBar){
      var f=pagBar[0].r, l=pagBar[pagBar.length-1].r;
      s.page.querySelectorAll('img.g-vec').forEach(function(e){
        if(gapIcon||e.closest('.ax-mob')) return;
        var r=e.getBoundingClientRect();
        if(r.width&&r.width<42&&Math.abs(r.top-f.top)<40&&r.left>f.left&&r.right<l.right)
          gapIcon=e;
      });
    }
    function paintPager(total){
      if(!pagBar) return;
      /* numeric slots only: a window of consecutive pages in the first N-1 slots,
         the final page in the last slot, the designed icon as the gap between */
      var S=pagBar.length,nums=[],i;
      if(total<=S){
        for(i=1;i<=total;i++) nums.push(String(i));
        if(gapIcon) gapIcon.style.display='none';
      } else {
        var win=S-1, p=pageNo+1;
        var start=Math.max(1,Math.min(p-Math.floor(win/2),total-win));
        for(i=start;i<start+win;i++) nums.push(String(i));
        nums.push(String(total));
        /* the icon reads "pages omitted here" -- when the window runs right up to
           the final page there is nothing omitted, so it hides */
        if(gapIcon) gapIcon.style.display = (start+win-1 < total-1) ? '' : 'none';
      }
      pagBar.forEach(function(t,idx){
        var v=nums[idx];
        if(v===undefined){ t.el.style.display='none'; return; }
        t.el.style.display='';
        t.el.textContent=v;
        var isNum=/^\d+$/.test(v);
        t.el.classList.add('ax-bl-pgnum');
        t.el.style.cursor=isNum?'pointer':'default';
        t.el.style.fontWeight=(isNum&&(+v-1)===pageNo)?'700':'';
        t.el.style.color=(isNum&&(+v-1)===pageNo)?'rgb(223,63,23)':'';
        if(isNum&&!t.el.__axpg){
          t.el.__axpg=1;
          t.el.setAttribute('role','button');
          t.el.setAttribute('tabindex','0');
          var jump=function(){ var n=parseInt(t.el.textContent,10); if(n){ pageNo=n-1; render(); } };
          t.el.addEventListener('click',jump);
          t.el.addEventListener('keydown',function(e){
            if(e.key==='Enter'||e.key===' '){ e.preventDefault(); jump(); } });
        }
      });
      if(arrows.length>=2){
        var a0=arrows[0].el, a1=arrows[arrows.length-1].el;
        [[a0,-1],[a1,1]].forEach(function(pair){
          var el=pair[0], dir=pair[1];
          el.style.cursor='pointer';
          el.classList.add('ax-bl-arrow');
          if(!el.__axpg){
            el.__axpg=1;
            el.setAttribute('role','button');
            el.setAttribute('tabindex','0');
            el.setAttribute('aria-label', dir<0?'Previous page':'Next page');
            var step=function(){
              var list=pool();
              var tot=Math.max(1,Math.ceil(Math.max(0,list.length-hero.length)/grid.length));
              pageNo=Math.min(Math.max(0,pageNo+dir),tot-1); render();
            };
            el.addEventListener('click',step);
            el.addEventListener('keydown',function(e){
              if(e.key==='Enter'||e.key===' '){ e.preventDefault(); step(); } });
          }
          /* dim BOTH dead ends -- the next arrow used to stay full-strength on the
             last page and clicking it did nothing, which reads as broken */
          el.style.opacity = (dir<0&&pageNo<=0)||(dir>0&&pageNo>=total-1) ? '.35' : '';
        });
      }
    }

    /* The designed category chips become the real filter. The design draws five
       placeholder labels (All / Product / Enterprise AI / Engineering / Other);
       the blog has SEVEN real categories. The old pass rewrote each matched node's
       text in DOCUMENT order -- which is not visual order on this flat sheet -- so
       labels landed in the wrong boxes ("AWS" in the 19px-wide "All" slot,
       "Digital Transformation" in the 52px "Other" slot, clipped to "Digital Tra"),
       and the last two categories never got a chip at all. Lay the row out
       properly instead: sort the matched chips by x, clone extras for the missing
       categories, give every chip its real label at natural width, and re-chain
       the lefts so the row reads All · AWS · … · Cloud with the design's own gap. */
    /* Anchored to the "Browse by category:" label -- same baseline, to its right.
       A grid CARD's designed category chip also reads "Product", and matching on
       label text alone let it into this row: it displaced every real chip one
       slot AND became chipRow[0], so the row's gap was measured from a card chip
       three hundred pixels away and the re-chained lefts marched the whole row
       off the right edge of the page. */
    var chipRow=s.texts.filter(function(t){
      return /^(All|Product|Enterprise AI|Engineering|Other)$/.test(t.t) &&
             browse && Math.abs(t.r.top-browse.r.top)<14 && t.r.left>browse.r.left;
    }).sort(function(a,b){ return a.r.left-b.r.left; });
    if(chipRow.length){
      var vwpx=(document.documentElement.clientWidth||1920)/100;
      /* Each chip is a painted PLATE plus a label sitting on it. Moving only the
         labels left every plate at its designed x, so boxes and text drifted apart
         -- and because the design has five slots for seven real categories the row
         also ran off the right edge ("Digital Transformation" clipped to "Digita").
         Move plate and label together, size each plate to its own label, and END
         the row where the design's last plate ended: it stays right-aligned to the
         content column and grows leftward into the empty space after "Browse by
         category:" instead of overflowing the page. */
      var pairs=chipRow.map(function(t){ return {label:t.el, plate:plateFor(t,s.page)}; });
      var padPx=34, gapPx=8, i0;
      for(i0=0;i0<pairs.length;i0++){
        if(!pairs[i0].plate) continue;
        var pw=pairs[i0].plate.getBoundingClientRect().width;
        if(pw>chipRow[i0].r.width){ padPx=pw-chipRow[i0].r.width; break; }
      }
      for(i0=1;i0<pairs.length;i0++){
        if(!pairs[i0].plate||!pairs[i0-1].plate) continue;
        var g=pairs[i0].plate.getBoundingClientRect().left-pairs[i0-1].plate.getBoundingClientRect().right;
        if(g>0){ gapPx=g; break; }
      }
      /* These chips sit inside a POSITIONED ancestor, so an absolute `left` is
         resolved against that container -- writing the page-space x straight in
         put the whole row ~1080px to the right and off the page. Place by DELTA
         from where the element currently renders instead: works whatever the
         containing block is, and stays in vw so it still scales with the layout
         (left:Nvw always computes to N*vwpx, container notwithstanding). */
      function placeX(el,targetX){
        var cur=el.getBoundingClientRect().left;
        var comp=parseFloat(getComputedStyle(el).left)||0;
        el.style.left=((comp+(targetX-cur))/vwpx).toFixed(4)+'vw';
      }
      var lastPlate=pairs[pairs.length-1].plate;
      var rowRight=lastPlate?lastPlate.getBoundingClientRect().right
                            :chipRow[chipRow.length-1].r.right;
      while(pairs.length<CATS.length){
        var src=pairs[pairs.length-1];
        var nl=src.label.cloneNode(false);
        src.label.parentNode.appendChild(nl);
        var np=src.plate?src.plate.cloneNode(false):null;
        if(np) src.plate.parentNode.insertBefore(np,nl);
        pairs.push({label:nl,plate:np});
      }
      /* measure every label at its natural width first, then place right-to-left */
      var widths=pairs.map(function(pr,i){
        if(CATS[i]===undefined) return 0;
        pr.label.textContent=CATS[i];
        pr.label.style.width='auto';
        pr.label.style.whiteSpace='nowrap';
        return pr.label.getBoundingClientRect().width+padPx;
      });
      var total=0;
      widths.forEach(function(w,i){ if(w) total+=w+(i?gapPx:0); });
      var x=rowRight-total;
      /* selected vs idle styling read off the design's own first and second chip */
      var selBg=pairs[0].plate?getComputedStyle(pairs[0].plate).backgroundColor:'';
      var selFg=getComputedStyle(pairs[0].label).color;
      var idleBg=(pairs[1]&&pairs[1].plate)?getComputedStyle(pairs[1].plate).backgroundColor:'';
      var idleFg=pairs[1]?getComputedStyle(pairs[1].label).color:selFg;
      function paintChips(){
        pairs.forEach(function(pr,j){
          if(CATS[j]===undefined) return;
          var on=(CATS[j]===active);
          if(pr.plate) pr.plate.style.backgroundColor = on?selBg:idleBg;
          pr.label.style.color = on?selFg:idleFg;
        });
      }
      pairs.forEach(function(pr,i){
        var label=CATS[i];
        if(label===undefined){
          pr.label.style.display='none';
          if(pr.plate) pr.plate.style.display='none';
          return;
        }
        var w=widths[i];
        if(pr.plate){
          pr.plate.style.width=(w/vwpx).toFixed(4)+'vw';
          placeX(pr.plate,x);
          pr.plate.style.cursor='pointer';
        }
        placeX(pr.label,x+padPx/2);
        pr.label.classList.add('ax-bl-hit','ax-bl-chip');
        if(pr.plate) pr.plate.classList.add('ax-bl-chip');
        pr.label.setAttribute('role','button');
        pr.label.setAttribute('tabindex','0');
        x+=w+gapPx;
        var pick=function(){ active=label; pageNo=0; paintChips(); render(); };
        pr.label.addEventListener('click',pick);
        if(pr.plate) pr.plate.addEventListener('click',pick);
        pr.label.addEventListener('keydown',function(e){
          if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); }
        });
      });
      paintChips();
    }

    wireSearch();
    render();
    /* Final sweep: a slot the geometry detector never claimed still shows Figma's
       stock byline. Attribute it to the post whose title sits directly above it,
       so no card on the blog index goes out signed "John Smith". */
    setTimeout(function(){
      [].slice.call(document.querySelectorAll('.g-t')).forEach(function(e){
        if(!/^John Smith$/i.test((e.textContent||'').trim())) return;
        var r=e.getBoundingClientRect();
        var best=null,bestGap=1e9;
        POSTS.forEach(function(p){
          [].slice.call(document.querySelectorAll('.ax-bl-t')).forEach(function(t){
            if((t.textContent||'').trim()!==p.t) return;
            var q=t.getBoundingClientRect();
            var gap=r.top-q.bottom;
            if(gap<-8||gap>140) return;
            if(Math.abs(q.left-r.left)>560) return;
            if(gap<bestGap){ bestGap=gap; best=p; }
          });
        });
        e.textContent=(best&&best.a)||'AeonX Digital';
      });
    },80);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
  addEventListener('load',function(){ setTimeout(init,150); });
})();
</script>
