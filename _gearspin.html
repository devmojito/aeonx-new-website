<style id="ax-gearspin-css">
/* Industries hero gears. Each industries page decorates its hero with two big
   radial gear/fan vectors (top-left and bottom-right corner, one pair per page,
   all ~square exports so they rotate about their own centre without wobble).
   Selector-gated by asset id: nothing else on the site matches. The top-left
   gear turns clockwise, the bottom-right counter-clockwise and slightly slower,
   like a meshed pair. transform is free on these imgs (the generator writes
   only position + blur), and the hero clip keeps the swing inside the section. */
img.g-vec[src*="4690-13422"],
img.g-vec[src*="6131-22640"],
img.g-vec[src*="6138-25615"],
img.g-vec[src*="6138-25921"],
img.g-vec[src*="6138-26092"],
img.g-vec[src*="6138-26187"]{animation:ax-gear-cw 80s linear infinite}
img.g-vec[src*="4690-13425"],
img.g-vec[src*="6138-25456"],
img.g-vec[src*="6138-25767"],
img.g-vec[src*="6138-25985"],
img.g-vec[src*="6138-26117"],
img.g-vec[src*="6138-26173"]{animation:ax-gear-ccw 104s linear infinite}
/* Animate the standalone `rotate` property, NOT `transform`: the scroll-reveal
   fragment leaves `transform:translateY(0)` on revealed hero elements, and a
   keyframe to transform:rotate(360deg) against that base has MISMATCHED transform
   lists -- the browser falls back to matrix interpolation, and rotate(360deg) AS A
   MATRIX is the identity matrix, so the whole animation collapsed to a no-op
   (proven: 0px screenshot diff at animation-delay:-20s). `rotate` composes with
   any transform value and cannot collide with it. */
@keyframes ax-gear-cw{from{rotate:0turn}to{rotate:1turn}}
@keyframes ax-gear-ccw{from{rotate:0turn}to{rotate:-1turn}}
@media (prefers-reduced-motion:reduce){
  img.g-vec[src*="4690-134"],img.g-vec[src*="6131-22640"],img.g-vec[src*="6138-25"],
  img.g-vec[src*="6138-26"]{animation:none}
}
</style>
