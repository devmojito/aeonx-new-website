<script>
/* ---- CONTACT-FORM TABS ----
   The Figma component set has two variants ("Just want to talk?" /
   "Got a project in mind?") but only variant A was instantiated, so the second
   panel does not exist in the generated page at all. Variant B's markup lives in
   the templates above (regenerated from Figma with _gen.py's emitters) and is
   injected next to variant A's panel on load.

   The tab strip is four FLAT SIBLINGS -- fill, label, fill, label -- so the
   labels paint over the fills. Labels get pointer-events:none and the fills are
   the tab controls; the label divs supply the accessible name via
   aria-labelledby, so no copy is duplicated in JS. */
(function(){
  var A_TXT = 'Just want to talk?';
  var B_TXT = 'Got a project in mind?';
  /* Figma: active tab DF3F17 / white label, idle tab ECEEF2 / 23272E label.
     Identical in both variants and on both breakpoints -- selecting a tab is a
     straight swap of the two fills and the two label colours. Font weights are
     NOT swapped: Figma keeps 600/600 on desktop and 600/400 on mobile in both
     variants. */
  var FILL = ['rgb(236,238,242)', 'rgb(223,63,23)'];
  var LBL  = ['rgb(35,39,46)', 'rgb(255,255,255)'];
  var uid = 0;

  function txt(e){ return (e.textContent || '').replace(/\s+/g, ' ').trim(); }
  function num(el, k){
    var m = (el.getAttribute('style') || '').match(new RegExp(k + ':\\s*(-?[0-9.]+)vw'));
    return m ? parseFloat(m[1]) : null;
  }
  function vw(v){ return v.toFixed(4) + 'vw'; }

  /* Mobile variant B is 88px taller than variant A and the whole page is
     absolutely positioned, so nothing below it reflows on its own. Shift every
     later sibling down by the delta, stretch the one section box that spans the
     panel, and grow the page height. Reversed exactly on switching back. */
  function reflow(page, strip, panelA, panelB){
    var top = num(panelA, 'top'), hA = num(panelA, 'height'), hB = num(panelB, 'height');
    if (top === null || hA === null || hB === null) return null;
    var delta = hB - hA;
    if (Math.abs(delta) < 0.01) return null;      /* desktop: both variants are 720px */
    var bottom = top + hA;
    var moves = [], H = num(page, 'height');
    for (var i = 0; i < page.children.length; i++){
      var el = page.children[i];
      if (el === strip || el === panelA || el === panelB) continue;
      var t = num(el, 'top'); if (t === null) continue;
      var h = num(el, 'height');
      if (t >= bottom - 0.01) moves.push({ el: el, k: 'top', v: t });
      else if (h !== null && t + h > bottom + 0.01) moves.push({ el: el, k: 'height', v: h });
    }
    return function(on){
      for (var j = 0; j < moves.length; j++){
        var m = moves[j];
        m.el.style[m.k] = vw(on ? m.v + delta : m.v);
      }
      if (H !== null) page.style.height = vw(on ? H + delta : H);
    };
  }

  function setup(strip){
    if (strip.getAttribute('data-ax-ftabs')) return;
    var kids = strip.children;
    if (kids.length !== 4 || txt(kids[1]) !== A_TXT || txt(kids[3]) !== B_TXT) return;
    var panelA = strip.nextElementSibling;
    var tpl = document.getElementById(
      strip.closest('.ax-mob') ? 'ax-ftabs-m' : 'ax-ftabs-d');
    if (!panelA || !tpl || !tpl.content.firstElementChild) return;
    strip.setAttribute('data-ax-ftabs', '1');

    var panelB = tpl.content.firstElementChild.cloneNode(true);
    panelA.parentNode.insertBefore(panelB, panelA.nextSibling);

    var n = ++uid, tabs = [kids[0], kids[2]], labels = [kids[1], kids[3]];
    var panels = [panelA, panelB];
    var shift = reflow(strip.parentElement, strip, panelA, panelB);

    strip.setAttribute('role', 'tablist');
    for (var i = 0; i < 2; i++){
      labels[i].className += ' ax-ftabs-lbl';
      labels[i].id = 'ax-ftabs-l' + n + i;
      /* Figma emits the label as a SIBLING of the tab, so without this the tablist owns
         two non-tab children (an ARIA violation) and each tab name is announced twice.
         aria-labelledby still resolves through an aria-hidden target, so the tab and the
         panel both keep their visible name. */
      labels[i].setAttribute('aria-hidden', 'true');
      panels[i].id = 'ax-ftabs-p' + n + i;
      panels[i].setAttribute('role', 'tabpanel');
      /* Point the panel at the LABEL div, not at the tab. aria-labelledby does NOT
         recurse: naming the panel after a tab whose own name comes from aria-labelledby
         yields the tab's text CONTENT, and these Figma tab divs have none -- the panel
         ended up with an empty accessible name. */
      panels[i].setAttribute('aria-labelledby', 'ax-ftabs-l' + n + i);
      /* layout-only markup, so the panel holds no focusable child of its own --
         APG says make the panel itself focusable in that case. */
      panels[i].setAttribute('tabindex', '0');
      tabs[i].className += ' ax-ftabs-hit';
      tabs[i].id = 'ax-ftabs-t' + n + i;
      tabs[i].setAttribute('role', 'tab');
      tabs[i].setAttribute('aria-controls', 'ax-ftabs-p' + n + i);
      tabs[i].setAttribute('aria-labelledby', 'ax-ftabs-l' + n + i);
    }

    function select(k, focus){
      for (var i = 0; i < 2; i++){
        var on = i === k;
        tabs[i].style.backgroundColor = FILL[on ? 1 : 0];
        labels[i].style.color = LBL[on ? 1 : 0];
        tabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
        tabs[i].setAttribute('tabindex', on ? '0' : '-1');
        panels[i].classList.toggle('ax-ftabs-off', !on);
      }
      if (shift) shift(k === 1);
      if (focus) tabs[k].focus();
    }

    for (i = 0; i < 2; i++) (function(i){
      tabs[i].addEventListener('click', function(){ select(i); });
      tabs[i].addEventListener('keydown', function(e){
        var k = e.key;
        if (k === 'Enter' || k === ' ' || k === 'Spacebar') { e.preventDefault(); select(i); }
        else if (k === 'ArrowRight' || k === 'ArrowDown') { e.preventDefault(); select(1, true); }
        else if (k === 'ArrowLeft' || k === 'ArrowUp') { e.preventDefault(); select(0, true); }
        else if (k === 'Home') { e.preventDefault(); select(0, true); }
        else if (k === 'End') { e.preventDefault(); select(1, true); }
      });
    })(i);

    select(0);   /* variant A stays the default */
  }

  function init(){
    /* Query at call time and scan the whole document: the .ax-mob block may be
       injected AFTER this script. */
    var t = document.querySelectorAll('.g-b.g-clip > .g-t');
    for (var i = 0; i < t.length; i++)
      if (txt(t[i]) === A_TXT) setup(t[i].parentElement);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
