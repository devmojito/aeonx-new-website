<style id="ax-herotabs-css">
/* 300ms / EASE_OUT is not a guess: every `Tab` node in the component set carries
   transitionDuration 300 and transitionEasing EASE_OUT, which is what Figma would
   have played on the prototype's variant swap. EASE_OUT is cubic-bezier(0,0,.58,1). */
:root{--ax-ht-t:.3s cubic-bezier(0,0,.58,1)}
.ax-ht-tab{cursor:pointer;-webkit-user-select:none;user-select:none}
.ax-ht-tab:focus-visible{outline:2px solid #df3f17;outline-offset:2px;border-radius:3px}
/* Added only after the first paint, so the page does not animate itself on load. */
.ax-ht-anim{transition:left var(--ax-ht-t),top var(--ax-ht-t),width var(--ax-ht-t),
            height var(--ax-ht-t),color var(--ax-ht-t)}
.ax-ht-grid{transition:top var(--ax-ht-t),height var(--ax-ht-t),opacity .15s linear}
@media (prefers-reduced-motion:reduce){
  .ax-ht-anim,.ax-ht-grid{transition:none}
}
</style>
<script>
/* ---- HERO SEARCH-TYPE TABS (Products / AI Agents / Services) ----

   In Figma this widget is a COMPONENT_SET with three variants and the tab click is a
   prototype variant swap, so only the default "Products" state survives the export.
   This restores the other two at runtime by re-labelling the one exported grid.

   EVERY NUMBER HERE IS READ OFF THE DOM. The previous version carried a table of
   Figma pixel values harvested from Component 226, and when the designer switched the
   hero to Component 227 the tile grew 158 -> 208px while the table did not. The scale
   factor was derived as `tileWidth / spec.tileW`, so it came out 31.6% too large and
   every coordinate the fragment wrote was wrong -- on FIRST PAINT, not just on click.
   That is what put the icons on top of their labels and pushed "Services" out of its
   own tab strip. A layout table that has to be re-harvested by hand whenever the
   design is resized is the bug, so there isn't one any more: the exported Products
   state is already correct, and it is the only measurement needed.

   What genuinely differs per variant is CONTENT, not geometry: which labels, which
   icons, and how many tiles. That is all that is listed below.

   The grid is FLAT in the export -- plate, icon, label, plate, icon, label, ... as
   siblings of the grid container, not nested per tile. Raster icons emit as a
   `.g-b.g-clip` div and vector icons as `img.g-vec`, so an icon is NOT identifiable
   by tag or class alone: the plates are picked out by being the widest boxes, and
   each plate then claims the icon and label sitting inside its own rectangle. */
(function () {
  var TABS = ['Products', 'AI Agents', 'Services'];

  /* Per variant: the tile labels in slot order, each with the asset that draws its
     icon. `null` keeps whatever the export already put in that slot, which is what
     Products wants. A `null` ENTRY is a deliberately blank tile: Figma's Services
     variant keeps two empty cells in the second row so the card is not half-drawn. */
  var VARIANTS = {
    'Products': [
      ['SupplierX', null], ['OrderX', null], ['Xpense', null], ['ManufeX', null],
      ['LogystiX', null], ['SetuMove', null], ['CRM 360', null], ['QUIC', null]
    ],
    'Services': [
      ['SAP', '6958-20885'], ['AWS', '6958-20887'],
      ['GCP', '6958-20889'], ['ANTHROPIC', '6958-20891'],
      ['Multi Cloud CMS', '6958-21014'], ['AI & DATA', '6958-21020'],
      null, null
    ],
    'AI Agents': [
      ['JARVIS', '6956-63466'], ['AEONXIQ', '6956-63469'],
      ['DATASETU.AI', '6956-63472'], ['SETUEDGE', '6962-4244']
    ]
  };

  var ACTIVE = 'rgb(223, 63, 23)', IDLE = 'rgb(134, 149, 170)';
  var GAP = 8 / 20;            /* icon-to-label gap, as a fraction of the icon width */

  function txt(e) { return (e.textContent || '').replace(/\s+/g, ' ').trim(); }

  /* Captured synchronously at parse time, which is BEFORE _uifx.html's
     DOMContentLoaded pass re-centres anything it considers a control. Those are the
     rects Figma exported and the ones the tabs have to keep; read them later and the
     nudge is already baked in (measured: 1.7px on Products and AI Agents). */
  function stash() {
    [].forEach.call(document.querySelectorAll('.g-t'), function (e) {
      if (TABS.indexOf((e.textContent || '').replace(/\s+/g, ' ').trim()) < 0) return;
      /* Only a real trio. The words "Products" and "Services" also appear as ordinary
         copy elsewhere on the page, and tagging those gave them a tab's pointer
         cursor for no reason. */
      var p = e.parentElement;
      if (!p) return;
      var trio = [].filter.call(p.children, function (c) {
        return c.classList && c.classList.contains('g-t') &&
               TABS.indexOf((c.textContent || '').replace(/\s+/g, ' ').trim()) > -1;
      });
      if (trio.length !== 3) return;
      if (!e.getAttribute('data-ax-ht0')) {
        e.setAttribute('data-ax-ht0', (e.style.left || '') + '|' + (e.style.width || ''));
      }
      /* Claim them here, at parse time, so _uifx.html's own DOMContentLoaded pass can
         tell a tab from a CTA pill before it starts moving labels around. */
      e.classList.add('ax-ht-tab');
    });
  }
  stash();
  function vw(el, p) { return parseFloat((el.style[p] || '').replace('vw', '')) || 0; }
  function setvw(el, p, n) { el.style[p] = n.toFixed(4) + 'vw'; }

  /* The widget: three sibling .g-t labels reading the tab names. Matched on the label
     trio rather than a class, because _gen.py derives class names from Figma layer
     names and every one of them here is "Container". */
  function findWidgets() {
    var out = [];
    [].forEach.call(document.querySelectorAll('.g-t'), function (e) {
      if (txt(e) !== TABS[0]) return;
      var p = e.parentElement;
      if (!p) return;
      var kids = [].filter.call(p.children, function (c) {
        return c.classList.contains('g-t') && TABS.indexOf(txt(c)) > -1;
      });
      if (kids.length === 3) out.push({ wrap: p, labels: kids });
    });
    return out;
  }

  function inside(box, o) {
    return box.l <= o.l + 0.05 && box.r >= o.r - 0.05 &&
           box.t <= o.t + 0.05 && box.b >= o.b - 0.05;
  }
  function boxOf(el) {
    var l = vw(el, 'left'), t = vw(el, 'top'), w = vw(el, 'width'), h = vw(el, 'height');
    return { l: l, t: t, w: w, h: h, r: l + w, b: t + h };
  }

  function build(w) {
    var wrap = w.wrap, labels = w.labels;
    var boxes = [].filter.call(wrap.children, function (c) {
      return c.classList.contains('g-b');
    });
    var lb = labels.map(boxOf);
    var bounds = {
      l: Math.min.apply(null, lb.map(function (b) { return b.l; })),
      r: Math.max.apply(null, lb.map(function (b) { return b.r; })),
      t: Math.min.apply(null, lb.map(function (b) { return b.t; })),
      b: Math.max.apply(null, lb.map(function (b) { return b.b; }))
    };

    /* The strip is the painted box behind all three labels; the pill is the smaller
       one behind only the active tab. Both are flat siblings, so geometry finds them. */
    var strip = null, pill = null;
    boxes.forEach(function (e) {
      var b = boxOf(e);
      if (b.t > bounds.b || b.b < bounds.t) return;
      if (b.l <= bounds.l + 0.05 && b.r >= bounds.r - 0.05) {
        if (!strip || b.w < boxOf(strip).w) strip = e;
      } else if (b.l <= lb[0].l + 0.05 && b.r >= lb[0].r - 0.05) {
        pill = e;
      }
    });

    /* The card below the tabs, and inside it the grid container holding the tiles. */
    var inner = null;
    boxes.forEach(function (e) {
      if (boxOf(e).t < bounds.b) return;
      var g = e.querySelector(':scope > .g-b.g-clip');
      if (g && g.querySelectorAll(':scope > .g-t').length >= 4) inner = e;
    });
    if (!inner) return null;
    var gridBox = inner.querySelector(':scope > .g-b.g-clip');

    var ir = boxOf(inner), outer = null;
    boxes.forEach(function (e) {
      if (e === inner) return;
      var b = boxOf(e);
      if (b.l <= ir.l + 0.05 && b.r >= ir.r - 0.05 &&
          b.t <= ir.t + 0.05 && b.b >= ir.b - 0.05) {
        if (!outer || boxOf(outer).h > b.h) outer = e;
      }
    });

    /* Plates are the widest boxes in the grid. A raster icon is also a `.g-b`, which
       is exactly what the old version mistook for a tile. */
    var gk = [].slice.call(gridBox.children);
    var gb = gk.filter(function (c) { return c.classList.contains('g-b'); });
    if (!gb.length) return null;
    var maxW = Math.max.apply(null, gb.map(function (c) { return boxOf(c).w; }));
    var plates = gb.filter(function (c) { return boxOf(c).w >= maxW - 0.01; });
    if (plates.length < 2) return null;

    /* Each plate claims the icon and label drawn inside its own rectangle. */
    var slots = plates.map(function (p) {
      var pb = boxOf(p), icon = null, label = null;
      gk.forEach(function (c) {
        if (c === p) return;
        var b = boxOf(c);
        if (!inside(pb, b)) return;
        if (c.classList.contains('g-t')) label = c;
        else if (!icon) icon = c;
      });
      return { plate: p, icon: icon, label: label, box: pb,
               icon0: icon ? (icon.tagName === 'IMG' ? icon.getAttribute('src')
                                                     : icon.style.backgroundImage) : null,
               labelBox: label ? boxOf(label) : null,
               iconBox: icon ? boxOf(icon) : null };
    });
    slots.sort(function (a, b) { return (a.box.t - b.box.t) || (a.box.l - b.box.l); });

    /* Column and row pitch straight off the exported plates. */
    var lefts = [], tops = [];
    slots.forEach(function (s) {
      if (lefts.indexOf(s.box.l) < 0) lefts.push(s.box.l);
      if (tops.indexOf(s.box.t) < 0) tops.push(s.box.t);
    });
    lefts.sort(function (a, b) { return a - b; });
    tops.sort(function (a, b) { return a - b; });
    var cols = lefts.length;
    var rowPitch = tops.length > 1 ? tops[1] - tops[0] : slots[0].box.h;
    var gridB = boxOf(gridBox);
    var inset = tops[0] - 0;                    /* plate top is already grid-relative */

    /* The tab labels' own exported rects, captured before anything moves them:
       _uifx.html re-centres what it considers a control, and role="tab" makes these
       controls, so they have to be re-asserted on every paint. */
    var tabRects = labels.map(function (e) {
      var raw = e.getAttribute('data-ax-ht0'), b = boxOf(e);
      if (!raw) return b;
      var p = raw.split('|');
      var l = parseFloat((p[0] || '').replace('vw', ''));
      var w = parseFloat((p[1] || '').replace('vw', ''));
      if (isNaN(l) || isNaN(w)) return b;
      return { l: l, t: b.t, w: w, h: b.h, r: l + w, b: b.b };
    });
    var pillPad = null;
    if (pill) {
      var pb2 = boxOf(pill), a0 = tabRects[0];
      pillPad = { l: a0.l - pb2.l, w: pb2.w - a0.w, t: pb2.t };
    }

    return { wrap: wrap, labels: labels, tabRects: tabRects, strip: strip, pill: pill,
             pillPad: pillPad, inner: inner, outer: outer, gridBox: gridBox,
             gridBox0: gridB, slots: slots, cols: cols, rowPitch: rowPitch,
             inset: inset, innerH0: ir.h, outerH0: outer ? boxOf(outer).h : 0,
             current: TABS[0] };
  }

  function applyChrome(W, name) {
    W.labels.forEach(function (el, i) {
      var on = txt(el) === name, r = W.tabRects[i];
      el.style.color = on ? ACTIVE : IDLE;
      el.style.fontWeight = on ? '600' : '400';
      el.setAttribute('aria-selected', on ? 'true' : 'false');
      el.tabIndex = on ? 0 : -1;
      /* Put the label back exactly where Figma drew it. */
      setvw(el, 'left', r.l);
      setvw(el, 'width', r.w);
      el.style.textAlign = 'center';
    });

    if (W.pill && W.pillPad) {
      var ai = 0;
      W.labels.forEach(function (el, i) { if (txt(el) === name) ai = i; });
      var r = W.tabRects[ai];
      setvw(W.pill, 'left', r.l - W.pillPad.l);
      setvw(W.pill, 'width', r.w + W.pillPad.w);
      setvw(W.pill, 'top', W.pillPad.t);
    }

    /* One row instead of two: the grid keeps its inset and re-centres in the card,
       which is what Figma's own Agents variant does (grid 32/68 against 10/112). */
    var items = VARIANTS[name] || [];
    var rows = Math.ceil(items.length / W.cols) || 1;
    var h = W.inset * 2 + rows * W.rowPitch;
    setvw(W.gridBox, 'height', h);
    setvw(W.gridBox, 'top', W.gridBox0.t + (W.gridBox0.h - h) / 2);
  }

  function applyGrid(W, name) {
    var items = VARIANTS[name] || [];
    W.slots.forEach(function (s, i) {
      var item = items[i];
      var used = i < items.length;
      s.plate.style.display = used ? '' : 'none';
      if (!used) {
        if (s.icon) s.icon.style.display = 'none';
        if (s.label) s.label.style.display = 'none';
        return;
      }
      /* A null entry is a drawn but empty cell: keep the plate, drop its contents. */
      if (!item) {
        if (s.icon) s.icon.style.display = 'none';
        if (s.label) s.label.style.display = 'none';
        return;
      }
      var row = (i / W.cols) | 0, col = i % W.cols;
      var top = W.inset + row * W.rowPitch;
      setvw(s.plate, 'top', top);

      if (s.label) {
        s.label.style.display = '';
        s.label.textContent = item[0];
      }
      if (s.icon) {
        s.icon.style.display = '';
        if (item[1]) {
          var url = '/assets/vec/' + item[1] + '.svg';
          if (s.icon.tagName === 'IMG') s.icon.setAttribute('src', url);
          else s.icon.style.backgroundImage = 'url(' + url + ')';
        } else if (s.icon0) {
          if (s.icon.tagName === 'IMG') s.icon.setAttribute('src', s.icon0);
          else s.icon.style.backgroundImage = s.icon0;
        }
      }

      /* Figma centres the icon+label PAIR in the tile, with a fixed gap. Measuring
         the label rather than assuming a width keeps every name centred, which a
         fixed full-tile-width box does not: that is what tore the icons off their
         labels before. */
      if (!s.label) return;
      var iw = s.iconBox ? s.iconBox.w : 0;
      var gap = iw * GAP;
      var lw = s.labelBox.w;
      if (item[0] !== s.label.dataset.axFor) {
        var prevW = s.label.style.width, prevWs = s.label.style.whiteSpace;
        s.label.style.width = 'auto';
        s.label.style.whiteSpace = 'nowrap';
        var px = s.label.getBoundingClientRect().width;
        s.label.style.width = prevW;
        s.label.style.whiteSpace = prevWs;
        if (px && innerWidth) lw = px * 100 / innerWidth;
        s.label.dataset.axFor = item[0];
        s.label.dataset.axW = lw;
      } else if (s.label.dataset.axW) {
        lw = parseFloat(s.label.dataset.axW);
      }
      var pairW = iw + gap + lw;
      var iconL = s.box.l + (s.box.w - pairW) / 2;
      if (s.icon && s.iconBox) {
        setvw(s.icon, 'left', iconL);
        setvw(s.icon, 'top', top + (s.box.h - s.iconBox.h) / 2);
      }
      setvw(s.label, 'left', iconL + iw + gap);
      setvw(s.label, 'width', lw);
      setvw(s.label, 'top', top + (s.box.h - s.labelBox.h) / 2);
      s.label.style.textAlign = 'left';
    });
  }

  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)');

  function paint(W, name, animate) {
    if (!VARIANTS[name]) return;
    W.current = name;
    W.token = (W.token || 0) + 1;
    var token = W.token;
    applyChrome(W, name);
    if (!animate || (REDUCED && REDUCED.matches)) {
      W.gridBox.style.opacity = '';
      applyGrid(W, name);
      return;
    }
    W.gridBox.style.opacity = '0';
    setTimeout(function () {
      if (W.token !== token) return;
      applyGrid(W, name);
      W.gridBox.style.opacity = '1';
    }, 150);
  }

  function wire(W) {
    if (W.strip) W.strip.setAttribute('role', 'tablist');
    W.labels.forEach(function (el) {
      /* _uifx.html's CTA pass turns any short label inside a painted pill into a
         role="link" pointing at "#". These are tabs, so take them back. */
      el.classList.add('ax-ht-tab');
      el.setAttribute('role', 'tab');
      el.removeAttribute('data-cta');
      if (el.getAttribute('href') === '#') el.removeAttribute('href');
      var go = function (e) {
        e.preventDefault(); e.stopPropagation();
        paint(W, txt(el), true); el.focus();
      };
      el.addEventListener('click', go, true);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') return go(e);
        var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        var order = W.labels.map(txt);
        var i = (order.indexOf(W.current) + d + order.length) % order.length;
        paint(W, order[i], true);
        W.labels[i].focus();
      });
    });
    [W.gridBox, W.inner, W.outer].forEach(function (e) {
      if (e) e.classList.add('ax-ht-grid');
    });
    /* The exported state IS the Products state and it is already correct, so the
       first paint only sets colours and ARIA -- it must not move anything. */
    applyChrome(W, TABS[0]);
    /* _uifx.html also runs a pass on `load`, and its handler was registered first but
       finishes after ours, so it re-centres the tabs out from under the first paint.
       Re-assert once it has settled; the values are identical, so nothing visibly
       moves except the 1.7px it had nudged. */
    setTimeout(function () { applyChrome(W, W.current); }, 60);
    setTimeout(function () {
      applyChrome(W, W.current);
      W.labels.forEach(function (e) { e.classList.add('ax-ht-anim'); });
      if (W.pill) W.pill.classList.add('ax-ht-anim');
    }, 400);
    /* One more, late. The chrome's own passes are spread across DOMContentLoaded,
       load and a reveal observer, and which of them lands last varies with how much
       of the page is cached; measured 3px of drift on "AI Agents" when one of them
       won the race. Writing the same values again costs nothing and settles it. */
    setTimeout(function () { applyChrome(W, W.current); }, 1400);
  }

  function run() {
    findWidgets().forEach(function (w) {
      var W = build(w);
      if (W) wire(W);
    });
  }
  if (document.readyState === 'complete') setTimeout(run, 0);
  else addEventListener('load', function () { setTimeout(run, 0); });
})();
</script>
