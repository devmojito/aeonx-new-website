<style id="ax-caseread-css">
/* ---- CASE-STUDY CARD CTA ALIGNMENT ----
   "Read the story" and its chevron sit in their own wrapper inside each card, and
   those wrappers drift right of the card's title -- 12px on the first card, 26 on
   the second, 40 on the third, growing with the column. The design lines the CTA up
   with the headline above it, so each label (and the chevron travelling with it) is
   nudged back onto its title's left edge.

   The WRAPPER moves, never the label. The label sits 12px inside a 157px box with
   overflow:hidden, so nudging the label itself just slid it under that box's left
   edge -- the second card read "ad The Story" and the third "The Story". Moving the
   wrapper carries the label and its chevron together and clips nothing.

   Position only, and only along X: the vertical rhythm of the card is untouched.

   The row is a TEXT link, not a pill. _hover.html reads its white box as an outlined
   button and washes it on hover, which is not what the design shows -- the client
   asked for a slight lift and nothing else. The button skins are stripped and this
   lift is all that is left.

   The wrapper is also widened when its own content would not fit: it is a fixed
   157px box with overflow:hidden, so at font metrics even slightly wider than the
   design's the chevron lands outside it and simply disappears. The box has no
   visible fill of its own (white on white), so widening it shows nothing new. */
.ax-csr{transition:transform .2s cubic-bezier(.22,.61,.36,1)}
.ax-csr:hover{transform:translateY(-0.1042vw)}
/* the skins _hover.html would otherwise paint on this row */
.ax-csr.ax-hv-out.ax-hv-selfon,.ax-csr.ax-hv-fill.ax-hv-selfon,
.ax-csr.ax-hv-out.ax-hv-on,.ax-csr.ax-hv-fill.ax-hv-on{
  background-image:none!important;background-size:0 100%!important;
  box-shadow:none!important;border-color:transparent!important}
@media (prefers-reduced-motion:reduce){.ax-csr{transition:none}.ax-csr:hover{transform:none}}
</style>
<script>
(function(){
  function txt(e){ return (e.textContent||'').replace(/\s+/g,' ').trim(); }
  function leftVw(el){
    var m = (el.getAttribute('style') || '').match(/left:\s*(-?[\d.]+)vw/);
    return m ? parseFloat(m[1]) : null;
  }
  function setLeftVw(el, v){
    var s = el.getAttribute('style') || '';
    el.setAttribute('style', s.replace(/left:\s*-?[\d.]+vw/, 'left:' + v.toFixed(4) + 'vw'));
  }

  function align(root){
    var vwpx = (document.documentElement.clientWidth || 1920) / 100;
    var labels = [].slice.call(root.querySelectorAll('.g-t')).filter(function(e){
      return /^read the story\b/i.test(txt(e)) && e.getBoundingClientRect().width;
    });
    if (!labels.length) return false;
    var moved = 0;
    labels.forEach(function(lab){
      var lb = lab.getBoundingClientRect();
      /* the card's headline: the nearest long line of text above the CTA, in the
         same column */
      var title = [].slice.call(root.querySelectorAll('.g-t')).map(function(e){
        return {el:e, r:e.getBoundingClientRect()};
      }).filter(function(o){
        return o.r.width && o.el !== lab && txt(o.el).length > 24 &&
               o.r.bottom <= lb.top + 4 && o.r.bottom > lb.top - 300 &&
               Math.abs(o.r.left - lb.left) < 200;
      }).sort(function(a, b){ return b.r.bottom - a.r.bottom; })[0];
      if (!title) return;
      var dx = title.r.left - lb.left;
      /* the box that owns the CTA row: the label's positioned parent, as long as it
         is a row and not the whole card */
      var wrap = lab.parentElement;
      if (!wrap) return;
      var wr = wrap.getBoundingClientRect();
      if (!wr.width || wr.width > 400 || wr.height > 120) return;
      if (Math.abs(dx) < 1) { pin(); return; }
      /* The wrapper's left may be vw (as generated) or px -- the CTA auto-fit writes
         px when it shifts a row along. Read whichever is there and always write back
         vw, so the fix survives a resize like the rest of the layout. */
      var cur = leftVw(wrap);
      if (cur === null){
        var px = parseFloat(getComputedStyle(wrap).left);
        if (isNaN(px)) return;
        cur = px / vwpx;
        var st = wrap.getAttribute('style') || '';
        wrap.setAttribute('style', st.replace(/left:\s*-?[\d.]+px/, 'left:' + cur.toFixed(4) + 'vw'));
      }
      setLeftVw(wrap, cur + dx / vwpx);
      pin();
      moved++;

      /* PIN the chevron to the label's ink at the design's gap. Its source `left`
         is a fixed x sized for the design's font metrics; render the label any
         wider (fonts, zoom, Title Case) and other passes shove the chevron around
         -- it shipped ~100px adrift of the label and, before the box was widened,
         clipped out of sight entirely. Written every pass, so nothing that runs
         later can leave it anywhere else. Figma draws an 8px gap. */
      function pin(){
        wrap.classList.remove('ax-hv-out', 'ax-hv-fill', 'ax-hv-fill--pale', 'ax-hv-btn');
        wrap.classList.add('ax-csr');
        /* The wrapper ships with a white fill -- invisible inside the white card,
           but once this pass moves it left it overlaps the card's border lines and
           reads as a white slab. It paints nothing the design needs. */
        wrap.style.backgroundColor = 'transparent';
        var chev = [].slice.call(wrap.children).filter(function(e){
          return /g-vec/.test(e.className || '') && e.getBoundingClientRect().width;
        })[0];
        if (!chev) return;
        var rng = document.createRange();
        rng.selectNodeContents(lab);
        var ink = rng.getBoundingClientRect();
        var nwr = wrap.getBoundingClientRect();
        if (!ink.width || !nwr.width) return;
        var gap = 8 * vwpx / (1920 / 100);            /* 8px at the 1920 design width */
        var want = (ink.right + gap) - nwr.left;      /* chevron left, wrapper-local px */
        var cr = chev.getBoundingClientRect();
        if (Math.abs((cr.left - nwr.left) - want) > 1){
          var st2 = chev.getAttribute('style') || '';
          var vwL = want / vwpx;
          chev.setAttribute('style', /left:\s*-?[\d.]+(vw|px)/.test(st2)
            ? st2.replace(/left:\s*-?[\d.]+(vw|px)/, 'left:' + vwL.toFixed(4) + 'vw')
            : st2 + ';left:' + vwL.toFixed(4) + 'vw');
          cr = chev.getBoundingClientRect();
        }
        /* and the clip box must hold it */
        var over = (cr.right + 6) - nwr.right;
        if (over > 0){
          var wpx = parseFloat(getComputedStyle(wrap).width);
          if (!isNaN(wpx)){
            var st3 = wrap.getAttribute('style') || '';
            var vwW = (wpx + over) / vwpx;
            wrap.setAttribute('style', /width:\s*-?[\d.]+(vw|px)/.test(st3)
              ? st3.replace(/width:\s*-?[\d.]+(vw|px)/, 'width:' + vwW.toFixed(4) + 'vw')
              : st3 + ';width:' + vwW.toFixed(4) + 'vw');
          }
        }
      }
    });
    return moved > 0;
  }

  /* Run repeatedly rather than once. The CTA auto-fit shifts a row's later pills
     along AFTER this file's first pass, which left a residual 5px on the second card
     and 10px on the third; align() only writes when a label is more than a pixel out,
     so re-running simply converges and costs nothing once it is right. */
  function init(){
    var main = document.querySelector('main.ax-page');
    if (main) align(main);
  }
  [700, 1300, 1900, 2600].forEach(function(t){ setTimeout(init, t); });
  addEventListener('load', function(){ setTimeout(init, 800); });
  addEventListener('resize', function(){ setTimeout(init, 500); });
})();
</script>
