<style id="ax-caseread-css">
/* ---- CASE-STUDY CARD CTA ALIGNMENT ----
   "Read the story" and its chevron sit in their own wrapper inside each card, and
   those wrappers drift right of the card's title -- 12px on the first card, 26 on
   the second, 40 on the third, growing with the column. The design lines the CTA up
   with the headline above it, so each label (and the chevron travelling with it) is
   nudged back onto its title's left edge.

   The WRAPPER moves, never the label. The label sits 12px inside a 157px box with
   overflow:hidden, so nudging the label itself just slid it under that box's left
   edge -- the second card read "ad The Story" and the third "The Story". Moving the
   wrapper carries the label and its chevron together and clips nothing.

   Position only, and only along X: the vertical rhythm of the card is untouched. */
</style>
<script>
(function(){
  function txt(e){ return (e.textContent||'').replace(/\s+/g,' ').trim(); }
  function leftVw(el){
    var m = (el.getAttribute('style') || '').match(/left:\s*(-?[\d.]+)vw/);
    return m ? parseFloat(m[1]) : null;
  }
  function setLeftVw(el, v){
    var s = el.getAttribute('style') || '';
    el.setAttribute('style', s.replace(/left:\s*-?[\d.]+vw/, 'left:' + v.toFixed(4) + 'vw'));
  }

  function align(root){
    var vwpx = (document.documentElement.clientWidth || 1920) / 100;
    var labels = [].slice.call(root.querySelectorAll('.g-t')).filter(function(e){
      return /^read the story\b/i.test(txt(e)) && e.getBoundingClientRect().width;
    });
    if (!labels.length) return false;
    var moved = 0;
    labels.forEach(function(lab){
      var lb = lab.getBoundingClientRect();
      /* the card's headline: the nearest long line of text above the CTA, in the
         same column */
      var title = [].slice.call(root.querySelectorAll('.g-t')).map(function(e){
        return {el:e, r:e.getBoundingClientRect()};
      }).filter(function(o){
        return o.r.width && o.el !== lab && txt(o.el).length > 24 &&
               o.r.bottom <= lb.top + 4 && o.r.bottom > lb.top - 300 &&
               Math.abs(o.r.left - lb.left) < 200;
      }).sort(function(a, b){ return b.r.bottom - a.r.bottom; })[0];
      if (!title) return;
      var dx = title.r.left - lb.left;
      if (Math.abs(dx) < 1) return;
      /* the box that owns the CTA row: the label's positioned parent, as long as it
         is a row and not the whole card */
      var wrap = lab.parentElement;
      if (!wrap) return;
      var wr = wrap.getBoundingClientRect();
      if (!wr.width || wr.width > 400 || wr.height > 120) return;
      /* The wrapper's left may be vw (as generated) or px -- the CTA auto-fit writes
         px when it shifts a row along. Read whichever is there and always write back
         vw, so the fix survives a resize like the rest of the layout. */
      var cur = leftVw(wrap);
      if (cur === null){
        var px = parseFloat(getComputedStyle(wrap).left);
        if (isNaN(px)) return;
        cur = px / vwpx;
        var st = wrap.getAttribute('style') || '';
        wrap.setAttribute('style', st.replace(/left:\s*-?[\d.]+px/, 'left:' + cur.toFixed(4) + 'vw'));
      }
      setLeftVw(wrap, cur + dx / vwpx);
      moved++;
    });
    return moved > 0;
  }

  /* Run repeatedly rather than once. The CTA auto-fit shifts a row's later pills
     along AFTER this file's first pass, which left a residual 5px on the second card
     and 10px on the third; align() only writes when a label is more than a pixel out,
     so re-running simply converges and costs nothing once it is right. */
  function init(){
    var main = document.querySelector('main.ax-page');
    if (main) align(main);
  }
  [700, 1300, 1900, 2600].forEach(function(t){ setTimeout(init, t); });
  addEventListener('load', function(){ setTimeout(init, 800); });
  addEventListener('resize', function(){ setTimeout(init, 500); });
})();
</script>
