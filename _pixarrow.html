<style id="ax-pixarrow-css">
/* ---- THE PIXEL ARROW CUE ----
   Six pages carry a column of three pixel-art arrows pointing down, sitting between
   the hero heading and the paragraph. They are a "keep going" cue and they were
   completely still.

   The three arrows are baked into ONE svg -- twelve flat <path> elements in three
   identical clusters -- and page CSS cannot reach inside an <img>. The file is
   inlined and its clusters wrapped in groups so each arrow can move on its own.

   The cascade runs top to bottom, which is the direction the cue is pointing. Each
   arrow is mostly faint and brightens as the pulse passes it, so the eye is led
   down the column rather than three things blinking at once. */
.ax-pa-g{opacity:.34;animation:ax-pa-pulse 1.9s cubic-bezier(.4,0,.6,1) infinite}
@keyframes ax-pa-pulse{
  0%,70%,100%{opacity:.34;transform:translateY(0)}
  28%{opacity:1;transform:translateY(6%)}
}
@media (prefers-reduced-motion:reduce){
  .ax-pa-g{opacity:.6;animation:none}
}
</style>
<script>
/* ---- ANIMATE THE PIXEL ARROW CUE ----
   The svg is swapped for an inline copy of itself, at the same box and in the same
   stacking slot, so the placement _gen.py computed still holds. Nothing is edited
   into the asset on disk: _vecfetch.py --force would overwrite that on the next
   pull, and the same three arrows appear on any page drawn from the same Figma
   component.

   Which images: the cue is a wide, short strip, so only images at least three times
   wider than they are tall are even fetched. The real test is the shape of the file
   -- twelve paths in three identical clusters down a column -- so a new page gets
   this without being named here. */
(function () {
  var REDUCED = matchMedia('(prefers-reduced-motion:reduce)');

  /* Cluster the paths by their first Y: the pixels within one arrow sit a few units
     apart, the arrows themselves much further.

     The threshold comes from the gaps themselves rather than from the box. A share
     of the box height looked reasonable and was wrong -- the same three arrows are
     drawn in a 783x64 box on five pages and a 518x144 box on the sixth, and a sixth
     of 144 is wider than the gap between its arrows, so all twelve pixels came back
     as one cluster and that page kept a still cue. Twice the median gap separates
     them in both. */
  function cluster(paths) {
    var rows = paths.map(function (p) {
      var n = (p.getAttribute('d') || '').match(/-?[\d.]+/g) || [];
      return { el: p, y: parseFloat(n[1]) };
    }).filter(function (r) { return r.y === r.y; });
    if (rows.length !== paths.length) return null;
    rows.sort(function (a, b) { return a.y - b.y; });
    var gaps = [];
    for (var j = 1; j < rows.length; j++) gaps.push(rows[j].y - rows[j - 1].y);
    var med = gaps.slice().sort(function (a, b) { return a - b; })[gaps.length >> 1];
    var cut = Math.max(med * 2, 0.5);
    var out = [[rows[0]]];
    for (var i = 1; i < rows.length; i++) {
      if (rows[i].y - rows[i - 1].y > cut) out.push([]);
      out[out.length - 1].push(rows[i]);
    }
    return out;
  }

  function inline(img, text) {
    var doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    var svg = doc.documentElement;
    if (!svg || svg.nodeName.toLowerCase() !== 'svg') return;
    var vb = (svg.getAttribute('viewBox') || '').split(/\s+/);
    var boxH = parseFloat(vb[3]);
    if (!(boxH > 0)) return;

    var paths = [].slice.call(svg.querySelectorAll('path'));
    if (paths.length !== 12) return;
    var groups = cluster(paths);
    /* three arrows of four pixels each, or it is not this cue */
    if (!groups || groups.length !== 3 || !groups.every(function (g) { return g.length === 4; })) return;

    groups.forEach(function (g, gi) {
      var wrap = doc.createElementNS('http://www.w3.org/2000/svg', 'g');
      wrap.setAttribute('class', 'ax-pa-g');
      /* The stagger is set here rather than by :nth-of-type. The arrows are not the
         only <g> in these files, so counting siblings by type picked the wrong ones
         and all three ran together. */
      wrap.style.animationDelay = (gi * 0.19).toFixed(2) + 's';
      /* each arrow turns about its own centre, not the box's */
      var ys = g.map(function (r) { return r.y; });
      wrap.style.transformOrigin = '0 ' + ((Math.min.apply(null, ys) +
        Math.max.apply(null, ys)) / 2).toFixed(2) + 'px';
      wrap.style.transformBox = 'view-box';
      g[0].el.parentNode.insertBefore(wrap, g[0].el);
      g.forEach(function (r) { wrap.appendChild(r.el); });
    });

    var el = document.importNode(svg, true);
    /* Same box, same slot: the <img> carries the geometry the generator wrote. */
    el.setAttribute('style', img.getAttribute('style') || '');
    el.setAttribute('class', ((img.getAttribute('class') || '') + ' ax-pa').trim());
    el.setAttribute('aria-hidden', 'true');
    el.setAttribute('focusable', 'false');
    el.removeAttribute('width'); el.removeAttribute('height');
    img.parentNode.replaceChild(el, img);
    /* No visibility gating here. It was tried and it stuck in the paused state, and
       it was never worth it anyway: this is three groups of four rectangles, and a
       browser already deprioritises animation on what it is not painting. */
  }

  function run() {
    if (REDUCED.matches) return;
    [].forEach.call(document.querySelectorAll('img.g-vec'), function (img) {
      if (img.dataset.axPa) return;
      var r = img.getBoundingClientRect();
      if (!(r.width > 0) || r.width < r.height * 3) return;   /* a wide, short strip */
      img.dataset.axPa = '1';
      var src = img.getAttribute('src');
      if (!src || !/\.svg$/i.test(src)) return;
      fetch(src, { credentials: 'omit' })
        .then(function (r2) { return r2.ok ? r2.text() : null; })
        .then(function (t) { if (t && t.length < 6000) inline(img, t); })
        .catch(function () {});
    });
  }

  if (document.readyState === 'complete') setTimeout(run, 0);
  else addEventListener('load', function () { setTimeout(run, 0); });
})();
</script>
