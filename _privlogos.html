<style id="ax-privlogos-css">
/* ---- HOMEPAGE CLIENT LOGO MARQUEE ----
   The band shipped with Figma's vector exports of a handful of marks. The client
   asked for the real customer set from private.zip (75 logos) and nothing else.
   Driven by rAF rather than a CSS animation, because the strip has to be DRAGGABLE:
   a CSS keyframe cannot be scrubbed, so the position is owned in JS and the drag
   just moves it. It does NOT pause on hover -- only while you are actually holding
   it. Two copies sit end to end and the position wraps at half the track, which
   loops without a visible seam. Each <img> carries its intrinsic width/height so
   the row has a real width before the lazy images arrive. */
.ax-plg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;
  cursor:grab;touch-action:pan-y}
.ax-plg.is-drag{cursor:grabbing}
.ax-plg__track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;
  gap:3.3vw;width:max-content;will-change:transform}
/* every element on this page is absolutely positioned by the generator, and an
   absolutely positioned flex child is out of flow -- the track collapsed to 0 wide
   with all 150 logos stacked at x=0 until the images were forced back to static. */
.ax-plg__track img{position:static!important;height:60%;width:auto;flex:0 0 auto;
  object-fit:contain;filter:grayscale(1);opacity:.72;
  transition:filter .3s ease,opacity .3s ease;user-select:none;-webkit-user-drag:none}
.ax-plg__track img:hover{filter:none;opacity:1}
</style>
<script>
(function(){
  var LOGOS=[["ACME.webp", 150, 100], ["AFCONS.webp", 150, 100], ["APAR.webp", 150, 100], ["ATOM.webp", 300, 100], ["AdEngage.webp", 150, 100], ["AeonProcare.webp", 150, 100], ["Agrocel.webp", 150, 100], ["AmbujaNeotia.webp", 300, 100], ["Ashapura.webp", 150, 100], ["Ashoka-Buildcon.webp", 300, 100], ["BVG-Humanity-Ahead.webp", 300, 100], ["Baldota.webp", 150, 100], ["Bhatia-Hospital.webp", 300, 100], ["Bhilosa.webp", 300, 100], ["Biostadt.webp", 300, 100], ["CK-Birla-Hospitals.webp", 300, 100], ["CRIL.webp", 150, 100], ["CamplinKokuyo.webp", 150, 100], ["Creative.webp", 150, 100], ["DBMSC-Steel.webp", 150, 100], ["Daily-objects.webp", 150, 100], ["Decor.webp", 300, 100], ["Delux.webp", 150, 100], ["FNB.webp", 150, 100], ["GNA-Gears.webp", 150, 100], ["Garden-Vareli.webp", 300, 100], ["GardenVareli.webp", 150, 100], ["General-India.webp", 300, 100], ["Gopal-Snacks.webp", 150, 100], ["Gorica.webp", 300, 100], ["HavmorIceCream.webp", 150, 100], ["HeroCycles.webp", 150, 100], ["IBGroup.webp", 150, 100], ["IRB.webp", 150, 100], ["ITCem.webp", 150, 100], ["Infinitie-Tech.webp", 300, 100], ["KLT-Group.webp", 300, 100], ["Kairish.webp", 150, 100], ["Kaisha-LifeSciences.webp", 300, 100], ["Kaisha-Packaging.webp", 300, 100], ["Konark.webp", 150, 100], ["MAX-Estates.webp", 150, 100], ["MKC.webp", 300, 100], ["MP-birla.webp", 150, 100], ["Mantra-Innvoation.webp", 300, 100], ["Mobistar.webp", 150, 100], ["Movate.webp", 150, 100], ["Operisoft.webp", 300, 100], ["Orient.webp", 150, 100], ["PGPGlass.webp", 150, 100], ["QS.webp", 150, 100], ["Raymond.webp", 300, 100], ["RehmanGroup.webp", 150, 100], ["Reliance-Power.webp", 300, 100], ["Routes2Roots.webp", 300, 100], ["SARA.webp", 150, 100], ["SPL.webp", 150, 100], ["Sanathan-Textiles.webp", 300, 100], ["Sumilon.webp", 150, 100], ["TALAL.webp", 150, 100], ["TATA-Communications.webp", 300, 100], ["TCG.webp", 300, 100], ["Taiyo-Nippo-sanso.webp", 300, 100], ["Timeline.webp", 300, 100], ["VISA-Steel.webp", 300, 100], ["Vadilal.webp", 150, 100], ["amplify-analytix.webp", 150, 100], ["digvijay-cement.webp", 300, 100], ["garware.webp", 150, 100], ["pcptel.webp", 150, 100], ["ramee-dream.webp", 150, 100], ["sadbhav.webp", 150, 100], ["sandesh.webp", 300, 100], ["satyeshBrinechem.webp", 150, 100], ["sovereign.webp", 300, 100]];
  var REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function build(){
    var band=document.querySelector('main.ax-page .ax-mq');
    if(!band||band.dataset.axPlg) return;
    band.dataset.axPlg='1';
    [].slice.call(band.children).forEach(function(c){ c.style.display='none'; });

    var wrap=document.createElement('div');
    wrap.className='ax-plg';
    wrap.setAttribute('aria-label','Customer logos, drag to scroll');
    var track=document.createElement('div');
    track.className='ax-plg__track';
    function fill(dup){
      LOGOS.forEach(function(L){
        var i=document.createElement('img');
        i.src='/assets/partners/private/'+L[0];
        i.width=L[1]; i.height=L[2];
        i.alt=dup?'':L[0].replace(/\.webp$/,'').replace(/[-_]/g,' ');
        if(dup) i.setAttribute('aria-hidden','true');
        i.loading='lazy'; i.decoding='async'; i.draggable=false;
        track.appendChild(i);
      });
    }
    fill(false); fill(true);
    wrap.appendChild(track);
    band.appendChild(wrap);

    var x=0, cycle=0, last=0, raf=0, drag=null, vis=true;
    var SPEED=0.035;                       /* px per ms, ~35px/s */
    function measure(){ cycle=track.scrollWidth/2 || track.getBoundingClientRect().width/2; }
    function wrapX(){
      if(!cycle) return;
      while(x<=-cycle) x+=cycle;
      while(x>0) x-=cycle;
    }
    function paint(){ track.style.transform='translateX('+x+'px)'; }
    function frame(t){
      raf=requestAnimationFrame(frame);
      if(!last) last=t;
      var dt=t-last; last=t;
      if(drag||!vis||REDUCED) return;      /* held, off-screen, or reduced motion */
      x-=dt*SPEED; wrapX(); paint();
    }
    measure(); paint();
    addEventListener('resize',function(){ measure(); wrapX(); paint(); });
    /* images arrive late; the track width is not final until they do */
    setTimeout(function(){ measure(); },1200);
    setTimeout(function(){ measure(); },3000);

    new IntersectionObserver(function(es){ vis=es[es.length-1].isIntersecting; last=0; },
      {threshold:0}).observe(band);
    raf=requestAnimationFrame(frame);

    /* drag: pointer events cover mouse, pen and touch in one path */
    wrap.addEventListener('pointerdown',function(e){
      if(e.button&&e.button!==0) return;
      drag={px:e.clientX, x0:x};
      wrap.classList.add('is-drag');
      try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
    });
    wrap.addEventListener('pointermove',function(e){
      if(!drag) return;
      x=drag.x0+(e.clientX-drag.px); wrapX(); paint();
    });
    function release(e){
      if(!drag) return;
      drag=null; last=0;
      wrap.classList.remove('is-drag');
      try{ wrap.releasePointerCapture(e.pointerId); }catch(err){}
    }
    wrap.addEventListener('pointerup',release);
    wrap.addEventListener('pointercancel',release);
    wrap.addEventListener('lostpointercapture',release);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(build,300); });
  else setTimeout(build,300);
  addEventListener('load',function(){ setTimeout(build,600); });
})();
</script>
