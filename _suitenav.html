<style id="ax-suitenav-css">
/* ---- HOMEPAGE SUITE INDEX: SCROLL, DO NOT NAVIGATE ----
   The six product names down the left of the SaaS-suite section were linkified by the
   chrome CTA pass, so clicking SupplierX / OrderX / Xpense / LogystiX / ManufeX /
   AeonX.IQ left the homepage for /products/axiom/ and flashed the page-transition
   scrim on the way. Each product already has its own panel further down THIS page, so
   the list is an index: a click should move to that panel. */
.ax-sn-item{cursor:pointer}
/* These plates are exported at opacity .4 and the shared hover system also paints
   background-color on them, so an inline style loses: brand orange came out salmon
   and two rows could look active at once. The class owns both states outright and
   the plates are unhooked from the hover system in JS. */
.ax-sn-row{background-color:transparent!important;opacity:1!important;
  transition:background-color .25s ease}
.ax-sn-row.is-on{background-color:rgb(223,63,23)!important}
.ax-sn-row:not(.is-on):hover{background-color:rgba(223,63,23,.08)!important}
.ax-sn-label{transition:color .25s ease}
.ax-sn-label.is-on{color:#fff!important}
@media (prefers-reduced-motion:reduce){.ax-sn-row,.ax-sn-label{transition:none}}
</style>
<script>
(function(){
  var NAMES=/^(SupplierX|OrderX|Xpense|LogystiX|ManufeX|AeonX ?\.?IQ)$/i;
  function txt(e){ return (e.textContent||'').replace(/\s+/g,' ').trim(); }
  function y(el){ var r=el.getBoundingClientRect(); return r.top+window.pageYOffset; }

  /* Identify the row plate and the panel target from the DESIGN's own inline
     left/top/width/height (vw), never from getBoundingClientRect(). This section
     sits far down the page, so at init time (load+120ms) it is still held by the
     scroll-reveal at translateY(1.4vw), off-screen and unrevealed -- a rect-based
     search run at that instant can pick the wrong plate (SupplierX's row plate is
     the FIRST in its column, and lost the containment test to the column's own
     outer tile wrapper, which had no reveal transform of its own and so measured
     as if it fully contained the still-shifted label). Inline style is authored
     geometry: it never moves, so identification is correct however early this
     runs. goTo()/the click hit-test still read live rects, which is exactly right
     there -- by click time the section is always revealed. */
  function num(el,p){ var v=el.style[p]; if(!v) return null;
    var m=/^(-?[\d.]+)vw$/.exec(String(v).trim()); return m?parseFloat(m[1]):null; }
  function box(el,root){
    var l=num(el,'left'), t=num(el,'top'), w=num(el,'width'), h=num(el,'height');
    if(l===null||t===null||w===null||h===null) return null;
    var p=el.parentElement;
    while(p&&p!==root){ var pl=num(p,'left'), pt=num(p,'top');
      if(pl!==null) l+=pl; if(pt!==null) t+=pt; p=p.parentElement; }
    return {el:el,l:l,t:t,w:w,h:h,r:l+w,b:t+h};
  }

  function init(){
    var root=document.querySelector('main.ax-page');
    var vis=[].slice.call(document.querySelectorAll('main.ax-page .g-t')).filter(function(e){
      return e.getBoundingClientRect().width>0 && !e.closest('.ax-mob');
    });
    var vbox=vis.map(function(e){ return {el:e, b:box(e,root)}; }).filter(function(o){ return o.b; });
    /* the index: the big product names stacked in one column */
    var items=vbox.filter(function(o){
      return NAMES.test(txt(o.el)) && parseFloat(getComputedStyle(o.el).fontSize) > 20;
    });
    if(items.length<4) return;
    items.sort(function(a,b){ return a.b.t-b.b.t; });
    items=items.map(function(o){ return o.el; });

    /* each product's panel: the eyebrow heading directly above its "Explore <name>"
       pill. Found by geometry so a Figma re-pull cannot break the mapping. */
    function panelFor(name){
      var key=name.replace(/[^a-z0-9]/gi,'').toLowerCase();
      var pill=vbox.filter(function(o){
        var t=txt(o.el).toLowerCase();
        return t.indexOf('explore')===0 && t.replace(/[^a-z0-9]/g,'').indexOf(key)>6;
      })[0];
      if(!pill) return null;
      var py=pill.b.t, best=null;
      vbox.forEach(function(o){
        var ey=o.b.t;
        if(ey>=py||py-ey>46.9) return;                 /* 900px at the 1920 design width */
        if(parseFloat(getComputedStyle(o.el).fontSize)<26) return;
        if(!best||ey>best.b.t) best=o;
      });
      return best?best.el:null;
    }

    /* the row plate behind each name; the design paints the active one brand orange */
    function rowFor(el){
      var r=box(el,root), best=null, bestA=Infinity;
      if(!r) return null;
      [].slice.call(document.querySelectorAll('main.ax-page .g-b')).forEach(function(candEl){
        var q=box(candEl,root);
        if(!q||!q.w||q.w>31.25) return;                /* 600px at the 1920 design width */
        if(q.l>r.l+0.3||q.r<r.r-0.3||q.t>r.t+0.3||q.b<r.b-0.3) return;
        var a=q.w*q.h;
        if(a<bestA){ bestA=a; best=candEl; }
      });
      return best;
    }

    /* Unhook the plates from the shared hover system and from their own inline
       paint, so nothing else can write background-color on them mid-transition. */
    var rows=items.map(rowFor);
    function unhook(el){
      el.className=el.className.split(/\s+/).filter(function(c){
        return c && c.indexOf('ax-hv')!==0; }).join(' ');
    }
    rows.forEach(function(b,i){
      if(!b) return;
      unhook(b);
      b.style.backgroundColor=''; b.style.opacity='';
      b.classList.add('ax-sn-row');
      unhook(items[i]);
      items[i].classList.add('ax-sn-label');
    });

    /* The six rows sit inside ONE outer card -- itself a painted, rounded .g-b that
       _hover.html's generic tile scan also recognises as a candidate, with all six
       labels as its members (row/label were only unhooked above, not the wrapper).
       That gave every label a SECOND, competing owner: _hover.html's own tile group
       toggles ax-hv-on/ax-hv-m on the whole six-item column as one unit, and its
       load+60ms rescan re-applies that regardless of what this file strips at init.
       The visible symptom was exactly this: SupplierX -- topmost in the column, so
       the one row whose bounds the wrapper's own candidacy most easily re-covers --
       stopped answering clicks anywhere but its own text once a tab switch had
       triggered a rescan, while the label itself (matched by target identity,
       independent of which group owns the row) kept working.
       Find that wrapper (the smallest .g-b spanning every row) and strip it too,
       then clear ITS OWN inline background/border so _hover.html's candidacy check
       -- which requires background-color or border in the element's own style --
       fails on every later rescan. Two independent systems must not both own the
       same plates. */
    (function unhookWrapper(){
      var top=Infinity, left=Infinity, bottom=-Infinity, right=-Infinity;
      rows.concat(items).forEach(function(el){
        if(!el) return;
        var b=box(el,root); if(!b) return;
        if(b.l<left) left=b.l; if(b.t<top) top=b.t;
        if(b.r>right) right=b.r; if(b.b>bottom) bottom=b.b;
      });
      if(!isFinite(top)) return;
      var best=null, bestA=Infinity;
      [].slice.call(document.querySelectorAll('main.ax-page .g-b')).forEach(function(candEl){
        if(rows.indexOf(candEl)!==-1) return;
        var q=box(candEl,root);
        if(!q||q.l>left+0.3||q.t>top+0.3||q.r<right-0.3||q.b<bottom-0.3) return;
        var a=q.w*q.h;
        if(a<bestA){ bestA=a; best=candEl; }
      });
      if(!best) return;
      unhook(best);
      best.style.backgroundColor=''; best.style.borderColor=''; best.style.border='';
    })();

    function select(i){
      rows.forEach(function(b,n){ if(b) b.classList.toggle('is-on', n===i); });
      items.forEach(function(e,n){ e.classList.toggle('is-on', n===i); });
    }

    var targets=items.map(function(e){ return panelFor(txt(e)); });

    function goTo(i){
      var t=targets[i];
      if(!t) return;
      var hdr=document.querySelector('header');
      var off=(hdr?hdr.getBoundingClientRect().height:0)+24;
      var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top:Math.max(0,y(t)-off), behavior:reduce?'auto':'smooth'});
      select(i);
    }

    items.forEach(function(el,i){
      if(!targets[i]) return;
      el.classList.add('ax-sn-item');
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.removeAttribute('data-href');
      var row=rows[i];
      if(row) row.classList.add('ax-sn-item');
      /* WINDOW capture, not document capture: the page-transition scrim listens on
         document capture and the CTA linkifier on the element itself. A window-phase
         listener runs before both, so stopping there kills the navigation AND the
         scrim flash. */
      window.addEventListener('click',function(e){
        var t=e.target, hit=(t&&t.nodeType===1&&(el===t||el.contains(t)||(row&&(row===t||row.contains(t)))));
        if(!hit&&(e.clientX||e.clientY)){
          var q=(row||el).getBoundingClientRect();
          hit=q.width>0&&e.clientX>=q.left&&e.clientX<=q.right&&e.clientY>=q.top&&e.clientY<=q.bottom;
        }
        if(!hit) return;
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
        goTo(i);
      },true);
      el.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); goTo(i); } });
    });

    /* keep the highlight honest while the reader scrolls the panels themselves */
    var ticking=false;
    window.addEventListener('scroll',function(){
      if(ticking) return; ticking=true;
      requestAnimationFrame(function(){
        ticking=false;
        var mid=window.pageYOffset+window.innerHeight*0.35, cur=0;
        targets.forEach(function(t,n){ if(t&&y(t)<=mid) cur=n; });
        select(cur);
      });
    },{passive:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(init,120); });
  else setTimeout(init,120);
})();
</script>
