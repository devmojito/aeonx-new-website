<style id="ax-ptorbit-css">
/* ---- "Earned where it matters." partner ring ----
   The partner marks orbit the disc. The badges are Figma's own elements at Figma's own
   coordinates and the disc behind them is Figma's own render; only the motion is added,
   because the file carries no prototype interaction for this section.

   The wrapper turns and each badge turns back by the same amount, so a logo orbits
   without ever tipping. Only the badges move: the disc and its glow stay put. */
.ax-ptorb{position:absolute;left:0;top:0;width:100%;height:100%;
  pointer-events:none;transform-origin:var(--ax-orb-x,50%) var(--ax-orb-y,50%);
  animation:ax-ptorb-spin 72s linear infinite;will-change:transform}
/* --ax-b0 is the badge's OWN rotation, which the export writes inline as a
   transform. A keyframe replaces transform outright, so without folding that angle
   into the animation the counter-rotation would wipe it and every badge would ride
   the ring tilted. */
.ax-ptorb-b{transform-origin:50% 50%;pointer-events:auto;
  animation:ax-ptorb-rev 72s linear infinite;will-change:transform}
@keyframes ax-ptorb-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes ax-ptorb-rev{
  from{transform:rotate(calc(var(--ax-b0,0deg)))}
  to{transform:rotate(calc(var(--ax-b0,0deg) - 360deg))}}
/* Rest on hover so a logo can actually be read and clicked. */
.ax-ptorb:hover,.ax-ptorb:hover .ax-ptorb-b{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){
  .ax-ptorb,.ax-ptorb-b{animation:none!important}
}
</style>
<script>
/* ---- PARTNER RING ROTATION ----

   This existed before as `ax-ptorbit-css` baked into the old hand-managed index.html.
   The V2 swap dropped it, because the check for whether it was still needed looked for
   `.ax-ptorb` -- a class this script CREATES at runtime. With the script not running it
   could never be present, so the check was guaranteed to say "no target" no matter what
   was on the page. Same false negative killed the Trusted Companies marquee.

   The old version anchored on data-ref="bake-ptdisc-desk" / "bake-ptdisc-mob", the two
   pre-baked disc images. Only the mobile one survives on the V2 homepage: the desktop
   bake maps Figma node 6564:26542, which lives on the OLD canvas, so it never fires for
   a page generated from the V2 canvas. Anchoring on geometry instead covers both, and
   does not care which canvas a page came from.

   The signature is a big square disc with eight or more smaller siblings whose centres
   all sit the same distance from the disc's centre. On the V2 desktop homepage that is
   the 35.16vw Overlay+Shadow disc ringed by twelve partner marks; on mobile it is the
   same twelve around the baked disc.

   A badge is THREE elements, not one: two `g-b` plates (the white pill and its shadow
   ring) plus a `g-img` logo, and only the logo carries artwork. An earlier attempt here
   filtered for "square sibling carrying art" and grouped by width, which matched only
   the logos, and every logo is a slightly different size, so no group ever reached the
   threshold and the ring was silently skipped. Everything on the circle moves, whatever
   it is; each piece counter-rotates about its own centre, so a badge stays upright no
   matter how many elements it is made of. */
(function () {
  var MIN_BADGES = 8;
  var TOL = 0.12;          /* radii must agree within 12% to count as a circle */

  function num(el, prop) {
    var m = /(-?[\d.]+)vw/.exec(String((el.style && el.style[prop]) || ''));
    return m ? parseFloat(m[1]) : null;
  }

  function centre(e) {
    var l = num(e, 'left'), t = num(e, 'top'), w = num(e, 'width'), h = num(e, 'height');
    if (l === null || t === null || !w || !h) return null;
    return { x: l + w / 2, y: t + h / 2, w: w, h: h };
  }

  function ring(host) {
    var hw = num(host, 'width');
    if (!hw) return null;

    /* The disc: the one child that fills most of the host and is square. Spin about ITS
       centre, not the badges' bounding box -- the marks are not evenly distributed, so
       their own centroid is off and the ring would visibly wobble. */
    var disc = null, discC = null;
    [].forEach.call(host.children, function (e) {
      var c = centre(e);
      if (!c || c.w < hw * 0.5) return;
      if (Math.abs(c.w - c.h) > c.w * 0.06) return;
      if (!disc || c.w > discC.w) { disc = e; discC = c; }
    });
    if (!disc) return null;

    /* Everything small enough to be a badge piece, measured from the disc's centre. */
    var cand = [];
    [].forEach.call(host.children, function (e) {
      if (e === disc || !e.classList || e.classList.contains('ax-ptorb')) return;
      var c = centre(e);
      if (!c || c.w > discC.w * 0.25) return;
      cand.push({ e: e, r: Math.hypot(c.x - discC.x, c.y - discC.y) });
    });
    if (cand.length < MIN_BADGES) return null;

    /* Keep the ones actually on the circle. Median radius, not mean: a stray element
       parked at the centre would drag a mean badly. */
    var sorted = cand.map(function (c) { return c.r; }).sort(function (a, b) { return a - b; });
    var med = sorted[Math.floor(sorted.length / 2)];
    if (!med) return null;
    var on = cand.filter(function (c) { return Math.abs(c.r - med) <= med * TOL; });
    if (on.length < MIN_BADGES) return null;

    return { badges: on.map(function (c) { return c.e; }), cx: discC.x, cy: discC.y };
  }

  function spin(host) {
    if (host.querySelector(':scope > .ax-ptorb')) return false;
    var r = ring(host);
    if (!r) return false;

    var hw = num(host, 'width'), hh = num(host, 'height');
    var orb = document.createElement('div');
    orb.className = 'ax-ptorb';
    orb.setAttribute('aria-hidden', 'false');
    /* Turn about the badges' own centre. Expressed as a percentage of the host so it
       stays correct at any viewport width, since the layout is in vw throughout. */
    if (hw && hh) {
      orb.style.setProperty('--ax-orb-x', (r.cx / hw * 100).toFixed(3) + '%');
      orb.style.setProperty('--ax-orb-y', (r.cy / hh * 100).toFixed(3) + '%');
    }
    /* Insert where the first badge was, so paint order over the disc is unchanged. */
    host.insertBefore(orb, r.badges[0]);
    r.badges.forEach(function (b) { b.classList.add('ax-ptorb-b'); orb.appendChild(b); });

    /* Round the plates. In Figma each badge is a `Link` frame with cornerRadius 500,
       a circle, holding a square `Background` rectangle that the frame clips away. The
       export flattens that: the plate ships as a bare square with no radius and no
       clipping wrapper, so its corners stick out past the circular badge. Static, that
       reads as a faint grey box behind each logo; rotating, any drift between the
       wrapper's animation and a plate's own counter-rotation shows as a visibly tilted
       square. A circle has neither problem, and it is what the design specifies.

       Only the plates: sized off the largest piece on the ring, so the logo sitting on
       top of each plate is left alone. */
    var maxW = 0;
    r.badges.forEach(function (b) { maxW = Math.max(maxW, num(b, 'width') || 0); });
    r.badges.forEach(function (b) {
      var w = num(b, 'width');
      if (w && w >= maxW - 0.01) b.style.borderRadius = '50%';
      /* Hand the badge's own angle to the counter-rotation keyframes, then drop the
         inline transform so the animation is the only thing writing it. */
      var m = /rotate\((-?[\d.]+)deg\)/.exec(b.style.transform || '');
      b.style.setProperty('--ax-b0', (m ? m[1] : '0') + 'deg');
      b.style.transform = '';
    });
    return true;
  }

  function run() {
    var n = 0;
    [].forEach.call(document.querySelectorAll('.g-b, .g-b.g-clip'), function (host) {
      if (host.children.length < MIN_BADGES) return;
      if (spin(host)) n++;
    });
    return n;
  }

  /* After the reveal pass and the carousel have finished moving things, so a badge is
     not adopted out from under us. */
  if (document.readyState === 'complete') setTimeout(run, 0);
  else addEventListener('load', function () { setTimeout(run, 0); });
})();
</script>
