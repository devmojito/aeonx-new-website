<style id="ax-annc-css">
/* Nothing to style: the bar already has its design. This block only exists so
   _postbuild.py has a sentinel to test for. */
</style>
<script>
/* ---- ANNOUNCEMENT BAR, EDITED FROM /manage/ ----
   The strip above the nav is baked into all 91 pages, so changing its wording used
   to mean a rebuild and a redeploy -- which is why it shipped carrying Figma's
   placeholder ("Grep, Embeddings, or Both? ... June 30th") for months. It now reads
   siteconfig.Announcement at runtime.

   Same contract as the investor document browser: with no API reachable the page
   keeps whatever is baked into it, so an outage degrades to slightly stale copy
   rather than an empty orange band. */
(function () {
  var API_BASE = (window.AX_API_BASE ||
    (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8000' : ''))
    .replace(/\/+$/, '');
  /* Empty string is the CORRECT base: the site and the API are served by one
     CloudFront distribution, so a relative fetch is same-origin. Testing for
     !API_BASE made every page skip the API on production entirely. */
  if (!window.fetch) return;

  /* Hiding the bar shortens the fixed header, and a page whose layout reserved a
     strip for it is then left with an empty band under the nav.

     Only some pages reserve it. The V2 homepage starts its content at 5.885vw,
     which is the bar plus the nav, because Figma drew both above the fold. A
     sub-page starts at 2.29vw and its hero art is meant to run up under the nav,
     so it reserves nothing and must not move.

     That is the discriminator: the page reserved the strip only if its topmost
     element begins at or below the WHOLE header, bar included. Comparing against
     the bar alone would catch the sub-pages too, since their 44px start happens
     to equal the bar's height. With the reserve confirmed the page moves up by
     the bar's height and nothing else. A negative margin is enough: everything
     inside is absolutely positioned against .ax-page, so the whole page travels
     together and the document gets shorter by the same amount.

     Measured while the bar is still visible, and in vw, so a resize keeps it. */
  function reclaim(bar) {
    var h = bar.getBoundingClientRect().height;
    var header = bar.closest('header') || bar.parentElement;
    var H = header ? header.getBoundingClientRect().height : 0;
    if (!(h > 1) || !(H > h) || !window.innerWidth) return;
    var page = document.querySelector('main.ax-page');
    if (!page || page.closest('.ax-mob')) return;   /* mobile hides the chrome outright */
    var top = Infinity;
    [].forEach.call(page.children, function (el) {
      var t = el.getBoundingClientRect().top;
      if (t < top) top = t;
    });
    if (!(top >= H - 1)) return;                    /* nothing was reserved */
    page.style.marginTop = '-' + (h / window.innerWidth * 100).toFixed(4) + 'vw';
  }

  function apply(d) {
    var bars = document.querySelectorAll('a.ax-annc, .ax-annc');
    if (!bars.length) return;
    [].forEach.call(bars, function (bar) {
      var txt = bar.querySelector('.ax-annc__txt');
      if (!d.active || !d.text) { reclaim(bar); bar.hidden = true; bar.style.display = 'none'; return; }
      bar.hidden = false;
      bar.style.removeProperty('display');
      if (txt) txt.textContent = d.text;
      if (bar.tagName === 'A') {
        if (d.url) {
          bar.setAttribute('href', d.url);
          bar.style.removeProperty('cursor');
          /* off-site links open in a new tab, matching every other external CTA */
          if (/^https?:/i.test(d.url) && d.url.indexOf(location.host) === -1) {
            bar.setAttribute('target', '_blank');
            bar.setAttribute('rel', 'noopener noreferrer');
          } else {
            bar.removeAttribute('target');
            bar.removeAttribute('rel');
          }
        } else {
          /* No destination: keep it as text rather than a link that goes nowhere.
             href="#" would jump to the top of the page and looks broken. */
          bar.removeAttribute('href');
          bar.removeAttribute('target');
          bar.style.cursor = 'default';
        }
      }
    });
  }

  fetch(API_BASE + '/api/announcement/', { credentials: 'omit' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d) apply(d); })
    .catch(function () { /* keep the baked copy */ });
})();
</script>
