<script>
/* ---- STAT COUNTERS ---- */
(function(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(!('IntersectionObserver' in window)) return;

  /* Only the big display numbers. Figma splits these into per-character spans with
     their own gradient fills ("280" orange, "+" blue), so we animate the TEXT NODE
     that holds the digits and never touch the markup around it -- rewriting the
     element's text would strip the gradient spans. */
  /* Threshold is viewport-relative: the layout is in vw, so a fixed px floor would
     silently switch the counters off on a narrower window. 30 = px at a 1920 render. */
  var MIN_REL = 30;
  var DUR = 1400;
  var jobs = [];

  /* Figma keeps the whole label in one text node ("280+", "15+", "4X", "18 wks"),
     so match a LEADING digit run and preserve whatever trails it. */
  var NUM = /^(\s*)(\d{1,3}(?:,\d{3})+|\d+)(\D*)$/;

  function collect(root){
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var n;
    while ((n = walker.nextNode())) {
      var raw = n.nodeValue;
      var m = NUM.exec(raw);
      if (!m) continue;
      var host = n.parentElement;
      if (!host) continue;
      var size = parseFloat(getComputedStyle(host).fontSize) || 0;
      if (size / (innerWidth || 1) * 1920 < MIN_REL) continue;
      var target = parseInt(m[2].replace(/,/g,''), 10);
      if (!(target > 1)) continue;                 /* "1" or "0" has nothing to count */
      /* the owning block is what we watch for visibility, not the bare text node */
      var box = host.closest('.g-t') || host;
      /* A zero-padded number is a step label, not a stat: Figma draws "01".."04"
         static. Counting it also dropped the zero, because the value is written back
         through String() -- the culture page's pillars read 1..4 on mobile, where
         the numbers are large enough to clear the size threshold. */
      if (/^0\d/.test(m[2])) continue;
      /* A stat is a short standalone label -- "280+", "15+", "4X", "18 wks". These
         three are numbers that merely START a line, and animating them rewrote real
         copy: the Foundation timeline's YEARS all read "0" until the observer fired
         (and then counted 0 -> 2020, which reads as a bug either way), "175-seat
         infrastructure. Workforce growth across six offices…" became "0-seat
         infrastructure…", and the investor pages' live "3 documents" count -- which
         the document browser writes itself from the API -- was reset to "0 documents"
         underneath it. Mobile is where this showed, because the type is big enough
         there to clear MIN_REL; desktop draws the same nodes smaller. */
      if (/^(19|20)\d\d$/.test(m[2]) && !m[3].trim()) continue;   /* a year */
      if (raw.trim().length > 24) continue;                        /* prose, not a stat */
      if (/^\s*documents?\b/i.test(m[3])) continue;                /* live API count */
      jobs.push({ node:n, target:target, grouped:/,/.test(m[2]),
                  pre:m[1], suf:m[3], box:box, done:false });
      n.nodeValue = m[1] + '0' + m[3];
    }
  }
  function init(){
    collect(document.querySelector('main.ax-page') || document);
    var mob = document.querySelector('.ax-mob');
    if (mob) collect(mob);
    arm();
  }

  function fmt(v, grouped){
    return grouped ? v.toLocaleString('en-US') : String(v);
  }
  function run(job){
    if (job.done) return; job.done = true;
    var t0 = 0;
    function step(t){
      if (!t0) t0 = t;
      var p = Math.min(1, (t - t0) / DUR);
      var e = 1 - Math.pow(1 - p, 3);             /* easeOutCubic */
      job.node.nodeValue = job.pre + fmt(Math.round(job.target * e), job.grouped) + job.suf;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function arm(){
    if (!jobs.length) return;
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (!e.isIntersecting) return;
        io.unobserve(e.target);
        jobs.forEach(function(j){ if (j.box === e.target) run(j); });
      });
    }, { threshold: 0.25 });
    jobs.forEach(function(j){ io.observe(j.box); });
    /* Same safety net the scroll-reveal uses: anything inside a clipped container may
       never fire an intersection, and a stat frozen at 0 is worse than no animation. */
    setTimeout(function(){ jobs.forEach(run); }, 6000);
  }
  /* the .ax-mob block may sit AFTER this script in the document */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
