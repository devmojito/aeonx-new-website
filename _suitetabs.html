   Both cards are INSTANCES of component sets (7037:41224, eight variants, and
   7037:41142, four) and the tab click is a prototype variant swap, so the export only
   carries the pinned variant and the other tabs were inert. The <template>s above are
   every variant, flattened by _suitetabs.py through the same _gen code as the page;
   this swaps the matching one into the card. Regenerate them with that script, not
   by hand.

   The card is found by content, not class (every layer is "Container"): the row of
   tab boxes whose labels read what the templates read, the panel directly under it
   and the white plate behind both. Positions are the ones already on the page, and
   the only sizes written are the panel and plate heights each variant carries. */
(function () {
  var ROUTES = {
    supplierx: 'https://supplierx.cloud/', orderx: 'https://orderx.cloud/',
    xpense: 'https://x-pense.cloud/', manufex: 'https://manufex.cloud/',
    logystix: 'https://logystix.cloud/', aeonxiq: 'https://aeonxiq.ai/',
    setumove: '/products/setu-move/', crm360: '/products/crm-360/', quic: '/products/quic/',
    jarvis: '/products/jarvis/', datasetu: '/products/datasetu-ai/', setuedge: '/products/setuedge/'
  };
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

  function txt(e) { return e ? (e.textContent || '').replace(/\s+/g, ' ').trim() : ''; }
  function n(e, k) { return parseFloat(e.style[k]) || 0; }
  function kids(e, sel) { return [].filter.call(e.children, function (c) { return c.matches(sel); }); }
  function labelOf(b) { var l = kids(b, '.g-t'); return l.length === 1 ? l[0] : null; }
  function near(a, b, tol) { return Math.abs(a - b) <= tol; }
  /* _uifx.html title-cases short labels it takes for controls ("SetuMove" -> "Setumove",
     "Open CRM360" -> "Open Crm360") and skips any label with element children. */
  function wrap(l) {
    if (l.children.length || !l.firstChild) return;
    var s = document.createElement('span');
    s.style.position = 'static';
    while (l.firstChild) s.appendChild(l.firstChild);
    l.appendChild(s);
  }

  function find(tpls) {
    var want = [].map.call(tpls[0].content.querySelectorAll('[data-t]'), function (d) {
      return txt(d.querySelector('.g-t'));
    });
    var hit = null;
    [].some.call(document.querySelectorAll('main.ax-page .g-b.g-clip'), function (b) {
      if (b.closest('.ax-mob') || txt(labelOf(b)) !== want[0]) return false;
      var sib = kids(b.parentElement, '.g-b');
      var tabs = want.map(function (w) {
        return sib.filter(function (s) {
          return s.classList.contains('g-clip') && near(n(s, 'top'), n(b, 'top'), 0.01) && txt(labelOf(s)) === w;
        })[0];
      });
      if (tabs.indexOf(undefined) > -1) return false;
      var panel = sib.filter(function (s) {
        return s.classList.contains('g-clip') && near(n(s, 'left'), n(b, 'left'), 0.3) &&
               near(n(s, 'top'), n(b, 'top') + n(b, 'height'), 0.3);
      })[0];
      if (!panel) return false;
      var bottom = n(panel, 'top') + n(panel, 'height');
      hit = {
        tabs: tabs, panel: panel,
        card: sib.filter(function (s) {
          return /background-color/.test(s.getAttribute('style')) && near(n(s, 'left'), n(panel, 'left'), 0.3) &&
                 n(s, 'top') < n(b, 'top') && near(n(s, 'top') + n(s, 'height'), bottom, 0.3);
        })[0],
        strip: sib.filter(function (s) {
          return !s.classList.contains('g-clip') && near(n(s, 'top'), n(b, 'top'), 0.2) &&
                 near(n(s, 'width'), n(panel, 'width'), 0.3);
        })[0]
      };
      return true;
    });
    return hit;
  }

  /* The product name and the Open button both lead to the product. The button becomes
     a real anchor; its label and arrow, drawn on top, let the click through to it. */
  function dress(p, href) {
    var ts = kids(p, '.g-t');
    kids(p, '.g-b').forEach(function (b) { b.dataset.axOwned = '1'; });
    if (!href) return;
    var ext = /^https?:/.test(href);
    var title = ts.slice().sort(function (a, b) { return n(b, 'fontSize') - n(a, 'fontSize'); })[0];
    if (title) {
      title.dataset.cta = '1';
      title.dataset.axTo = href;
      title.style.cursor = 'pointer';
      title.addEventListener('click', function () {
        if (ext) window.open(href, '_blank', 'noopener'); else location.href = href;
      });
    }
    var btn = ts.filter(function (e) { return /^Open\s/.test(txt(e)); })[0];
    if (!btn) return;
    var L = n(btn, 'left'), T = n(btn, 'top'), R = L + n(btn, 'width'), B = T + n(btn, 'height');
    function holds(e) {
      return n(e, 'left') <= L + 0.05 && n(e, 'top') <= T + 0.05 &&
             n(e, 'left') + n(e, 'width') >= R - 0.05 && n(e, 'top') + n(e, 'height') >= B - 0.05;
    }
    var pill = kids(p, '.g-b').filter(function (b) {
      return /background-color/.test(b.getAttribute('style')) && holds(b);
    }).sort(function (a, b) { return n(a, 'width') * n(a, 'height') - n(b, 'width') * n(b, 'height'); })[0];
    if (!pill) return;
    /* Zero-sized, with the pill drawn inside it. _hover.html skins every <a> it can
       measure, but only on its load scan, so the pinned variant's button got its hover
       and every button swapped in later did not; this keeps them all on the one above.
       data-cta stops its unblocker switching the pill's pointer events off. */
    var a = document.createElement('a');
    a.className = 'ax-st-go';
    a.dataset.cta = '1';
    a.dataset.axTo = href;
    a.href = href;
    a.setAttribute('aria-label', txt(btn));
    if (ext) { a.target = '_blank'; a.rel = 'noopener'; }
    var PL = n(pill, 'left'), PT = n(pill, 'top'), PR = PL + n(pill, 'width'), PB = PT + n(pill, 'height');
    a.style.cssText = 'position:absolute;left:' + PL + 'vw;top:' + PT + 'vw;width:0;height:0';
    p.replaceChild(a, pill);
    pill.style.left = '0';
    pill.style.top = '0';
    a.appendChild(pill);
    kids(p, '.g-vec').forEach(function (v) {
      if (n(v, 'left') >= PL && n(v, 'top') >= PT && n(v, 'left') <= PR && n(v, 'top') <= PB) v.style.pointerEvents = 'none';
    });
    btn.style.pointerEvents = 'none';
    btn.dataset.cta = '1';
    wrap(btn);
  }

  /* Logo per product for the composed panels: the homepage product tabs' lockups where
     they exist, otherwise the product's own mark. [src, width / height] */
  var ART = {
    orderx: ['/assets/gen/8c5b7ed3f14c88fdf9ede7afee31eb0cc4190f51.webp', 1200 / 364],
    manufex: ['/assets/vec/7036-37965.svg', 1],
    crm360: ['/assets/gen/99c43e8329c311d83e019afba68fb8914ec28d08.webp', 1],
    aeonxiq: ['/assets/gen/261011cd380ff677e9627a3faa33b218e91375c3.webp', 140 / 149],
    setumove: ['/assets/vec/6890-7191.svg', 496 / 126],
    quic: ['/assets/vec/6890-7433.svg', 320 / 126],
    jarvis: ['/assets/vec/6970-27176.svg', 1],
    datasetu: ['/assets/vec/6890-7467.svg', 518 / 126],
    setuedge: ['/assets/vec/7041-29844.svg', 1]
  };
  var BG = '/assets/gen/5fd0e3417a71ad9ce0ea61b32d9cd17bdce414ca.webp';
  function place(el, l, t, w, h) {
    el.style.left = l.toFixed(4) + 'vw'; el.style.top = t.toFixed(4) + 'vw';
    el.style.width = w.toFixed(4) + 'vw'; el.style.height = h.toFixed(4) + 'vw';
  }
  /* The picture block is the wide clipped box on the panel's right. Sizes are the
     homepage's: a 126px-tall logo, a 17px gap, a 207x56 button, centred as a group. */
  function compose(p, name, href) {
    var block = kids(p, '.g-b.g-clip').filter(function (b) { return n(b, 'width') > 40; })[0];
    if (!block || block.querySelector('.g-img') || !ART[name]) return;
    var BW = n(block, 'width'), BH = n(block, 'height');
    var lh = 6.5625, lw = lh * ART[name][1], gap = 0.8854, cw = 10.7812, ch = 2.9167;
    var top = (BH - (lh + gap + ch)) / 2;
    var bg = document.createElement('div');
    bg.className = 'ax-st-bg';
    var img = document.createElement('img');
    img.className = 'ax-st-art';
    img.alt = '';
    img.setAttribute('aria-hidden', 'true');
    img.src = ART[name][0];
    place(img, (BW - lw) / 2, top, lw, lh);
    block.appendChild(bg);
    block.appendChild(img);
    if (!href) return;
    var a = document.createElement('a');
    a.className = 'ax-st-cta';
    a.href = href;
    a.dataset.cta = '1';
    a.dataset.axTo = href;
    a.dataset.axOwned = '1';
    if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
    var sp = document.createElement('span');     /* keeps _uifx.html from recasing it */
    sp.textContent = 'Learn more';
    a.appendChild(sp);
    place(a, (BW - cw) / 2, top + lh + gap, cw, ch);
    block.appendChild(a);
  }

  function wire(tpls) {
    tpls.sort(function (a, b) { return a.dataset.tab - b.dataset.tab; });
    var W = find(tpls);
    if (!W || W.tabs.length !== tpls.length) return;
    var id = 'ax-st-' + tpls[0].dataset.set, cur = -1, token = 0;

    function paintTabs(i) {
      var src = tpls[i].content.querySelectorAll('[data-t]');
      W.tabs.forEach(function (t, j) {
        var live = labelOf(t);
        [].slice.call(t.children).forEach(function (k) { if (k !== live) t.removeChild(k); });
        [].forEach.call(src[j].children, function (k) {
          if (k.classList.contains('g-t')) live.setAttribute('style', k.getAttribute('style'));
          else {
            var c = k.cloneNode(true);
            /* Figma draws the active marker as a 16px stub at the tab's left edge;
               it runs the full width of the tab here. */
            if (n(c, 'height') < 0.3) { c.style.left = '0vw'; c.style.width = n(t, 'width') + 'vw'; }
            t.appendChild(c);
          }
        });
        t.setAttribute('aria-selected', j === i ? 'true' : 'false');
        t.tabIndex = j === i ? 0 : -1;
      });
    }
    function paintPanel(i) {
      var t = tpls[i], body = t.content.querySelector('[data-p]').cloneNode(true);
      W.panel.textContent = '';
      while (body.firstChild) W.panel.appendChild(body.firstChild);
      /* Jarvis is 12px taller than the others (its strapline wraps), and it grows into
         the dark band below the card rather than moving anything. */
      W.panel.style.height = t.dataset.ph + 'vw';
      if (W.card) W.card.style.height = t.dataset.ch + 'vw';
      W.panel.setAttribute('aria-labelledby', W.tabs[i].id);
      dress(W.panel, ROUTES[t.dataset.name]);
      compose(W.panel, t.dataset.name, ROUTES[t.dataset.name]);
    }
    function select(i, animate) {
      if (i === cur) return;
      cur = i;
      var mine = ++token;
      paintTabs(i);
      if (!animate || REDUCED) { paintPanel(i); return; }
      /* Hold the fade until the screenshots have decoded, or the panel flashes empty. */
      var urls = (tpls[i].innerHTML.match(/url\(([^)"']+)\)/g) || []).map(function (u) { return u.slice(4, -1); });
      if (ART[tpls[i].dataset.name]) urls.push(BG, ART[tpls[i].dataset.name][0]);
      var pending = urls.length, faded = false, shown = false;
      function show() {
        if (shown || mine !== token) return;
        shown = true;
        paintPanel(i);
        W.panel.style.opacity = '';
      }
      urls.forEach(function (u) {
        var im = new Image();
        im.onload = im.onerror = function () { if (--pending <= 0 && faded) show(); };
        im.src = u;
      });
      W.panel.style.opacity = '0';
      setTimeout(function () { faded = true; if (pending <= 0) show(); }, 150);
      setTimeout(show, 1500);
    }

    W.panel.id = id;
    W.panel.setAttribute('role', 'tabpanel');
    W.panel.dataset.axOwned = '1';
    if (W.strip) {
      W.strip.setAttribute('role', 'tablist');
      W.strip.setAttribute('aria-owns', W.tabs.map(function (t, i) { return id + '-t' + i; }).join(' '));
    }
    W.tabs.forEach(function (t, i) {
      var l = labelOf(t);
      t.id = id + '-t' + i;
      t.classList.add('ax-st-tab');
      t.setAttribute('role', 'tab');
      t.setAttribute('aria-controls', id);
      t.setAttribute('aria-label', txt(l));
      /* data-cta keeps the chrome's linkifier from making the label a link to the product. */
      l.dataset.cta = '1';
      wrap(l);
      /* Capture on the box, so no handler another pass bound to the label runs first. */
      t.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        select(i, true); t.focus();
      }, true);
      t.addEventListener('keydown', function (e) {
        var k = e.key, last = W.tabs.length - 1;
        var j = k === 'ArrowRight' ? i + 1 : k === 'ArrowLeft' ? i - 1 : k === 'Home' ? 0 :
                k === 'End' ? last : (k === 'Enter' || k === ' ') ? i : null;
        if (j === null) return;
        e.preventDefault();
        j = (j + W.tabs.length) % W.tabs.length;
        select(j, true);
        W.tabs[j].focus();
      });
    });
    /* The pinned variant is the tab drawn with an underline. It is re-rendered from its
       template too, so every state comes out of the same markup and wiring. */
    var start = W.tabs.map(function (t) { return t.children.length > 1; }).indexOf(true);
    select(start < 0 ? 0 : start, false);
    setTimeout(function () { W.panel.classList.add('ax-st-fade'); }, 0);
  }

  var sets = {};
  [].forEach.call(document.querySelectorAll('template.ax-st-v'), function (t) {
    (sets[t.dataset.set] = sets[t.dataset.set] || []).push(t);
  });
  Object.keys(sets).forEach(function (k) { wire(sets[k]); });
})();
</script>
